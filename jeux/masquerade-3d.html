<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masquerade of Madness 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050407; --noir:#0A080C; --noir2:#15121A; --velours:#1E1A22; --ivoire:#EFE8DA; --ivoire2:#CFC6B4; --argent:#B9B3A8; --argent2:#6E6962; --argent3:#3A3733;
  --carmin:#C8102E; --carmin2:#FF2340; --sang:#6A0010; --sang2:#3A0008; --cire:#FFD9A0;
  --deco:"Cinzel Decorative","Cinzel",Georgia,serif; --cap:"Cinzel",Georgia,serif; --serif:"Cormorant Garamond",Georgia,serif;
  --hatch:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; overflow-x:hidden}
body{margin:0; min-height:100%; color:var(--ivoire); background:var(--noir); font-family:var(--serif); font-weight:600; font-size:17px; overflow-x:hidden}
button{font:inherit; color:inherit}
/* ---------- la salle de bal (fond 2D) ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.scene svg{position:absolute; inset:0; width:100%; height:100%}
.scene::after{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(0,0,0,.75) 100%); transition:background 1.6s}
body.mad .scene::after{background:radial-gradient(ellipse at 50% 45%, rgba(90,0,12,.35) 0%, rgba(0,0,0,.93) 70%)}
.flame{animation:flame .18s steps(2) infinite alternate; transform-box:fill-box; transform-origin:50% 100%}
@keyframes flame{to{transform:scaleY(1.18) scaleX(.9)}}
.chand{transform-box:fill-box; transform-origin:50% 0; animation:chand 7s ease-in-out infinite alternate}
.chand.c2{animation-duration:9s; animation-delay:-3s} .chand.c3{animation-duration:8s; animation-delay:-5s}
@keyframes chand{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
body.s25 .chand{animation:chandMad 3.2s ease-in-out infinite alternate}
@keyframes chandMad{from{transform:rotate(-9deg)}to{transform:rotate(6deg)}}
.guest{transform-box:fill-box; transform-origin:50% 100%}
body.s75 .guest{animation:sway 3.4s ease-in-out infinite alternate} body.s75 .guest.g2{animation-delay:-1.2s} body.s75 .guest.g3{animation-delay:-2.1s}
@keyframes sway{from{transform:rotate(-3deg) translateX(-6px)}to{transform:rotate(3deg) translateX(6px)}}
body.s25 .guest{animation:closer 6s ease-in-out infinite alternate}
@keyframes closer{from{transform:scale(1)}to{transform:scale(1.12) translateY(8px)}}
.smile{opacity:0; transition:opacity 1.4s} body.s50 .smile{opacity:1} body.s50 .calm{opacity:0}
.eyes{transition:transform 1.2s} body.s25 .eyes{animation:stare 4s ease-in-out infinite alternate}
@keyframes stare{from{transform:translateX(-3px)}to{transform:translate(3px,1px)}}
.wrose{fill:#EFE8DA; transition:fill 2s} body.s25 .wrose{fill:#C8102E}
.unmask{opacity:0; transition:opacity 1s} body.mad .unmask{opacity:1} body.mad .masked{opacity:0}
.curtain{transform-box:fill-box; animation:curt 11s ease-in-out infinite alternate}
.curtain.r{animation-delay:-4s}
@keyframes curt{from{transform:skewX(-1deg)}to{transform:skewX(1.2deg)}}
/* ---------- la machine ---------- */
main{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:4px 10px 18px}
main.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
.topper{position:relative; height:150px; margin:0 0 -16px; z-index:2}
.topper svg.sign{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.logo{position:absolute; left:0; right:0; top:52px; margin:0; text-align:center; pointer-events:none}
.logo b{display:block; font-family:var(--deco); font-weight:900; font-size:clamp(1.85rem, 8.6vw, 2.5rem); line-height:1; letter-spacing:.06em; color:var(--ivoire);
  background:linear-gradient(180deg, #FFFFFF 0%, #EFE8DA 45%, #9A948A 52%, #E6DECE 70%, #8A847A 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px rgba(200,16,46,.45))}
.logo i{display:inline-block; margin-top:5px; font-family:var(--cap); font-style:normal; font-weight:900; font-size:clamp(.72rem, 3.4vw, .9rem); letter-spacing:.42em; padding:2px 10px 2px 16px; color:var(--ivoire);
  background:linear-gradient(90deg, transparent, var(--sang) 12%, var(--carmin) 50%, var(--sang) 88%, transparent); text-shadow:0 1px 0 #000}
.hbtns{position:absolute; right:2px; bottom:20px; display:flex; gap:5px; z-index:3}
.ico{width:32px; height:32px; border-radius:50%; border:1px solid var(--argent2); background:radial-gradient(circle at 40% 30%, #4A4640, #121015 70%); display:grid; place-items:center; cursor:pointer; padding:0;
  box-shadow:0 0 0 2px #000, inset 0 1px 0 rgba(255,255,255,.2)}
.ico svg{width:16px; height:16px}
.ico[aria-pressed="false"]{opacity:.45}
.ico:focus-visible,.btn:focus-visible,.spin:focus-visible,.sb:focus-visible,.badge:focus-visible,.partner:focus-visible,.mask:focus-visible,.offer:focus-visible{outline:2px solid var(--carmin2); outline-offset:3px}
.cabinet{position:relative; border-radius:8px; padding:10px 22px 0; background:var(--hatch), linear-gradient(180deg, #16131A, #08070A);
  border:1px solid var(--argent2); box-shadow:0 0 0 2px #000, 0 0 0 4px #4A4640, 0 0 0 5px #000, inset 0 0 0 1px rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.8), 0 0 60px rgba(200,16,46,.18)}
/* montants gravés et chandelles de chaque côté */
.pillar{position:absolute; top:44px; bottom:64px; width:14px; border-radius:3px; background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 9px), linear-gradient(90deg, #2A2724, #BDB6AA 40%, #57524C 70%, #1A1816); box-shadow:0 0 0 1px #000}
.pillar.l{left:4px} .pillar.r{right:4px}
.pillar::before,.pillar::after{content:""; position:absolute; left:-3px; right:-3px; height:10px; border-radius:3px; background:linear-gradient(#D8D0C2,#5A554E); box-shadow:0 0 0 1px #000}
.pillar::before{top:-6px} .pillar::after{bottom:-6px}
.candle{position:absolute; top:10px; width:10px; height:26px; border-radius:2px; background:linear-gradient(90deg,#CFC6B4,#FFF8EA,#A8A090); box-shadow:0 0 0 1px #000}
.candle.l{left:6px} .candle.r{right:6px}
.candle::before{content:""; position:absolute; left:50%; top:-15px; width:8px; height:14px; margin-left:-4px; border-radius:50% 50% 45% 45%; background:radial-gradient(circle at 50% 70%, #FFF6D0, #FFB050 60%, rgba(255,90,20,0) 72%); animation:flame .2s steps(2) infinite alternate; box-shadow:0 0 16px 6px rgba(255,170,80,.35)}
body.mad .candle::before{background:radial-gradient(circle at 50% 70%, #FFD0D0, #FF2340 60%, rgba(200,16,46,0) 72%); box-shadow:0 0 16px 6px rgba(255,35,64,.45)}
/* jauge de raison */
.sanity{display:flex; align-items:center; gap:8px; margin:2px 0 8px}
.sanity .lbl{font-family:var(--cap); font-weight:900; font-size:.72rem; letter-spacing:.2em; color:var(--argent)}
.sbar{position:relative; flex:1; height:16px; border-radius:2px; background:#050407; border:1px solid var(--argent2); box-shadow:0 0 0 1px #000, inset 0 2px 6px rgba(0,0,0,.8); overflow:hidden}
.sfill{position:absolute; inset:0 auto 0 0; width:100%; background:repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 1px, transparent 1px 6px), linear-gradient(90deg, #8A847A, #EFE8DA); transition:width .9s cubic-bezier(.3,1.2,.5,1), background 1s}
.sanity.low .sfill{background:repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 1px, transparent 1px 6px), linear-gradient(90deg, #6A0010, #C8102E)}
.sanity.low .sbar{animation:throb 1.1s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 1px #000, 0 0 12px rgba(255,35,64,.7)}}
.stxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--cap); font-weight:900; font-size:.68rem; letter-spacing:.18em; color:#fff; text-shadow:0 0 3px #000, 0 1px 0 #000}
.sanity.mad .sfill{width:100%!important; background:repeating-linear-gradient(-45deg, #3A0008 0 6px, #C8102E 6px 12px); animation:madbar 1s linear infinite}
@keyframes madbar{to{background-position:24px 0}}
.screen{position:relative; padding:6px; border-radius:4px; background:#050407; box-shadow:0 0 0 1px var(--argent2), 0 0 0 3px #000, inset 0 0 30px rgba(0,0,0,.9)}
body.mad .screen{box-shadow:0 0 0 1px var(--carmin), 0 0 0 3px #000, 0 0 30px rgba(200,16,46,.45), inset 0 0 30px rgba(0,0,0,.9)}
.hud{display:none; align-items:center; justify-content:space-between; gap:6px; padding:0 0 7px; flex-wrap:wrap}
body.bonus .hud{display:flex}
.hud .tier{font-family:var(--deco); font-weight:900; font-size:1.02rem; letter-spacing:.04em; width:100%; display:flex; justify-content:space-between; align-items:baseline; gap:8px; white-space:nowrap; color:var(--ivoire); text-shadow:0 0 8px rgba(200,16,46,.6)}
.hud .tier span:last-child{font-family:var(--serif); font-style:italic; font-size:.92rem; color:var(--argent); text-shadow:none; overflow:hidden; text-overflow:ellipsis}
.chip{background:rgba(239,232,218,.05); border:1px solid var(--argent2); border-radius:3px; padding:0 9px; font-family:var(--cap); font-size:.66rem; letter-spacing:.12em; display:flex; align-items:center; gap:6px; color:var(--argent)}
.chip b{font-family:var(--cap); font-weight:900; font-size:1.05rem; letter-spacing:.02em; color:var(--ivoire); font-variant-numeric:tabular-nums}
#chipMult b{color:var(--carmin2)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--carmin); transform:scale(1.15)}100%{transform:none}}
.fous{display:none; width:100%; align-items:center; gap:6px; font-family:var(--cap); font-size:.62rem; letter-spacing:.12em; color:var(--argent)}
body.bonus .fous:not(:empty){display:flex}
.fous .f{width:26px; height:26px} .fous .f svg,.fous .gone svg{width:100%; height:100%; display:block}
.fous .gone{position:relative; width:20px; height:20px; opacity:.55}
.fous .gone::after{content:""; position:absolute; left:-2px; right:-2px; top:50%; height:2px; background:var(--carmin2); transform:rotate(-35deg)}
/* la grille : cinq miroirs baroques */
.gridwrap{position:relative; border-radius:3px}
.mirrors{position:absolute; inset:-2px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; pointer-events:none}
.mirrors i{border-radius:40px 40px 4px 4px; background:linear-gradient(115deg, rgba(255,255,255,.05) 0 18%, transparent 18% 32%, rgba(255,255,255,.03) 32% 38%, transparent 38%), linear-gradient(180deg, #16141A, #0A090C);
  box-shadow:0 0 0 1px #000, 0 0 0 2px #8A847A, 0 0 0 3px #1A1816, inset 0 0 18px rgba(0,0,0,.9)}
body.mad .mirrors i{box-shadow:0 0 0 1px #000, 0 0 0 2px var(--carmin), 0 0 0 3px #1A1816, inset 0 0 22px rgba(120,0,16,.6)}
.grid{position:relative; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:16px 0 4px}
.cell{aspect-ratio:1; position:relative; display:grid; place-items:center; border-radius:5px; border:1px solid rgba(0,0,0,.8); transition:opacity .3s, filter .3s;
  background:var(--hatch), radial-gradient(circle at 50% 35%, #2A2630, #0C0A0E); box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -8px 14px rgba(0,0,0,.45)}
.cell.t-ivoire{background:var(--hatch), radial-gradient(circle at 50% 35%, #F4EEE2, #9A9284)} .cell.t-argent{background:var(--hatch), radial-gradient(circle at 50% 35%, #D2CCC0, #56524C)}
.cell.t-noir{background:var(--hatch), radial-gradient(circle at 50% 35%, #3A3440, #0A080C)} .cell.t-carmin{background:var(--hatch), radial-gradient(circle at 50% 35%, #A01228, #300006)}
.cell.t-sang{background:var(--hatch), radial-gradient(circle at 50% 35%, #E0243C, #5A000E)} .cell.t-wild{background:var(--hatch), radial-gradient(circle at 50% 35%, #FFFFFF, #B0A898); box-shadow:inset 0 0 0 2px #8A847A, inset 0 -8px 14px rgba(0,0,0,.35)}
.cell.t-scat{background:radial-gradient(circle at 50% 45%, #5A0010, #0A0204); box-shadow:inset 0 0 0 1px var(--carmin), inset 0 0 14px rgba(255,35,64,.5)}
.cell.t-red{background:radial-gradient(circle at 50% 35%, #FF4A5E, #6A0010); box-shadow:inset 0 0 0 2px #FFB0B8, 0 0 12px rgba(255,35,64,.7)}
.cell.t-myst{background:var(--hatch), radial-gradient(circle at 50% 40%, #2A2630, #050407); box-shadow:inset 0 0 0 1px var(--argent)}
.cell svg{width:90%; height:90%; display:block; overflow:visible}
.cell.pending>*{visibility:hidden}
.cell.drop>*{animation:drop .42s cubic-bezier(.3,1.4,.55,1) both}
.cell.popin>*{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.grid.dimmed .cell:not(.win):not(.scatwin){opacity:.3; filter:saturate(.4)}
.cell.win{z-index:1; box-shadow:0 0 0 2px var(--ivoire), 0 0 16px rgba(255,35,64,.85); transform:scale(1.06)}
.cell.boom>*{animation:boom .35s ease-in forwards}
@keyframes boom{40%{transform:scale(1.12); filter:brightness(2)}100%{transform:scale(.2); opacity:0}}
.cell.antic{animation:antic .45s ease-in-out infinite alternate}
@keyframes antic{from{box-shadow:0 0 0 1px var(--carmin)}to{box-shadow:0 0 0 2px var(--carmin2), 0 0 18px var(--carmin)}}
.cell.scat::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--carmin2); animation:ring .7s ease-out forwards; pointer-events:none}
@keyframes ring{from{transform:scale(.4); opacity:1}to{transform:scale(1.5); opacity:0}}
.cell.scatwin{z-index:2; box-shadow:0 0 0 2px var(--carmin2), 0 0 24px 6px rgba(255,35,64,.8)}
.cell.scatwin>*{animation:scatpulse .5s ease-in-out infinite alternate}
@keyframes scatpulse{from{transform:scale(1)}to{transform:scale(1.14) rotate(-4deg)}}
.grid.stare .cell.hi>*{animation:stare3 1.4s ease-in-out both}
@keyframes stare3{0%{transform:none}40%{transform:perspective(200px) rotateY(28deg) scale(.96)}100%{transform:perspective(200px) rotateY(0) scale(1.06)}}
.cell.sticky{box-shadow:inset 0 0 0 2px #EFE8DA, 0 0 10px rgba(239,232,218,.5)}
.cell.sticky::before{content:""; position:absolute; right:3px; top:3px; width:7px; height:7px; border-radius:50%; background:var(--ivoire); box-shadow:0 0 0 1px #000; z-index:2}
.cell.curtain::before{content:""; position:absolute; inset:0; z-index:3; border-radius:5px; background:repeating-linear-gradient(90deg, #120008 0 5px, #2A0010 5px 9px, #08040A 9px 12px); animation:drape .5s ease-in both; transform-origin:50% 0}
@keyframes drape{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cell.point{z-index:2; animation:point .5s ease-out both}
@keyframes point{0%{box-shadow:0 0 0 0 rgba(255,35,64,.9)}60%{box-shadow:0 0 0 6px rgba(255,35,64,.0), 0 0 22px rgba(255,35,64,.9)}100%{box-shadow:0 0 12px rgba(255,35,64,.7)}}
.cell.reveal>*{animation:reveal .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes reveal{0%{transform:rotateY(90deg)}100%{transform:none}}
@keyframes drop{from{transform:translateY(-80%); opacity:0}to{transform:none; opacity:1}}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
@keyframes pulse{50%{transform:scale(1.2)}}
.pow{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:6; pointer-events:none; white-space:nowrap; font-family:var(--deco); font-weight:900; font-size:clamp(1.5rem, 8vw, 2.3rem); letter-spacing:.04em; color:var(--ivoire);
  padding:6px 18px; background:linear-gradient(90deg, transparent, rgba(58,0,8,.92) 14%, rgba(106,0,16,.95) 50%, rgba(58,0,8,.92) 86%, transparent); text-shadow:0 2px 0 #000, 0 0 14px rgba(255,35,64,.8); animation:powin 1.3s ease-out forwards}
@keyframes powin{0%{transform:translate(-50%,-50%) scale(1.8); opacity:0; filter:blur(6px)}18%{transform:translate(-50%,-50%) scale(1); opacity:1; filter:none}78%{opacity:1}100%{transform:translate(-50%,-60%); opacity:0}}
.float{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); font-family:var(--cap); font-weight:900; font-size:1.9rem; color:var(--ivoire); pointer-events:none; z-index:5; white-space:nowrap;
  text-shadow:0 2px 0 #000, 0 0 12px rgba(255,35,64,.9); animation:rise 1.2s ease-out forwards}
.float.m{color:var(--carmin2); font-size:1.5rem; top:30%}
@keyframes rise{from{opacity:0; transform:translate(-50%,-20%) scale(.7)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}to{opacity:0; transform:translate(-50%,-120%)}}
.jester{position:absolute; z-index:7; width:30%; left:35%; top:-8%; pointer-events:none; animation:jin .5s cubic-bezier(.3,1.5,.5,1) both}
.jester svg{width:100%; display:block; filter:drop-shadow(0 8px 12px rgba(0,0,0,.8))}
.jester.out{animation:jout .5s ease-in forwards}
@keyframes jin{from{transform:translateY(-40%) scale(.6); opacity:0}to{transform:none; opacity:1}}
@keyframes jout{to{transform:translateY(-30%) scale(.7); opacity:0}}
.drapes{position:absolute; inset:0; z-index:6; pointer-events:none; display:flex}
.drapes i{flex:1; background:repeating-linear-gradient(90deg, #1A000A 0 8px, #3A0010 8px 14px, #0A0006 14px 20px); box-shadow:inset 0 -20px 30px rgba(0,0,0,.6); transform-origin:50% 0; animation:dsweep 1.3s ease-in-out both}
.drapes i:nth-child(2){animation-delay:.08s} .drapes i:nth-child(3){animation-delay:.16s} .drapes i:nth-child(4){animation-delay:.24s} .drapes i:nth-child(5){animation-delay:.32s}
@keyframes dsweep{0%{transform:scaleY(0)}40%{transform:scaleY(1)}60%{transform:scaleY(1)}100%{transform:scaleY(0)}}
/* THE LAST DANCE et REMOVE THE MASK */
.stage{display:none; flex-direction:column; align-items:center; gap:10px; padding:8px 2px 6px; text-align:center}
body.stg .stage{display:flex} body.stg .gridwrap{display:none}
.stage h3{margin:0; font-family:var(--deco); font-weight:900; font-size:1.25rem; letter-spacing:.04em; color:var(--ivoire)}
.stage p{margin:0; font-style:italic; color:var(--argent); line-height:1.35}
.partners{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; width:100%}
.partner{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 6px 9px; border-radius:6px; cursor:pointer; color:var(--ivoire);
  background:var(--hatch), linear-gradient(180deg, #1E1A22, #08070A); border:1px solid var(--argent2); box-shadow:0 0 0 2px #000; transition:transform .25s, box-shadow .25s}
.partner:hover:not(:disabled){transform:translateY(-3px); box-shadow:0 0 0 2px #000, 0 0 18px rgba(255,35,64,.45)}
.partner svg{width:72px; height:72px}
.partner b{font-family:var(--cap); font-weight:900; font-size:.86rem; letter-spacing:.1em}
.partner small{font-size:.86rem; color:var(--argent); line-height:1.15}
.partner em{font-style:normal; font-family:var(--cap); font-size:.6rem; letter-spacing:.16em; color:var(--carmin2)}
.partner.picked{box-shadow:0 0 0 2px var(--carmin2), 0 0 24px rgba(255,35,64,.7)} .partner.dim{opacity:.35}
.waltz{display:flex; justify-content:center; height:120px}
.waltz span{display:block; width:120px; height:120px; animation:waltz 1.6s linear infinite}
.waltz svg{width:100%; height:100%}
@keyframes waltz{to{transform:rotate(360deg)}}
.masks{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%}
.mask{position:relative; aspect-ratio:.72; border-radius:6px; cursor:pointer; padding:0; border:1px solid var(--argent2); background:var(--hatch), linear-gradient(180deg,#1E1A22,#08070A); box-shadow:0 0 0 2px #000; overflow:hidden}
.mask .face{position:absolute; inset:6% 4%; display:grid; place-items:center; transition:transform .7s cubic-bezier(.5,-0.2,.4,1.2), opacity .7s; z-index:2}
.mask .face svg,.mask .under svg{width:100%}
.mask .under{position:absolute; inset:10% 8%; display:grid; place-items:center; z-index:1}
.mask.lift .face{transform:translateY(-120%) rotate(-25deg); opacity:0}
.mask.dim{opacity:.4} .mask:disabled{cursor:default}
.mask.picked{box-shadow:0 0 0 2px var(--carmin2), 0 0 20px rgba(255,35,64,.6)}
.masklog{min-height:2.6em; font-weight:700; line-height:1.3}
.depth{font-family:var(--cap); font-size:.7rem; letter-spacing:.2em; color:var(--carmin2)}
/* ---------- barre de studio ---------- */
.msgrow{display:flex; align-items:center; gap:8px; margin:8px -34px 2px}
.msg{flex:1; min-width:0; min-height:1.45em; text-align:center; font-style:italic; font-weight:600; line-height:1.25; color:var(--ivoire2); text-shadow:0 1px 0 #000}
.studio{position:relative; display:grid; grid-template-columns:auto 1fr auto auto auto 1fr 1fr; align-items:center; gap:6px; margin:6px -22px 0; padding:6px 10px 8px;
  background:var(--hatch), linear-gradient(#16131A,#050407); border-top:1px solid var(--argent2); border-radius:0 0 8px 8px}
.studio small{display:block; font-family:var(--cap); font-size:.55rem; letter-spacing:.16em; color:var(--argent2); text-align:center}
.studio b{display:block; font-family:var(--cap); font-weight:900; font-size:1.02rem; color:var(--ivoire); font-variant-numeric:tabular-nums; text-align:center; white-space:nowrap}
.sbet{display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap}
.sbet small{width:100%}
.sb{width:32px; height:32px; flex:none; border-radius:50%; border:1px solid var(--argent2); background:radial-gradient(circle at 40% 30%, #4A4640, #121015 70%); color:var(--ivoire); cursor:pointer; padding:0; display:grid; place-items:center; font-size:1.05rem; line-height:1; box-shadow:0 0 0 1px #000}
.sb svg{width:15px; height:15px}
.sb:disabled{opacity:.4; cursor:default}
.sb.on{background:radial-gradient(circle at 40% 30%, #E0243C, #5A000E 70%); border-color:#FFB0B8}
.studio .spin{width:66px; height:66px; margin-top:-26px; border-radius:50%; border:2px solid #CFC6B4; cursor:pointer; padding:0; display:grid; place-items:center;
  background:radial-gradient(circle at 40% 30%, #C8102E, #4A000C 72%); box-shadow:0 0 0 3px #000, 0 0 0 5px #6E6962, 0 0 0 6px #000, 0 0 22px rgba(255,35,64,.5)}
.spin svg{width:34px; height:34px; transition:transform .5s}
.spin.go svg{transform:rotate(360deg)}
.spin:disabled{opacity:.6; cursor:default}
.spin.stop{background:radial-gradient(circle at 40% 30%, #EFE8DA, #6E6962 72%)}
.sval{min-width:0}
body.bonus .studio .sb, body.bonus .badge{visibility:hidden}
/* pastilles rondes en métal : achat à gauche, chance à droite */
.badge{position:relative; flex:none; z-index:4; width:62px; height:62px; border-radius:50%; cursor:pointer; padding:0; display:grid; place-items:center; text-align:center; line-height:1;
  font-family:var(--cap); font-weight:900; font-size:.62rem; letter-spacing:.08em; color:var(--ivoire); background:radial-gradient(circle at 40% 30%, #4A4640, #121015 72%);
  border:3px solid #9A948A; box-shadow:0 0 0 2px #000, 0 6px 14px rgba(0,0,0,.7)}
.badge span{display:block; font-size:.5rem; letter-spacing:.14em; color:var(--argent); margin-top:2px}
.badge.buy{color:#FF5A6E}
.badge.on{border-color:var(--carmin2); box-shadow:0 0 0 2px #000, 0 0 16px rgba(255,35,64,.7)}
.badge:disabled{opacity:.5; cursor:default}
/* ---------- fenêtres ---------- */
.overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(5,4,7,.78); padding:18px; z-index:20}
.overlay.show{display:grid}
.card{position:relative; background:var(--hatch), linear-gradient(180deg,#1A161E,#08070A); color:var(--ivoire); border:1px solid var(--argent2); border-radius:6px; padding:22px 20px; max-width:410px; width:100%; text-align:center;
  box-shadow:0 0 0 3px #000, 0 0 0 4px #4A4640, 0 0 50px rgba(200,16,46,.3); max-height:88vh; overflow-y:auto}
.card h2{font-family:var(--deco); font-weight:900; letter-spacing:.04em; margin:0 0 6px; font-size:1.9rem; color:var(--ivoire); text-shadow:0 0 12px rgba(255,35,64,.5)}
.card p{margin:6px 0 14px; line-height:1.45}
.btn{height:46px; min-width:52px; border-radius:3px; border:1px solid #CFC6B4; background:linear-gradient(180deg, #C8102E, #5A000E); color:var(--ivoire); font-family:var(--cap); font-weight:900; font-size:.82rem; letter-spacing:.14em; cursor:pointer; padding:0 18px;
  box-shadow:0 0 0 2px #000, inset 0 1px 0 rgba(255,255,255,.3); text-shadow:0 1px 0 #000}
.btn:disabled{opacity:.45; cursor:default}
.btn.ghost{background:linear-gradient(180deg,#2A2630,#0A080C)}
.card .btn{margin:4px auto 0}
.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 14px}
.choices .btn{padding:0 6px}
.offers{display:grid; gap:10px; margin:10px 0 14px}
.offer{display:flex; align-items:center; gap:12px; text-align:left; background:var(--hatch), linear-gradient(#1E1A22,#0A080C); border:1px solid var(--argent2); border-radius:5px; padding:10px 12px; cursor:pointer; box-shadow:0 0 0 2px #000; color:var(--ivoire)}
.offer:disabled{opacity:.45; cursor:default}
.offer>svg,.offer>.s3d{width:54px; height:54px; flex:none; overflow:visible}
.offer span{display:flex; flex-direction:column; gap:1px; font-size:.95rem; line-height:1.25}
.offer strong{font-family:var(--deco); font-weight:900; letter-spacing:.03em; font-size:1.05rem; color:var(--ivoire)}
.offer .price{font-family:var(--cap); font-weight:700; font-size:.78rem; color:var(--carmin2); letter-spacing:.06em}
.rules{text-align:left}
.rules h2{text-align:center}
.rules h3{font-family:var(--deco); font-weight:900; letter-spacing:.03em; font-size:1.1rem; margin:14px 0 4px; color:var(--carmin2)}
.rules table{width:100%; border-collapse:collapse; font-family:var(--cap); font-size:.72rem; margin:6px 0 8px; font-variant-numeric:tabular-nums}
.rules td,.rules th{padding:3px 2px; text-align:center; border-bottom:1px solid rgba(185,179,168,.18)}
.rules td svg{width:32px; height:32px; vertical-align:middle}
.rules p,.rules li{font-size:1rem; line-height:1.45}
.rules ul{padding-left:18px; margin:4px 0 8px}
.rules .tw{overflow-x:auto}
.intro{position:fixed; inset:0; z-index:18; display:none; overflow:hidden; background:radial-gradient(circle, rgba(90,0,14,.94), rgba(5,2,4,.98))}
.intro.show{display:grid}
.intro.dark{background:#000; animation:blackout 2.4s ease-out}
@keyframes blackout{0%{background:rgba(0,0,0,0)}30%{background:#000}100%{background:radial-gradient(circle, rgba(120,0,20,.9), #000)}}
.layer{position:fixed; inset:0; z-index:20; display:none; place-items:center; pointer-events:none; padding:16px}
.layer.show{display:grid}
.layer.click{pointer-events:auto; cursor:pointer}
.layer .btn{pointer-events:auto}
.bigrays{position:absolute; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,35,64,.14) 0deg 5deg, transparent 5deg 15deg); animation:spin 30s linear infinite;
  -webkit-mask:radial-gradient(circle, #000 0, transparent 55%); mask:radial-gradient(circle, #000 0, transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.introbox{position:relative; text-align:center; padding:20px; max-width:430px}
.medals{display:flex; justify-content:center; gap:4px; margin-bottom:10px; flex-wrap:wrap}
.medals>*{width:72px; height:72px; overflow:visible; animation:medal .6s cubic-bezier(.3,1.6,.5,1) both}
.introbox.many .medals>*{width:56px; height:56px}
@keyframes medal{from{transform:translateY(-60vh) rotate(-200deg) scale(.4); opacity:0}to{transform:none; opacity:1}}
.ititle{font-family:var(--deco); font-weight:900; font-size:clamp(2rem, 10vw, 2.9rem); line-height:1.02; letter-spacing:.03em; color:var(--ivoire); text-shadow:0 3px 0 #000, 0 0 30px rgba(255,35,64,.8); animation:stamp .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes stamp{from{transform:scale(2.2); opacity:0; filter:blur(8px)}to{transform:none; opacity:1; filter:none}}
.isub{color:var(--ivoire2); font-style:italic; margin:14px 0 18px; line-height:1.45; font-size:1.05rem; animation:fadein .5s both}
@keyframes fadein{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.introbox .btn{margin:0 auto; padding:0 26px; animation:fadein .5s both}
.bigwin{position:fixed; inset:0; z-index:16; display:none; overflow:hidden; background:radial-gradient(circle, rgba(106,0,16,.75), rgba(5,4,7,.94))}
.bigwin.show{display:grid}
.bigwin .bigrays{display:none}
.bigwin[data-tier="2"] .bigrays,.bigwin[data-tier="3"] .bigrays,.bigwin[data-tier="4"] .bigrays{display:block}
.bigwin[data-tier="4"] .bigrays{background:repeating-conic-gradient(from 0deg, rgba(239,232,218,.16) 0deg 4deg, rgba(255,35,64,.22) 4deg 9deg, transparent 9deg 20deg)}
.bw{position:relative; text-align:center; animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.bw .t{font-family:var(--deco); font-weight:900; font-size:clamp(2rem, 10vw, 3rem); letter-spacing:.03em; line-height:1.05; color:var(--ivoire); text-shadow:0 3px 0 #000, 0 0 26px rgba(255,35,64,.85); animation:wobble 1.2s ease-in-out infinite alternate}
.bwLayer4 .bw .t{color:var(--carmin2); text-shadow:0 3px 0 #000, 0 0 30px rgba(255,255,255,.4)}
.bw .v{font-family:var(--cap); font-weight:900; font-size:2.6rem; color:var(--ivoire); margin-top:10px; text-shadow:0 3px 0 #000; font-variant-numeric:tabular-nums}
.bw .x{color:var(--argent); margin-top:4px; font-style:italic}
.dance{display:flex; justify-content:center; gap:2px; margin-top:14px}
.dance>*{width:40px; height:40px; animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-12px) rotate(6deg)}}
@keyframes wobble{from{transform:scale(1)}to{transform:scale(1.05)}}
.fly{position:fixed; z-index:17; pointer-events:none; transition:transform .65s cubic-bezier(.5,-0.3,.4,1.2), opacity .65s}
.fly svg{width:100%; height:100%}
#fx{position:fixed; inset:0; z-index:19; pointer-events:none}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 16px); transform:translateX(-50%); background:linear-gradient(90deg,#3A0008,#8A0A1E,#3A0008); color:var(--ivoire); border:1px solid #CFC6B4;
  border-radius:3px; padding:7px 18px; font-family:var(--cap); font-weight:700; font-size:.82rem; letter-spacing:.06em; z-index:21; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; box-shadow:0 0 0 2px #000; max-width:94vw; overflow:hidden; text-overflow:ellipsis}
.toast.show{opacity:1}
/* ---------- le parquet de la salle ---------- */
.floor{position:relative; z-index:1; height:210px; margin-top:-20px; overflow:hidden; --k:1}
.floor .ground{position:absolute; inset:0; width:100%; height:100%}
.floor .deco,.floor .animal{position:absolute}
.floor .deco svg,.floor .animal svg{width:100%; display:block; overflow:visible}
#fCandL{left:3%; bottom:46px; width:calc(44px * var(--k))} #fCandR{right:3%; bottom:46px; width:calc(44px * var(--k))}
#fVase{left:78%; bottom:50px; width:calc(40px * var(--k))}
.animal.couple{bottom:30px; width:calc(70px * var(--k)); animation:cross 34s linear infinite}
.animal.couple svg{animation:waltz2 2.2s linear infinite; transform-origin:50% 60%}
@keyframes cross{from{left:-18%}to{left:108%}}
@keyframes waltz2{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.animal.juggler{left:36%; bottom:34px; width:calc(62px * var(--k))}
.juggler .ball{animation:juggle 1.2s ease-in-out infinite} .juggler .b2{animation-delay:-.4s} .juggler .b3{animation-delay:-.8s}
@keyframes juggle{0%,100%{transform:translate(-10px,0)}25%{transform:translate(0,-26px)}50%{transform:translate(10px,0)}75%{transform:translate(0,-12px)}}
.juggler .body{animation:bob 1.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-2px) rotate(2deg)}}
.animal.servant{bottom:26px; width:calc(46px * var(--k)); animation:cross 52s linear infinite reverse; animation-delay:-20s}
.servant svg{animation:step .5s ease-in-out infinite alternate}
@keyframes step{to{transform:translateY(-2px) rotate(1.5deg)}}
.animal.cat{bottom:24px; left:62%; width:calc(38px * var(--k))}
.cat .tail{transform-box:fill-box; transform-origin:0 100%; animation:tail 2.4s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
.blink{animation:blink 5s infinite; transform-box:fill-box; transform-origin:50% 50%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.credit{position:absolute; left:0; right:0; bottom:6px; margin:0; text-align:center; font-size:.8rem; font-style:italic; color:var(--argent); opacity:.9}
@media (max-width:420px){ .studio{grid-template-columns:auto 1fr auto auto auto; row-gap:2px} .studio .sval{grid-column:span 2} .studio .sval:last-child{grid-column:span 3} .msgrow{margin:6px -30px 2px} .badge{width:54px; height:54px; font-size:.54rem; border-width:2px} }
@media (min-width:900px){ .floor{height:260px; --k:1.35} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} .drapes,.jester{display:none} }
/* la luciole devant le solde */
#balLbl::before{content:""; display:inline-block; width:6px; height:6px; margin-right:4px; vertical-align:1px; border-radius:50%; background:#FFF3A0; box-shadow:0 0 6px 2px rgba(255,236,120,.85)}

/* ================= DESIGN : perspective, théâtre baroque, profondeur ================= */
.scene svg.pl{inset:-4%; width:108%; height:108%; transform:translate3d(calc(var(--px,0) * var(--k) * -1px), calc(var(--py,0) * var(--k) * -.6px), 0)}
.scene svg.back{--k:14} .scene svg.mid{--k:30} .scene svg.front{--k:60; inset:-8%; width:116%; height:116%}
.spot{position:absolute; top:-10%; width:70vmax; height:130%; mix-blend-mode:screen; pointer-events:none; transform-origin:50% 0; opacity:.9;
  background:conic-gradient(from 180deg at 50% 0%, transparent 168deg, rgba(255,236,210,.07) 173deg, rgba(255,236,210,.13) 180deg, rgba(255,236,210,.07) 187deg, transparent 192deg)}
.spot.s1{left:calc(50% - 35vmax - 18vmax); animation:sweep 11s ease-in-out infinite alternate} .spot.s2{left:calc(50% - 35vmax + 18vmax); animation:sweep 13s ease-in-out infinite alternate-reverse}
body.mad .spot{background:conic-gradient(from 180deg at 50% 0%, transparent 168deg, rgba(255,35,64,.1) 173deg, rgba(255,35,64,.2) 180deg, rgba(255,35,64,.1) 187deg, transparent 192deg)}
@keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.fog{position:absolute; left:-10%; right:-10%; bottom:0; height:34%; background:radial-gradient(ellipse at 30% 100%, rgba(120,90,110,.16), transparent 60%), radial-gradient(ellipse at 75% 100%, rgba(120,60,80,.14), transparent 55%); animation:fog 18s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(6%)}}
.dust i{position:absolute; width:3px; height:3px; border-radius:50%; background:#FFE9C8; box-shadow:0 0 6px 2px rgba(255,220,170,.5); opacity:0; animation:mote var(--d) linear infinite; animation-delay:var(--dl)}
@keyframes mote{0%{opacity:0; transform:translate(0,0)}15%{opacity:.8}85%{opacity:.6}100%{opacity:0; transform:translate(var(--dx), -38vh)}}
main{perspective:1400px; perspective-origin:50% 35%}
.rig{transform-style:preserve-3d; transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); will-change:transform}
.topper{height:176px; margin:0 -6px -20px; transform:translateZ(46px); transform-style:preserve-3d}
.logo{top:57px}
.logo b{position:relative; display:inline-block; background:none; filter:none; -webkit-text-fill-color:initial; font-size:clamp(1.9rem, 8.8vw, 2.6rem); letter-spacing:.07em}
.logo b .fa{position:relative; display:block; background:linear-gradient(180deg, #FFFFFF 0%, #F4EEE2 40%, #8E887E 50%, #E8E0D0 64%, #FFFFFF 78%, #7A746A 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(255,35,64,.35))}
.logo b .ex{position:absolute; inset:0; color:#2A2724; -webkit-text-fill-color:#2A2724; text-shadow:0 1px 0 #D8D0C2, 0 2px 0 #A8A094, 0 3px 0 #7A746A, 0 4px 0 #57524C, 0 5px 0 #3A3733, 0 6px 0 #1E1C1A, 0 7px 0 #0A0908, 0 12px 16px rgba(0,0,0,.9), 0 0 30px rgba(200,16,46,.5)}
.hbtns{bottom:44px; transform:translateZ(10px)}
.cabinet{transform-style:preserve-3d; padding:22px 24px 0; border-radius:10px 10px 12px 12px;
  background:radial-gradient(ellipse at 50% 0%, rgba(200,16,46,.16), transparent 55%), var(--hatch), linear-gradient(180deg, #18141C, #070608);
  border:none; box-shadow:0 0 0 1px #000, 0 0 0 3px #D8D0C2, 0 0 0 4px #57524C, 0 0 0 6px #1A1816, 0 0 0 8px #9A948A, 0 0 0 9px #000, 0 0 0 12px #2A2622, 0 0 0 13px #000,
    inset 0 0 0 1px rgba(255,255,255,.08), inset 0 30px 60px rgba(0,0,0,.6), 0 40px 80px rgba(0,0,0,.9), 0 0 90px rgba(200,16,46,.28)}
.pillar{transform:translateZ(30px); top:50px; bottom:128px; width:16px}
.candle{transform:translateZ(36px); top:14px}
.orn{position:absolute; width:58px; height:58px; z-index:5; pointer-events:none; transform:translateZ(26px); filter:drop-shadow(0 3px 3px rgba(0,0,0,.8))}
.orn svg{width:100%; height:100%; display:block}
.orn.tl{left:-16px; top:-16px; transform:translateZ(26px) scaleY(-1)} .orn.tr{right:-16px; top:-16px; transform:translateZ(26px) scale(-1,-1)}
.orn.bl{left:-16px; bottom:-16px} .orn.br{right:-16px; bottom:-16px; transform:translateZ(26px) scaleX(-1)}
.keystone{position:absolute; left:50%; top:-24px; width:70px; margin-left:-35px; z-index:6; transform:translateZ(34px); filter:drop-shadow(0 4px 4px rgba(0,0,0,.8))}
.keystone svg{width:100%; display:block}
.sanity{transform:translateZ(14px); margin:4px 24px 10px}
.screen{transform-style:preserve-3d; padding:28px 7px 6px; border-radius:6px 6px 4px 4px; background:radial-gradient(ellipse at 50% 30%, #1A1018, #030204 75%);
  box-shadow:0 0 0 1px #9A948A, 0 0 0 3px #000, 0 0 0 4px #3A3733, inset 0 0 40px rgba(0,0,0,.95), inset 0 -30px 40px rgba(106,0,16,.18)}
.swag{position:absolute; left:-8px; right:-8px; top:-6px; height:38px; z-index:8; pointer-events:none; transform:translateZ(22px); filter:drop-shadow(0 6px 6px rgba(0,0,0,.7))}
.swag svg{width:100%; height:100%; display:block}
.swag i{position:absolute; top:6px; width:10px; height:30px; margin-left:-5px; transform-origin:50% 0; animation:tassel 3s ease-in-out infinite alternate;
  background:radial-gradient(circle at 50% 18%, #EFE8DA 0 3px, transparent 3.5px), linear-gradient(90deg, #6E6962, #EFE8DA 50%, #6E6962) 50% 6px/2px 10px no-repeat, radial-gradient(ellipse at 50% 80%, #C8102E 0 5px, #6A0010 5.5px, transparent 6px)}
.swag i:nth-child(3){animation-delay:-1s} .swag i:nth-child(4){animation-delay:-2s} .swag i:nth-child(5){animation-delay:-.5s}
@keyframes tassel{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
body.bonus .screen{padding-top:34px}
.hud{transform:translateZ(8px)}
.gridwrap{transform-style:preserve-3d; transform:scale(.95)} /* rien ne recule derrière le fond de l'écran : en 3D partagée, il le cacherait */
.grid,.mirrors{perspective:760px; perspective-origin:50% 45%}
.grid{transform-style:preserve-3d; padding:18px 0 2px}
.mirrors{transform-style:preserve-3d; inset:-2px -2px 30px}
.cell,.mirrors i{--ry:0deg; --tz:0px; transform-origin:50% 50%}
.cell{transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 10px))} .mirrors i{transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 3px))}
.cell:nth-child(5n+1),.mirrors i:nth-child(1){--ry:17deg; --tz:26px} .cell:nth-child(5n+2),.mirrors i:nth-child(2){--ry:8deg; --tz:7px}
.cell:nth-child(5n+4),.mirrors i:nth-child(4){--ry:-8deg; --tz:7px} .cell:nth-child(5n+5),.mirrors i:nth-child(5){--ry:-17deg; --tz:26px}
.cell.win{transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 28px))}
.mirrors i{border-radius:44px 44px 6px 6px; background:linear-gradient(112deg, rgba(255,255,255,.07) 0 16%, transparent 16% 30%, rgba(255,255,255,.04) 30% 35%, transparent 35%), radial-gradient(ellipse at 50% 20%, #221A24, #07060A 80%);
  box-shadow:0 0 0 1px #000, 0 0 0 3px #B9B3A8, 0 0 0 4px #3A3733, 0 0 0 5px #000, inset 0 0 22px rgba(0,0,0,.95), 0 10px 20px rgba(0,0,0,.7)}
.mirrors i::before{content:""; position:absolute; left:50%; top:-9px; width:18px; height:14px; margin-left:-9px; border-radius:50% 50% 30% 30%; background:radial-gradient(circle at 50% 40%, #FF2340 0 2.5px, transparent 3px), linear-gradient(#EFE8DA,#6E6962); box-shadow:0 0 0 1px #000}
.mirrors i{position:relative}
:root{--studs:radial-gradient(circle at 6px 6px, rgba(255,255,255,.3) 0 1.2px, transparent 1.8px), radial-gradient(circle at calc(100% - 6px) 6px, rgba(255,255,255,.3) 0 1.2px, transparent 1.8px), radial-gradient(circle at 6px calc(100% - 6px), rgba(255,255,255,.22) 0 1.2px, transparent 1.8px), radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), rgba(255,255,255,.22) 0 1.2px, transparent 1.8px)}
.cell{border-radius:6px; box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 3px rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.07), inset 0 -12px 18px rgba(0,0,0,.5), 0 4px 0 #000, 0 9px 14px rgba(0,0,0,.65);
  background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #332C38, #0A080C 85%)}
.cell.t-ivoire{background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #FFFBF2, #A49C8E 90%)} .cell.t-argent{background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #E4DED2, #5E5A54 90%)}
.cell.t-noir{background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #463E4C, #07060A 90%)} .cell.t-carmin{background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #B8142E, #2A0005 90%)}
.cell.t-sang{background:var(--studs), var(--hatch), radial-gradient(circle at 50% 30%, #F0304A, #500010 90%)} .cell.t-wild{background:var(--studs), radial-gradient(circle at 50% 30%, #FFFFFF, #B8B0A0 90%); box-shadow:inset 0 0 0 2px #9A948A, inset 0 0 0 4px #FFF, 0 4px 0 #000, 0 0 16px rgba(255,255,255,.35)}
.cell.t-scat{background:radial-gradient(circle at 50% 45%, #6A0014, #0A0204 85%); box-shadow:inset 0 0 0 1px var(--carmin2), inset 0 0 18px rgba(255,35,64,.6), 0 4px 0 #000, 0 0 16px rgba(255,35,64,.45)}
.cell.t-red{background:radial-gradient(circle at 50% 30%, #FF5A6E, #5A000E 90%); box-shadow:inset 0 0 0 2px #FFB0B8, 0 4px 0 #000, 0 0 18px rgba(255,35,64,.8)}
.cell.win{box-shadow:0 0 0 2px var(--ivoire), 0 0 0 4px rgba(255,35,64,.7), 0 0 24px rgba(255,35,64,.9), 0 14px 18px rgba(0,0,0,.6)}
.apron{height:40px; margin:-2px -10px -8px; position:relative; transform-origin:50% 0; transform:perspective(260px) rotateX(62deg);
  background:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.85)), repeating-conic-gradient(#0C0A0E 0 25%, #6E675E 0 50%) 0 0/24px 24px;
  -webkit-mask-image:linear-gradient(#000 20%, transparent); mask-image:linear-gradient(#000 20%, transparent); box-shadow:inset 0 2px 0 #9A948A}
.msgrow{transform:translateZ(44px); margin:8px -30px 2px; position:relative; z-index:7}
.badge{transform:translateZ(8px); background:radial-gradient(circle at 38% 28%, #6E6962, #1A171E 60%, #050407); border:none;
  box-shadow:0 0 0 2px #000, 0 0 0 5px #B9B3A8, 0 0 0 6px #3A3733, 0 0 0 7px #000, 0 8px 16px rgba(0,0,0,.8), inset 0 2px 3px rgba(255,255,255,.25)}
.badge.on{box-shadow:0 0 0 2px #000, 0 0 0 5px var(--carmin2), 0 0 0 7px #000, 0 0 20px rgba(255,35,64,.8)}
.studio{transform:translateZ(22px); margin:8px -24px 0; border-radius:0 0 12px 12px; padding:8px 12px 10px;
  background:linear-gradient(180deg, rgba(255,255,255,.07), transparent 30%), var(--hatch), linear-gradient(#1C1820,#050407); border-top:none;
  box-shadow:inset 0 1px 0 #9A948A, inset 0 2px 0 #000, inset 0 3px 0 #3A3733, 0 -10px 20px rgba(0,0,0,.5)}
.studio .spin{background:radial-gradient(circle at 38% 28%, #FF5A6E, #C8102E 38%, #3A0008 78%); box-shadow:0 0 0 3px #000, 0 0 0 6px #CFC6B4, 0 0 0 7px #57524C, 0 0 0 8px #000, 0 10px 18px rgba(0,0,0,.8), 0 0 30px rgba(255,35,64,.55), inset 0 3px 4px rgba(255,255,255,.35)}
.floor{margin-top:-10px}
@media (max-width:420px){ .msgrow{margin:6px -20px 2px} .pillar{bottom:156px} }
@media (prefers-reduced-motion: reduce){ .rig{transform:none} .spot,.dust{display:none} }
/* ---------- symboles 3D : planches d'images cuites au chargement (voir KIT3D) ---------- */
.s3d{display:block; width:92%; height:92%; position:relative}
.s3d b{display:block; width:100%; height:100%; background:var(--idle) 0 0 / calc(var(--n) * 100%) 100% no-repeat; animation:sheet 2.2s steps(var(--n), jump-none) infinite}
.cell.win .s3d b,.cell.scatwin .s3d b,.dance .s3d b{background-image:var(--win); animation-duration:1.1s}
@keyframes sheet{from{background-position-x:0%}to{background-position-x:100%}}
.cell:nth-child(3n) .s3d b{animation-delay:-.7s} .cell:nth-child(5n+1) .s3d b{animation-delay:-1.4s} .cell:nth-child(7n+2) .s3d b{animation-delay:-.35s}
.cell.pending .s3d{visibility:hidden}
.art3d-in .s3d{animation:s3din .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes s3din{from{opacity:0; transform:scale(.8)}}
.cell.drop .s3d{animation:drop .46s cubic-bezier(.3,1.55,.55,1) both}
.cell.twinkle .s3d,.cell.popin .s3d{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.cell.powhit .s3d{animation:pulse .45s ease-in-out 3}
.cell.shimmer .s3d{animation:shim 1s ease-in-out}
.cell.boom .s3d{animation:boom .35s ease-in forwards}
.cell.bite .s3d{animation:bite .5s cubic-bezier(.3,1.6,.5,1) both}
.cell.gold .s3d{animation:goldpulse 1.4s ease-in-out infinite alternate}
.cell.fade .s3d{transition:opacity .8s, transform .8s; opacity:0; transform:scale(.3)}
.medals .s3d{display:inline-block; width:74px; height:74px; animation:medal .6s cubic-bezier(.3,1.6,.5,1) both}
.introbox.many .medals .s3d{width:58px; height:58px}
.dance .s3d{display:inline-block; width:46px; height:46px}
.offer .s3d{width:58px; height:58px; flex:none}
.rules td .s3d{display:inline-block; width:38px; height:38px; vertical-align:middle}
.fly .s3d,.lvic .s3d{width:100%; height:100%}
#stage3d{position:fixed; inset:0; width:100%; height:100%; z-index:19; pointer-events:none; display:none}
/* ---------- décor 3D en fond : remplace le paysage 2D dès sa première image ---------- */
#decor3d{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block}
body.decor3d .scene,body.decor3d .flock,body.decor3d .floor .ground,body.decor3d .floor .deco,body.decor3d .floor .animal,body.decor3d .floor .pick,body.decor3d #flies{display:none}
body.decor3d .floor .credit{text-shadow:0 1px 3px rgba(0,0,0,.6)}
@media (prefers-reduced-motion: reduce){ .s3d b{animation:none!important} }

<script>
// ---------- son : menuet au clavecin, valse du bal, boîte à musique déréglée, rires du Fou, tout généré en direct ----------
// @@MUSIQUE-DEBUT
// ---------- MUSIQUE : un petit compositeur (harmonie, voicings liés, mélodies à motifs) et des instruments doux ----------
// MUSIQUE(ctx, bus, partition) -> { start(bonus), stop(), setBonus(v), hush(v), setMood(m) }
// La partition décrit le morceau (tonalité, gamme, tempo, suite d'accords, instruments) ; tout le reste est composé ici,
// avec un aléatoire à graine : le morceau est toujours le même au début, puis ses mélodies varient à chaque tour.
// Voir references/musique.md.
const MUSIQUE = (() => {
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11], harmonic: [0, 2, 3, 5, 7, 8, 11], mixo: [0, 2, 4, 5, 7, 9, 10] };
  // notes d'un accord bâti en tierces sur un degré de la gamme ; ext : '', '7', '9', 'maj7' (= 7), 'maj9' (= 9), '6', 'sus', 'sus9', 'add9'
  function chord(P, deg, ext = '') {
    const sc = SCALES[P.scale], at = i => sc[((i % 7) + 7) % 7] + 12 * Math.floor(i / 7), d = deg - 1;
    const idx = [d, ext.startsWith('sus') ? d + 3 : d + 2, d + 4];
    if (/7|9/.test(ext) && ext !== 'add9') idx.push(d + 6);
    if (/9/.test(ext)) idx.push(d + 8);
    if (ext === '6') idx.push(d + 5);
    return { root: at(d), tones: idx.map(at) };
  }
  // voicing : chaque note prend l'octave la plus proche de la voix précédente (enchaînements doux, sans sauts)
  function voice(prev, tones, key, lo, hi) {
    const center = prev ? prev.reduce((a, b) => a + b, 0) / prev.length : (lo + hi) / 2;
    return tones.map(t => { let m = key + t; while (m < center - 6) m += 12; while (m > center + 6) m -= 12; while (m < lo) m += 12; while (m > hi) m -= 12; return m; }).sort((a, b) => a - b);
  }
  const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  return function create(ctx, bus, P) {
    const R = rng(P.seed || 7);
    // ---------- mixage : sec + réverbération (réponse impulsionnelle générée) + écho, filtre chaud, compresseur ----------
    const out = ctx.createGain(); out.gain.value = 0; out.connect(bus);
    const warm = ctx.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = P.bright || 6000; warm.Q.value = 0.3;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.3;
    warm.connect(comp).connect(out);
    const dry = ctx.createGain(); dry.connect(warm);
    const verb = ctx.createConvolver(), verbIn = ctx.createGain(); verbIn.gain.value = 1;
    { const len = Math.floor(ctx.sampleRate * (P.reverb || 2.6)), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lp = 0; for (let i = 0; i < len; i++) { lp += ((Math.random() * 2 - 1) - lp) * 0.35; d[i] = lp * Math.pow(1 - i / len, 2.4); } }
      verb.buffer = ir; }
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.55; verbIn.connect(verb).connect(verbOut).connect(warm);
    const delay = ctx.createDelay(2), fb = ctx.createGain(), dlp = ctx.createBiquadFilter(), dOut = ctx.createGain();
    dlp.type = 'lowpass'; dlp.frequency.value = 2200; fb.gain.value = 0.32; dOut.gain.value = 0.22;
    delay.connect(dlp).connect(fb).connect(delay); dlp.connect(dOut).connect(warm);
    // groupes « ducking » : la nappe et la basse s'effacent un instant sous chaque grosse caisse (respiration)
    const padBus = ctx.createGain(); padBus.connect(dry); const padSend = ctx.createGain(); padSend.gain.value = 0.5; padBus.connect(padSend).connect(verbIn);
    const bassBus = ctx.createGain(); bassBus.connect(dry);
    const send = (node, rv = 0.3, dl = 0) => { node.connect(dry); if (rv) { const g = ctx.createGain(); g.gain.value = rv; node.connect(g).connect(verbIn); } if (dl) { const g = ctx.createGain(); g.gain.value = dl; node.connect(g).connect(delay); } };

    let mood = '';
    const det = () => (mood === 'mad' ? (Math.random() - 0.5) * 70 : 0); // la folie désaccorde tout
    function env(g, t, a, peak, d, r = 0.3) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0.0001, t + a + d, r); }
    const osc = (type, f, t, stop, dt = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = dt; o.start(t); o.stop(stop); return o; };
    // ---------- instruments ----------
    const I = {
      // piano électrique (FM : la brillance du marteau s'éteint vite, reste un son rond)
      epiano(m, t, dur, v) {
        const f = mtof(m), end = t + dur + 1.6, c = osc('sine', f, t, end, det()), mo = osc('sine', f, t, end), mg = ctx.createGain(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
        mg.gain.setValueAtTime(f * 2.2, t); mg.gain.exponentialRampToValueAtTime(f * 0.25, t + 0.5); mo.connect(mg).connect(c.frequency);
        const tine = osc('sine', f * 7, t, t + 0.3), tg = ctx.createGain(); env(tg, t, 0.002, v * 0.05, 0.02, 0.05); tine.connect(tg).connect(g);
        lp.type = 'lowpass'; lp.frequency.value = 2600; env(g, t, 0.006, v * 0.22, dur * 0.4, dur * 0.6 + 0.3);
        c.connect(g); g.connect(lp); send(lp, 0.28, 0.08);
      },
      // marimba : bois chaud, partiel à ×4 très bref
      mallet(m, t, dur, v) {
        const f = mtof(m), g = ctx.createGain(), a = osc('sine', f, t, t + 1.4, det()), b = osc('sine', f * 4, t, t + 0.25), bg = ctx.createGain();
        env(g, t, 0.003, v * 0.28, 0.05, 0.28); env(bg, t, 0.002, v * 0.06, 0.01, 0.03); a.connect(g); b.connect(bg).connect(g); send(g, 0.3, 0.12);
      },
      // boîte à musique : partiels de cloche doux, longue résonance
      musicbox(m, t, dur, v) {
        const f = mtof(m), g = ctx.createGain(); env(g, t, 0.002, v * 0.12, 0.02, 0.7);
        [[1, 1], [3, 0.28], [6.1, 0.08], [9.4, 0.03]].forEach(([k, a]) => { const o = osc('sine', f * k, t, t + 2.4, det()), og = ctx.createGain(); og.gain.value = a; o.connect(og).connect(g); });

// ---------- chargement progressif : la machine démarre avec ses dessins 2D, puis passe en 3D dès que tout est cuit ----------
// MODELS(K) renvoie { SYMS: [une fonction par symbole, ou null pour garder le dessin 2D], SCAT: fonction, VARIANTES: { nomDansART: { argument: fonction } } }.
// Exemple : VARIANTES: { star: { star: () => …, gold: () => … } } remplace ART.star('gold') par sa version 3D.
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js';
const STAGE3D = { intro() {}, big() {}, stop() {} }; // restent vides exprès : pas de personnages 3D qui tournent autour des grands écrans
window.ART3D_STATE = 'chargement';
// DECOR (facultatif) : décor 3D en fond d'écran, voir setupDecor
// Planches précuites (scripts/precuire.js) : PLANCHES3D = { dir, v, items: { s0…s7, scat, "v|nom|arg": { f, n } } }.
// Avec elles, la grille passe en 3D dès que les images sont là, sans attendre Three.js ni la cuisson.
async function usePlanches(ART, P) {
  const url = (it, k) => new URL(`${P.dir}${it.f}-${k}.webp?v=${P.v}`, location.href).href;
  const all = Object.entries(P.items).map(([key, it]) => ({ key, b: { idle: url(it, 'idle'), win: url(it, 'win'), frames: it.n } }));
  const load = src => new Promise((ok, ko) => { const im = new Image(); im.onload = ok; im.onerror = () => ko(new Error('planche introuvable : ' + src)); im.src = src; });
  await Promise.race([Promise.all(all.flatMap(x => [load(x.b.idle), load(x.b.win)])), new Promise((_, ko) => setTimeout(() => ko(new Error('planches trop lentes')), 20000))]);
  const get = k => all.find(x => x.key === k)?.b;
  // un symbole sans planche garde son dessin 2D (ART3D_MODELS.SYMS[i] = null : cartes gravées, lettres…)
  const syms = ART.SYMS.map((s, i) => (get('s' + i) ? S3D_HTML(get('s' + i)) : s));
  const scat = get('scat'); if (!all.some(x => /^s\d/.test(x.key)) || !scat) throw new Error('planches incomplètes');
  const variants = {};
  for (const x of all) { if (!x.key.startsWith('v|')) continue; const [, name, arg] = x.key.split('|'); (variants[name] ??= {})[arg] = S3D_HTML(x.b); }
  ART.SYMS = syms; ART.SCAT = S3D_HTML(scat);
  for (const [name, v] of Object.entries(variants)) { const old = ART[name]; ART[name] = (arg, ...rest) => v[arg] ?? old(arg, ...rest); }
}
function passe3d() {
  window.ART3D_STATE = 'ok';
  document.body.classList.add('art3d-in'); setTimeout(() => document.body.classList.remove('art3d-in'), 900); // fondu doux 2D → 3D
  dispatchEvent(new Event('art3d'));
}
async function CHARGE3D(ART, MODELS, DECOR) {
  // ?cuire : ignore les planches précuites (c'est ce que fait precuire.js pour les refaire)
  const P = typeof PLANCHES3D !== 'undefined' && PLANCHES3D && !/[?&]cuire\b/.test(location.search) ? PLANCHES3D : null;
  let pret = false;
  if (P) { try { await usePlanches(ART, P); pret = true; passe3d(); } catch (e) { console.warn('planches précuites indisponibles, cuisson en direct :', e); } }
  try {
    const THREE = await import(THREE_URL);
    const K = KIT3D(THREE), M = MODELS(K), frame = () => new Promise(r => requestAnimationFrame(r));
    if (DECOR) { try { setupDecor(K, DECOR, M); } catch (e) { console.warn('décor 3D indisponible :', e); } await frame(); }
    if (pret) return;
    const bakes = {}, syms = [];
    for (const [i, f] of M.SYMS.entries()) { if (!f) { syms.push(ART.SYMS[i]); continue; } bakes['s' + i] = await K.bake(f()); syms.push(K.html(bakes['s' + i])); await frame(); }
    bakes.scat = await K.bake(M.SCAT()); const scat = K.html(bakes.scat);
    const variants = {};
    for (const [name, table] of Object.entries(M.VARIANTES || {})) {
      variants[name] = {};
      for (const [arg, f] of Object.entries(table)) { const b = await K.bake(f()); bakes[`v|${name}|${arg}`] = b; variants[name][arg] = K.html(b); await frame(); }
    }
    K.endBake();
    window.ART3D_BAKES = bakes; // lu par precuire.js
    ART.SYMS = syms; ART.SCAT = scat;
    for (const [name, v] of Object.entries(variants)) { const old = ART[name]; ART[name] = (arg, ...rest) => v[arg] ?? old(arg, ...rest); }
    // plus de ronde 3D autour de l'entrée du bonus ni des gros gains : trop chargé, l'écran reste lisible
    passe3d();
  } catch (e) {
    if (pret) { console.warn('décor 3D indisponible (les symboles restent en 3D) :', e); return; }
    window.ART3D_STATE = 'erreur'; window.ART3D_ERROR = String(e && e.stack || e);
    console.warn('3D indisponible, la machine garde ses dessins 2D :', e);
  }
}
// scène en direct : les personnages tournent en ronde autour du texte (entrée du bonus)
function setupStage(K, M) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const { THREE, TAU, ANIM, ease } = K;
  const cv = document.createElement('canvas'); cv.id = 'stage3d'; cv.setAttribute('aria-hidden', 'true');
  const fx = document.getElementById('fx'); fx ? fx.before(cv) : document.body.appendChild(cv);
  const st = K.live(cv);
  const wrap = model => { const p = new THREE.Group(), pivot = new THREE.Group(); pivot.add(model); p.add(pivot); p.userData = { pivot, model }; return p; };
  function ring(models, win) {
    st.set(models.map(wrap));
    st.play((t, kids) => {
      const asp = innerWidth / innerHeight, halfH = Math.tan(16 * Math.PI / 180) * 12;
      const rx = Math.min(halfH * asp * 0.74, 4.6), ry = halfH * 0.74, sc = Math.min(1, halfH * asp / 2.4) * 0.6;
      kids.forEach((p, i) => {
        const n = kids.length, a = Math.PI / 2 + i / n * TAU + t * 0.3, k = ease.out(Math.min(1, Math.max(0, (t - i * 0.1) / 0.9)));
        p.position.set(Math.cos(a) * rx * k, Math.sin(a) * ry * k - (1 - k) * 7, -1 + Math.sin(a) * 0.6);
        p.scale.setScalar(sc * (0.4 + 0.6 * k));
        const ph = (t * (win ? 0.85 : 0.45) + i / n) % 1, { pivot, model } = p.userData;
        ANIM[win ? 'win' : 'idle'](ph, pivot);
        model.userData.anim?.[win ? 'win' : 'idle']?.(ph, model);
      });
    });
  }
  STAGE3D.intro = n => ring(Array.from({ length: Math.min(n, 6) }, () => M.SCAT()), false);
  STAGE3D.stop = () => st.stop();
}

// ---------- décor 3D en fond d'écran ----------
// DECOR(K, M) renvoie { build(scene, cam) -> { update(t, dt, s) } } ; M = les modèles de la machine (pour réutiliser ses personnages). build place la caméra (cam.position) et sa cible
// (cam.userData.target, un Vector3) ; camFor(aspect) (facultatif) renvoie { pos, target } pour recadrer sur téléphone ; update anime la scène à chaque image, avec s = { bonus: 0 → 1 (transition douce),
// px, py : position du doigt ou de la souris (-1 → 1), scroll : 0 → 1 }. Le kit ajoute une légère parallaxe à la caméra.
// Une fois la première image affichée, <body> reçoit la classe decor3d : c'est au CSS de la page de masquer alors le décor 2D.
function setupDecor(K, DECOR, M) {
  const { THREE } = K, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.createElement('canvas'); cv.id = 'decor3d'; cv.setAttribute('aria-hidden', 'true');
  document.body.prepend(cv);
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
  r.setPixelRatio(Math.min(1.5, devicePixelRatio || 1)); r.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  cam.userData.target = new THREE.Vector3(0, 2, 0);
  const d = DECOR(K, M).build(scene, cam);
  const base = cam.position.clone(), tgt = cam.userData.target.clone();
  const size = () => {
    const w = innerWidth, h = innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
    const c = d.camFor?.(cam.aspect); if (c) { base.copy(c.pos); tgt.copy(c.target); } // cadrage selon la forme de l'écran
  };
  addEventListener('resize', size); size();
  const s = { bonus: 0, px: 0, py: 0, scroll: 0 }; let tx = 0, ty = 0, last = performance.now(), t = 0, shown = false;
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma != null) { tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); } }, { passive: true });
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const covered = document.querySelector('.bigwin.show, .intro.show');
    if (!document.hidden && !(covered && shown)) {
      t += dt;
      const target = document.body.classList.contains('bonus') ? 1 : 0;
      s.bonus += (target - s.bonus) * (reduce ? 1 : Math.min(1, dt * 1.2));
      s.px += (tx - s.px) * Math.min(1, dt * 2); s.py += (ty - s.py) * Math.min(1, dt * 2);
      const sh = document.documentElement.scrollHeight - innerHeight; s.scroll = sh > 0 ? scrollY / sh : 0;
      cam.position.set(base.x + s.px * 0.8, base.y - s.py * 0.35 - s.scroll * 1.2, base.z);
      cam.lookAt(tgt.x + s.px * 0.3, tgt.y - s.scroll * 1.6, tgt.z);
      d.update(reduce ? 4 : t, reduce ? 0 : dt, s);
      r.render(scene, cam);
      if (!shown) { shown = true; document.body.classList.add('decor3d'); }
    }
    reduce ? setTimeout(() => requestAnimationFrame(frame), 400) : requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

      (wt.t === 4 ? `<div class="dance">${ART.SYMS.slice(5).map((s, i) => s.replace(/^<(svg|i)/, `<$1 style="animation-delay:${i * 90}ms"`)).join('')}</div>` : '');
    el.classList.add('show'); Snd.fx('fanfare');
    const W = FX.W(), H = FX.H();
    FX.burst('petal', W / 2, H / 2, 26, 9);
    FX.rain('petal', dur, wt.t >= 2 ? 1.1 : .6);
    if (wt.t >= 2) { FX.rain('confetti', dur, wt.t >= 4 ? 1.2 : .6); FX.burst('spark', W / 2, H / 2, 24, 9); }
    if (wt.t >= 3) shake();
    let fwTimer = null;
    if (wt.t >= 3) fwTimer = setInterval(() => { FX.firework(W * (0.15 + Math.random() * 0.7), H * (0.12 + Math.random() * 0.4)); Snd.fx('thunk'); }, wt.t === 4 ? 360 : 560);
    if (wt.t >= 3) Snd.fx('laugh', 1.1);
    const t0 = performance.now(); let done = false, lastTick = 0;
    const finish = () => {
      if (done) return; done = true; clearInterval(fwTimer); $('bwv').textContent = fmt(amount);
      FX.burst('spark', W / 2, H / 2, 20, 8);
      setTimeout(() => { el.classList.remove('show'); lay.className = 'layer click'; FX.stopRain(); res(); }, 1600);
    };
    lay.onclick = finish;
    const step = now => {
      if (done) return;
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      $('bwv').textContent = fmt(amount * e);
      if (now - lastTick > 70) { Snd.fx('tick', e); lastTick = now; }
      if (p < 1) requestAnimationFrame(step); else finish();
    };
    requestAnimationFrame(step);
  });
}

// ---------- grille : chute, masques du Fou, Fous, cascades ----------
async function revealDrop(g, antic = true, red = new Set(), sticky = new Set()) {
  const cells = buildGrid();
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) { const k = K5(c, r); paint(cells[r][c], g[c][r], red.has(k)); cells[r][c].classList.add('pending'); if (sticky.has(k)) cells[r][c].classList.add('sticky'); }
  let scats = 0;
  Snd.fx('reelStart'); await sleep(220);
  for (let c = 0; c < 5; c++) {
    if (antic && scats >= 2) {
      for (let r = 0; r < 5; r++) cells[r][c].classList.add('antic');
      msg(scats === 2 ? 'Le silence… il manque un masque.' : 'Le bal retient son souffle…');
      Snd.fx('antic'); await sleep(900);
    }
    for (let r = 0; r < 5; r++) {
      const d = cells[r][c]; d.classList.remove('pending', 'antic'); d.classList.add('drop');
      if (d.firstElementChild) d.firstElementChild.style.animationDelay = (r * 22) + 'ms';
      if (g[c][r] === E.SCAT) { scats++; d.classList.add('scat'); const [x, y] = FX.center(d); setTimeout(() => FX.burst('spark', x, y, 8, 4), 200); }
    }
    Snd.fx('stop', c);
    if (antic && g[c].includes(E.SCAT)) {
      Snd.fx('scatter', scats);
      if (scats === 1) msg('Cling…');
      if (scats === 2) { Snd.hush(true); msg('La musique s\'arrête.'); }
      if (scats >= 3) { $('grid').classList.add('stare'); msg('Tous les invités se tournent vers toi.'); }
    }
    await sleep(150);
  }
  Snd.fx('reelStop');
  if (scats < 3) Snd.hush(false);
  await sleep(260);
  return cells;
}
async function blackJester(cells, s, red, sticky) {
  const out = await figure('black'); Snd.fx('curtain'); pow('LE FOU NOIR');
  msg(`Le Fou Noir tire les rideaux sur les ${s.removed.map(i => LOW_NAME[i]).join(', ')}.`);
  const dr = document.createElement('div'); dr.className = 'drapes'; dr.innerHTML = '<i></i><i></i><i></i><i></i><i></i>'; $('gridwrap').appendChild(dr); setTimeout(() => dr.remove(), 1500);
  for (const [c, r] of s.cells) cells[r][c].classList.add('curtain');
  await sleep(750);
  for (const [c, r] of s.cells) { const d = cells[r][c]; d.classList.remove('curtain'); setCell(d, s.g[c][r], 'popin', red.has(K5(c, r))); }
  out(); await sleep(420);
}
async function redJester(cells, chain, red) {
  const out = await figure('red'); pow('LE FOU ROUGE'); Snd.fx('laugh', 1.2);
  msg('Le Fou Rouge désigne une case… puis une autre… puis une autre.');
  for (const [c, r] of chain) { const d = cells[r][c]; red.add(K5(c, r)); setCell(d, E.WILD, 'point', true); Snd.fx('point'); const [x, y] = FX.center(d); FX.burst('petal', x, y, 4, 3); await sleep(330); }
  Snd.fx('red'); out(); await sleep(350);
}
// joue les étapes d'un spin après la chute ; unit convertit le gain brut en lucioles
async function playSteps(cells, steps, unit, o = {}) {
  let paid = 0; const red = o.red || new Set(), sticky = o.sticky || new Set();
  for (const s of steps) {
    if (s.t === 'drop') continue;
    if (s.t === 'black') { await blackJester(cells, s, red, sticky); continue; }
    if (s.t === 'red') { await redJester(cells, s.cells, red); continue; }
    const win = s.amt * unit; paid += win;
    $('grid').classList.add('dimmed');
    for (const w of s.wins) for (const [c, r] of w.cells) cells[r][c].classList.add('win');
    const big = s.wins.reduce((m, w) => Math.max(m, w.size), 0);
    if (s.laugh) { pow('IL ÉCLATE DE RIRE !'); Snd.fx('laugh', 1.3); await sleep(300); }
    floatText('+' + fmt(win)); if (s.m > 1) floatText('×' + s.m, 'm');
    Snd.fx('win', win / bet() >= 5 ? 2 : 1);
    msg(`Grappe de ${big} : ${fmt(win)}${s.m > 1 ? ` (×${s.m}${s.lm > 1 ? ', rire du Fou ×' + s.lm : ''})` : ''}`);
    if (o.onWin) await o.onWin(s);
    await sleep(760);
    Snd.fx('curtain');
    s.cells.forEach(([c, r], i) => { const d = cells[r][c]; d.classList.remove('win'); d.classList.add('boom'); if (i % Math.ceil(s.cells.length / 5) === 0) { const [x, y] = FX.center(d); FX.burst(i % 2 ? 'petal' : 'spark', x, y, 3, 4); } });
    if (s.cells.length >= 10) shake();
    await sleep(320);
    $('grid').classList.remove('dimmed');
    for (const row of cells) for (const d of row) d.classList.remove('win');
    for (const [c, r] of s.cells) { red.delete(K5(c, r)); setCell(cells[r][c], s.g[c][r]); }
    await sleep(430);
  }
  return paid;
}

async function spin() {
  if (S.busy) return false;
  if (S.balance < cost() - 1e-9) { noCredits(); stopAuto(); return false; }
  S.busy = true; lockUI(true); Snd.start(); Snd.fx('click');
  const sb = $('spin'); sb.classList.remove('go'); void sb.offsetWidth; sb.classList.add('go');
  S.balance -= cost(); SALLE.spin(); setMoney(); msg('');
  const r = E.playBase(S.st, mode());
  const madMult0 = r.mad ? S.st.madMult - r.steps.filter(s => s.t === 'win').length : 1;
  const cells = await revealDrop(r.steps[0].g);
  const red = new Set();
  const win = await playSteps(cells, r.steps, E.BASE_SCALE[mode()] * bet(), { red, onWin: r.mad ? async s => { if (s.after) { $('stxt').textContent = `MADNESS ×${s.after}`; Snd.fx('mult', s.after); } } : null });
  const total = r.win * bet();
  if (total > 0) {
    const mult = total / bet();
    msg(`Gain total : ${fmt(total)}`); mediumWin(mult);
    await bigWin(total, mult);
    S.balance += total; $('lastWin').textContent = fmt(SALLE.gain(total, bet())); setMoney();
  } else { $('lastWin').textContent = fmt(SALLE.gain(0, bet())); await sleep(180); }
  void madMult0;
  setSanity(r.madStart ? 0 : r.sanity, r.madStart ? 0 : r.madLeft);
  if (r.madStart) { await sleep(600); if (S.auto) stopAuto(); SALLE.flag('madness'); await madnessFalls(); setSanity(100, S.st.madness); }
  let bonus = false;
  if (r.scats >= 3) {
    bonus = true;
    const tier = Math.min(5, r.scats);
    if (S.auto) stopAuto();
    const g0 = r.steps[0].g, c0 = buildGrid();
    for (let rr = 0; rr < 5; rr++) for (let c = 0; c < 5; c++) paint(c0[rr][c], g0[c][rr]);
    await presentScatters(c0, g0);
    await runBonus(tier, false, r.scats);
  }
  Snd.hush(false);
  S.busy = false; lockUI(false);
  return bonus;
}
