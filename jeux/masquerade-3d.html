        SALLE.compte('fous');
      } else if (e.t === 'extra') {
        const [c, r] = e.cell, d = cells[r][c]; d.classList.add('scatwin'); Snd.fx('scatter', 2); pow('+1 SPIN');
        flashChip('chipSpins'); $('spinsLeft').textContent = +$('spinsLeft').textContent + 1; await sleep(800); d.classList.remove('scatwin'); setCell(d, e.g[c][r], 'popin');
      } else if (e.t === 'sticky') {
        const [c, r] = e.cell, d = cells[r][c]; setCell(d, E.WILD, 'popin'); d.classList.add('sticky'); Snd.fx('sticky'); const [x, y] = FX.center(d); FX.burst('spark', x, y, 8, 4);
        msg('Le Prince Noir pose un joker collant.'); flashChip('chipMult'); $('multN').textContent = `${b.sticky.size}/${T.maxSticky}`; await sleep(600);
      } else if (e.t === 'myst') {
        for (const [c, r] of e.cells) setCell(cells[r][c], E.MYST, 'popin');
        Snd.fx('myst'); msg('Des masques mystère…'); await sleep(750);
        for (const [c, r] of e.cells) setCell(cells[r][c], e.sym, 'reveal');
        Snd.fx('reveal'); msg(`… qui se révèlent tous : ${SYM_NAME[e.sym]} !`); await sleep(750);
      } else if (e.t === 'black') {
        await blackJester(cells, e, red, b.sticky);
      } else if (e.t === 'red') {
        await redJester(cells, e.cells, red);
      }
    }
    sync(cells, ev.pre, red, b.sticky);
    await playSteps(cells, ev.steps, unit, { red, sticky: b.sticky, onWin: async s => { if (s.after) { $('multN').textContent = '×' + s.after; flashChip('chipMult'); Snd.fx('mult', s.after); } } });
    if (ev.multUp) { $('multN').textContent = '×' + ev.multUp; flashChip('chipMult'); Snd.fx('mult', ev.multUp); toast(`La valse rouge accélère : ×${ev.multUp}`); }
    total = Math.min(T.cap * b0, b.total * b0); upd(); if (ev.win > 0) flashChip('chipTotal');
    if (!ev.steps.length) { msg('Aucune grappe à ce spin'); await sleep(650); } else await sleep(480);
  }
  return b.tier === 3 ? `${DANCE[b.dance].name}, ${b.fous.length} Fou${b.fous.length > 1 ? 's' : ''} entré${b.fous.length > 1 ? 's' : ''} au bal` : b.tier === 4 ? `${b.layers.length} masque${b.layers.length > 1 ? 's' : ''} retiré${b.layers.length > 1 ? 's' : ''}, multiplicateur final ×${b.mult}` : `multiplicateur final ×${b.mult}`;
}
async function runBonus(tier, bought, count) {
  const b0 = bet(); SALLE.bonus(tier, bought);
  await introBonus(tier, count, bought);
  document.body.classList.add('bonus'); Snd.setBonus(true); msg('');
  const b = E.newBonus(tier);
  hud(tier, '', b.spinsLeft, 'MULTI', '×' + b.mult, 0); fousRow(b);
  if (tier === 3) await lastDance(b);
  if (tier === 4) await removeMask(b);
  const detail = await runSpins(b, b0);
  const win = b.total * b0, mult = b.total;
  await sleep(500);
  if (b.capped) toast('Gain maximum atteint !');
  if (tier === 5) SALLE.flag('bal-des-fous');
  if (winTier(mult)) await bigWin(win, mult);
  S.balance += win; setMoney(); $('lastWin').textContent = fmt(SALLE.gain(win, bet()));
  await overlay(`<h2>${fmt(win)}</h2><p>${TIER_NAME[tier]} terminé : ${detail}. ×${mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} la mise${bought ? ` (acheté ${E.BUY[tier].toLocaleString('fr-FR')}×)` : ''}.</p>`, 'Continuer');
  document.body.classList.remove('bonus', 'stg'); Snd.setBonus(false); $('fous').innerHTML = '';
  msg(`${TIER_NAME[tier]} : ${fmt(win)}`);
  showStatic(E.spinBase());
}

// ---------- achat du bonus ----------
function openBuy() {
  if (S.busy || S.auto) return;
  const off = t => {
    const price = E.BUY[t] * bet(), ok = !S.ante && S.balance >= price - 1e-9;
    const d = t === 3 ? '8 free spins et la dernière danse : choisis ton partenaire' : t === 4 ? 'Retire les masques, puis 10 free spins avec le Fou Rouge' : 'Les deux Fous, 10 free spins, multiplicateur sans fin';
    return `<button class="offer" data-t="${t}" ${ok ? '' : 'disabled'}>${ART.SCAT}<span><strong>${TIER_NAME[t]}</strong>${t} masques du Fou. ${d}<span class="price">${fmt(price)} lucioles (${E.BUY[t].toLocaleString('fr-FR')}× la mise)</span></span></button>`;
  };
  $('card').innerHTML = `<h2>Acheter un bonus</h2><p>${S.ante ? 'Désactive Chance bonus pour acheter.' : 'Le prix dépend de la mise en cours.'}</p><div class="offers">${off(3)}${off(4)}${off(5)}</div><button class="btn ghost" id="ovBtn">Annuler</button>`;
  $('overlay').classList.add('show');
  $('ovBtn').onclick = () => $('overlay').classList.remove('show');
  $('card').querySelectorAll('.offer').forEach(o => o.onclick = () => { $('overlay').classList.remove('show'); buy(+o.dataset.t); });
  $('ovBtn').focus();
}
async function buy(tier) {
  const price = E.BUY[tier] * bet();
  if (S.balance < price - 1e-9) return;
  S.busy = true; lockUI(true); Snd.start();
  S.balance -= price; setMoney(); msg(`${TIER_NAME[tier]} acheté`);
  const g = E.spinBase('normal');
  for (const col of g) for (let r = 0; r < 5; r++) if (col[r] === E.SCAT) col[r] = 0;
  const spots = []; for (let c = 0; c < 5; c++) for (let r = 0; r < 5; r++) spots.push([c, r]);
  spots.sort(() => Math.random() - 0.5).slice(0, tier).forEach(([c, r]) => (g[c][r] = E.SCAT));
  const cells = await revealDrop(g);
  await presentScatters(cells, g);
  await runBonus(tier, true, tier);
  Snd.hush(false);
  S.busy = false; lockUI(false);
}

// ---------- fenêtres ----------
function overlay(html, btn) {
  return new Promise(res => {
    $('card').innerHTML = html + (btn ? `<button class="btn" id="ovBtn">${btn}</button>` : '');
    $('overlay').classList.add('show');
    const b = $('ovBtn'); if (b) { b.focus(); b.onclick = () => { $('overlay').classList.remove('show'); res(); }; }
  });
}
function showRules() {
  const pn = E.scatProbs('normal'), pa = E.scatProbs('ante');
  const every = p => Math.round(1 / p).toLocaleString('fr-FR');
  const x = v => v.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  const SIZES = [5, 6, 8, 10, 12, 15];
  const rows = E.SYMS.map((s, i) => `<tr><td>${ART.SYMS[i]}</td>${SIZES.map(n => `<td>${x(s.pay * E.SIZE_F[Math.min(n, E.SIZE_F.length - 1)] * E.BASE_SCALE.normal)}</td>`).join('')}</tr>`).slice().reverse().join('');
  $('card').innerHTML = `<div class="rules"><h2>Le Bal des Fous</h2>
  <p>Une fois par siècle, le palais ouvre ses portes. Tous les invités portent un masque : personne ne sait qui est humain, qui est fou… ni qui mène la soirée.</p>
  <p>Grille de 5×5 en <b>grappes</b> : 5 symboles identiques ou plus qui se touchent (haut, bas, gauche, droite) paient. Le masque fendu <b>WILD</b> remplace tous les symboles sauf le masque du Fou. Les gagnants s'effacent et d'autres tombent à leur place : les <b>cascades</b> continuent tant qu'il y a des grappes. Gains par grappe, en multiples de la mise :</p>
  <div class="tw"><table><tr><th></th>${SIZES.map(n => `<th>${n}${n === 15 ? '+' : ''}</th>`).join('')}</tr>${rows}</table></div>
  <h3>Pendant le bal</h3>
  <ul><li><b>Le Fou Rouge</b> (environ 1 spin sur ${Math.round(1 / E.FEAT.red)}) : il désigne une case, puis une voisine, puis une autre, et y pose une chaîne de jokers rouges. Dès qu'une grappe en touche un, il éclate de rire : cette cascade et les suivantes gagnent ×2, ×3, ×5, ×10 puis ×25, tant que les cascades continuent.</li>
  <li><b>Le Fou Noir</b> (environ 1 spin sur ${Math.round(1 / E.FEAT.black)}) : la lumière baisse, il tire les rideaux sur les petites cartes (10, J, puis parfois Q). Elles disparaissent et ne retombent plus pendant ce spin.</li></ul>
  <h3>La jauge SANITY</h3>
  <p>Au début, tout est élégant. Chaque cascade, chaque masque du Fou et chaque apparition d'un Fou font baisser la raison. À 75 %, les invités commencent à bouger. À 50 %, les masques sourient. À 25 %, les tableaux te regardent et les roses blanches deviennent rouges. À 0 % : <b>MADNESS</b>. Pendant ${E.SANITY.madness} spins, le Fou Rouge et le Fou Noir sont là ensemble, et un multiplicateur grimpe à chaque cascade sans redescendre. La jauge est conservée d'un spin à l'autre.</p>
  <h3>Les bonus des masques du Fou</h3>
  <ul><li><b>3 masques, The Masquerade</b> (1 spin sur ${every(pn[3])}) : 8 free spins. <b>The Last Dance</b> : tu choisis ton partenaire. Dame Rouge, le multiplicateur grimpe à chaque spin (jusqu'à ×10) ; Prince Noir, un joker collant de plus à chaque spin ; Fou Blanc, des masques mystère qui se révèlent en un même symbole ; l'Inconnu, l'une des trois au hasard. Les trois danses rapportent autant en moyenne, seul le risque change. Chaque masque du Fou qui tombe pendant le bal fait entrer un Fou (+1 spin, 3 au plus) : le Fou Rouge frappe un spin sur deux, le Fou Noir chasse une petite carte pour de bon.</li>
  <li><b>4 masques, Remove the Mask</b> (1 spin sur ${every(pn[4])}) : ${INTRO_TXT[4]} Sous les masques : la Dame (jokers collants), le Fou (multiplicateur), le Roi Mort (chasse des petites cartes), le Maître (le rire du Fou commence plus haut, +2 spins). Plus tu descends, plus c'est riche.</li>
  <li><b>5 masques ou plus, Le Bal des Fous</b> (1 spin sur ${every(pn[5])}) : ${INTRO_TXT[5]}</li></ul>
  <h3>Options</h3>
  <p>Acheter The Masquerade coûte ${E.BUY[3]} fois la mise, Remove the Mask ${E.BUY[4]} fois et Le Bal des Fous ${E.BUY[5].toLocaleString('fr-FR')} fois. Chance bonus ajoute 25 % à la mise et fait passer les bonus d'un spin sur ${every(pn[3] + pn[4] + pn[5])} à un sur ${every(pa[3] + pa[4] + pa[5])} ; l'achat est alors indisponible. Turbo accélère les animations. Espace lance un spin.</p>
  <p>RTP : 98,5 % en jeu normal, avec Chance bonus et pour chaque achat. Gain maximum : ${E.TIER[3].cap.toLocaleString('fr-FR')}, ${E.TIER[4].cap.toLocaleString('fr-FR')} et ${E.TIER[5].cap.toLocaleString('fr-FR')} fois la mise selon le bonus. Lucioles : monnaie fictive, aucun argent réel.</p></div>
  <button class="btn" id="ovBtn">Fermer</button>`;
  $('overlay').classList.add('show'); $('ovBtn').onclick = () => $('overlay').classList.remove('show'); $('ovBtn').focus();
}

// ---------- commandes ----------
$('spin').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else spin(); };
$('autoBtn').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else if (!S.busy) chooseAuto(); };
$('buyBtn').onclick = openBuy;
$('anteBtn').onclick = () => { if (S.busy || S.auto) return; S.ante = !S.ante; $('anteBtn').classList.toggle('on', S.ante); $('anteBtn').setAttribute('aria-pressed', S.ante); setMoney(); msg(S.ante ? `Chance bonus : mise de ${fmt(cost())}, bonus plus fréquents.` : 'Chance bonus désactivée.'); };
$('turboBtn').onclick = () => { S.turbo = !S.turbo; $('turboBtn').classList.toggle('on', S.turbo); $('turboBtn').setAttribute('aria-pressed', S.turbo); };
$('musicBtn').onclick = () => { Snd.start(); const on = Snd.toggleMusic(); $('musicBtn').setAttribute('aria-pressed', on); $('musicBtn').setAttribute('aria-label', on ? 'Couper la musique' : 'Mettre la musique'); };
$('sfxBtn').onclick = () => { const on = Snd.toggleSfx(); $('sfxBtn').setAttribute('aria-pressed', on); $('sfxBtn').setAttribute('aria-label', on ? 'Couper les effets sonores' : 'Mettre les effets sonores'); };
$('infoBtn').onclick = () => { if (!$('overlay').classList.contains('show')) showRules(); };
$('menuBtn').onclick = () => { if (!$('overlay').classList.contains('show')) showRules(); };
$('betDown').onclick = () => { if (!S.busy && !S.auto && S.betIdx > 0) { S.betIdx--; setMoney(); } };
$('betUp').onclick = () => { if (!S.busy && !S.auto && S.betIdx < BETS.length - 1) { S.betIdx++; setMoney(); } };
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || $('overlay').classList.contains('show') || $('bwLayer').classList.contains('show') || $('intro').classList.contains('show') || document.body.classList.contains('bonus')) return;
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  e.preventDefault(); if (!S.auto) spin();
});
(function depth() {
  const dust = $('dust');
  for (let i = 0; i < 18; i++) { const d = document.createElement('i'); d.style.left = (10 + Math.random() * 80) + '%'; d.style.top = (40 + Math.random() * 55) + '%'; d.style.setProperty('--d', (9 + Math.random() * 9) + 's'); d.style.setProperty('--dl', (-Math.random() * 18) + 's'); d.style.setProperty('--dx', ((Math.random() - .5) * 80) + 'px'); dust.appendChild(d); }
  if (reduce) return;
  const rig = $('rig'), sc = document.querySelector('.scene'); let tx = 0, ty = 0, cx = 0, cy = 0, lastIn = -1e9;
  addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; lastIn = performance.now(); }, { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma == null) return; tx = Math.max(-1, Math.min(1, e.gamma / 25)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); lastIn = performance.now(); });
  (function loop(now) {
    if (now - lastIn > 3000) { tx = Math.sin(now / 3200) * .45; ty = Math.sin(now / 4100) * .25; } // au repos, la machine respire
    cx += (tx - cx) * .05; cy += (ty - cy) * .05;
    rig.style.setProperty('--rx', (-cy * 4).toFixed(2) + 'deg'); rig.style.setProperty('--ry', (cx * 6).toFixed(2) + 'deg');
    sc.style.setProperty('--px', cx.toFixed(3)); sc.style.setProperty('--py', cy.toFixed(3));
    requestAnimationFrame(loop);
  })(performance.now());
})();
setSanity(100);
setMoney(); showStatic(E.spinBase());
// passage en 3D dès que les planches sont prêtes (la grille affichée est redessinée si la machine est au repos)
addEventListener('art3d', () => { if (!S.busy && !document.body.classList.contains('bonus')) showStatic(E.spinBase()); });
CHARGE3D(ART, ART3D_MODELS, DECOR3D);
})();
</script></body></html>
