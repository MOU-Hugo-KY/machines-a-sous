<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murim : Heavenly Demon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Ma+Shan+Zheng&family=Teko:wght@500;600;700&family=Spectral:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070608; --noir:#0C0B0E; --noir2:#16141A; --papier:#F2ECDF; --papier2:#D9CFBC; --brume:#8C8A92; --gris:#4A4750;
  --sang:#B3141F; --sang2:#E8202F; --sang3:#5A060C; --or:#D8A845; --or2:#F7D98A; --or3:#8A6420;
  --brush:"Zhi Mang Xing","Ma Shan Zheng",serif; --cap:"Teko","Oswald",sans-serif; --serif:"Spectral",Georgia,serif;
  --grain:radial-gradient(circle at 20% 30%, rgba(255,255,255,.03) 0 1px, transparent 1.5px) 0 0/7px 7px, radial-gradient(circle at 70% 60%, rgba(0,0,0,.18) 0 1px, transparent 1.5px) 0 0/9px 9px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; overflow-x:hidden}
body{margin:0; min-height:100%; color:var(--papier); background:var(--noir); font-family:var(--serif); font-weight:600; font-size:17px; overflow-x:hidden}
button{font:inherit; color:inherit}
/* ---------- le décor : six mondes, de la cour sous la pluie au royaume céleste ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:#0C0B0E}
.scene svg.pl{position:absolute; inset:-4%; width:108%; height:108%; transform:translate3d(calc(var(--px,0) * var(--k) * -1px), calc(var(--py,0) * var(--k) * -.6px), 0)}
.scene svg.back{--k:12} .scene svg.mid{--k:28} .scene svg.front{--k:56; inset:-8%; width:116%; height:116%}
.world{opacity:0; transition:opacity 1.8s ease}
body.sc0 .w0,body.sc1 .w1,body.sc2 .w2,body.sc3 .w3,body.sc4 .w4,body.sc5 .w5{opacity:1}
.scene::after{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,.7) 100%)}
.mist{animation:mist 30s ease-in-out infinite alternate} .mist.m2{animation-duration:42s; animation-delay:-12s}
@keyframes mist{from{transform:translateX(-60px)}to{transform:translateX(80px)}}
.rain{position:absolute; inset:0; opacity:0; transition:opacity 1.5s; background:repeating-linear-gradient(105deg, transparent 0 18px, rgba(200,210,230,.12) 18px 19px, transparent 19px 40px); background-size:200px 200px; animation:rain .5s linear infinite}
body.sc0 .rain{opacity:1}
@keyframes rain{to{background-position:-60px 200px}}
.lantern{animation:lant 4s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 0}
@keyframes lant{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.glowp{animation:glowp 3s ease-in-out infinite alternate} @keyframes glowp{to{opacity:.55}}
.petals{position:absolute; inset:0; overflow:hidden}
.petals i{position:absolute; top:-5%; width:12px; height:9px; border-radius:80% 0 80% 0; background:linear-gradient(135deg, #FFE4EC, #F4A6BE); box-shadow:0 0 4px rgba(255,180,200,.4); opacity:.9; animation:petal var(--d) linear infinite; animation-delay:var(--dl)}
body.sc4 .petals i{background:linear-gradient(135deg, #FF6A74, #9A0A18)} body.sc5 .petals i{background:linear-gradient(135deg, #FFF6D8, #F7D98A)}
@keyframes petal{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx), 112vh) rotate(720deg)}}
/* ---------- la machine ---------- */
main{position:relative; z-index:1; max-width:500px; margin:0 auto; padding:4px 10px 18px; perspective:1400px; perspective-origin:50% 35%}
main.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
.rig{transform-style:preserve-3d; transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.topper{position:relative; height:176px; margin:0 -8px -22px; z-index:2; transform:translateZ(46px); transform-style:preserve-3d}
.topper svg.sign{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.logo{position:absolute; left:0; right:0; top:62px; margin:0; text-align:center; pointer-events:none}
.logo b{display:inline-block; position:relative; font-family:var(--brush); font-weight:400; font-size:clamp(3rem, 15vw, 4.4rem); line-height:.9; letter-spacing:.04em; color:var(--papier);
  text-shadow:0 2px 0 #000, 0 0 2px #000, 0 6px 14px rgba(0,0,0,.9), 0 0 26px rgba(232,32,47,.55)}
.logo b::after{content:""; position:absolute; left:-6%; right:-6%; bottom:10%; height:10px; background:linear-gradient(90deg, transparent, rgba(232,32,47,.8), transparent); filter:blur(3px); z-index:-1}
.logo i{display:block; margin-top:2px; font-family:var(--cap); font-style:normal; font-weight:600; font-size:clamp(.95rem, 4.4vw, 1.2rem); letter-spacing:.42em; padding-left:.42em; color:var(--or2); text-shadow:0 1px 0 #000, 0 0 10px rgba(216,168,69,.5)}
.hbtns{position:absolute; right:4px; bottom:44px; display:flex; gap:5px; z-index:3; transform:translateZ(10px)}
.ico{width:32px; height:32px; border-radius:50%; border:1px solid var(--or3); background:radial-gradient(circle at 40% 30%, #3A3238, #0C0B0E 70%); display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 0 0 2px #000}
.ico svg{width:16px; height:16px}
.ico[aria-pressed="false"]{opacity:.45}
.ico:focus-visible,.btn:focus-visible,.spin:focus-visible,.sb:focus-visible,.badge:focus-visible,.pick:focus-visible,.offer:focus-visible{outline:2px solid var(--or2); outline-offset:3px}
.cabinet{position:relative; transform-style:preserve-3d; padding:20px 22px 0; border-radius:6px;
  background:radial-gradient(ellipse at 50% 0%, rgba(179,20,31,.22), transparent 55%), var(--grain), linear-gradient(180deg, #17121A, #070608);
  box-shadow:0 0 0 1px #000, 0 0 0 3px var(--or3), 0 0 0 4px #000, 0 0 0 9px #3A0A0E, 0 0 0 10px #000, 0 0 0 12px var(--or), 0 0 0 13px #000,
    inset 0 30px 60px rgba(0,0,0,.6), 0 40px 80px rgba(0,0,0,.9), 0 0 90px rgba(179,20,31,.3)}
/* montants laqués et pompons rouges */
.post{position:absolute; top:44px; bottom:128px; width:14px; transform:translateZ(30px); border-radius:2px; background:repeating-linear-gradient(0deg, rgba(0,0,0,.3) 0 2px, transparent 2px 22px), linear-gradient(90deg, #3A0A0E, #B3141F 45%, #5A060C); box-shadow:0 0 0 1px #000, inset 0 0 0 1px rgba(247,217,138,.35)}
.post.l{left:3px} .post.r{right:3px}
.post::before,.post::after{content:""; position:absolute; left:-3px; right:-3px; height:10px; border-radius:2px; background:linear-gradient(var(--or2), var(--or3)); box-shadow:0 0 0 1px #000}
.post::before{top:-6px} .post::after{bottom:-6px}
.tassel{position:absolute; top:6px; width:10px; height:40px; z-index:6; transform:translateZ(34px); transform-origin:50% 0; animation:tas 3s ease-in-out infinite alternate;
  background:radial-gradient(circle at 50% 10%, var(--or2) 0 3px, transparent 3.5px), linear-gradient(90deg, #5A060C, #E8202F 50%, #5A060C) 50% 14px/6px 26px no-repeat}
.tassel.l{left:-6px} .tassel.r{right:-6px; animation-delay:-1.5s}
@keyframes tas{from{transform:translateZ(34px) rotate(-5deg)}to{transform:translateZ(34px) rotate(5deg)}}
/* méridiens */
.meridians{display:flex; align-items:center; gap:8px; margin:2px 22px 8px; transform:translateZ(14px)}
.meridians svg.body{width:26px; height:34px; flex:none}
.mline{position:relative; flex:1; height:26px; display:flex; align-items:center; justify-content:space-between}
.mline::before{content:""; position:absolute; left:6px; right:6px; top:50%; height:2px; margin-top:-1px; background:linear-gradient(90deg, var(--or3), var(--gris)); opacity:.7}
.mline .fill{position:absolute; left:6px; top:50%; height:3px; margin-top:-1.5px; width:0; background:linear-gradient(90deg, #E8202F, #F7D98A); box-shadow:0 0 8px #E8202F; transition:width .8s}
.mline b{position:relative; z-index:1; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 40% 35%, #3A3238, #0C0B0E); box-shadow:0 0 0 1px var(--or3), 0 0 0 2px #000; display:grid; place-items:center; font-family:var(--brush); font-weight:400; font-size:.7rem; color:var(--brume)}
.mline b.on{background:radial-gradient(circle at 45% 40%, #FFF3C8, #F7A020 45%, #B3141F 80%); color:#000; box-shadow:0 0 0 1px #000, 0 0 12px 3px rgba(247,160,32,.8); animation:ember 1.2s ease-in-out infinite alternate}
.mline b.new{animation:burst .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes ember{to{box-shadow:0 0 0 1px #000, 0 0 18px 5px rgba(232,32,47,.8)}}
@keyframes burst{0%{transform:scale(2.4)}100%{transform:none}}
.meridians .lbl{font-family:var(--cap); font-size:.8rem; letter-spacing:.14em; color:var(--or2); white-space:nowrap}
body.gates .meridians .lbl{color:var(--sang2)}
.screen{position:relative; transform-style:preserve-3d; padding:8px 7px 6px; border-radius:4px; background:radial-gradient(ellipse at 50% 30%, #1A1216, #030204 75%);
  box-shadow:0 0 0 1px var(--or3), 0 0 0 3px #000, 0 0 0 4px #3A0A0E, inset 0 0 40px rgba(0,0,0,.95)}
body.gates .screen{box-shadow:0 0 0 1px var(--sang2), 0 0 0 3px #000, 0 0 30px rgba(232,32,47,.55), inset 0 0 40px rgba(0,0,0,.95)}
.hud{display:none; align-items:center; justify-content:space-between; gap:6px; padding:0 0 7px; flex-wrap:wrap; transform:translateZ(8px)}
body.bonus .hud{display:flex}
.hud .tier{width:100%; display:flex; justify-content:space-between; align-items:baseline; gap:8px; white-space:nowrap}
.hud .tier span:first-child{font-family:var(--cap); font-weight:700; font-size:1.3rem; letter-spacing:.08em; color:var(--papier); text-shadow:0 0 10px rgba(232,32,47,.7)}
.hud .tier span:last-child{font-style:italic; font-size:.95rem; color:var(--or2); overflow:hidden; text-overflow:ellipsis}
.chip{background:rgba(242,236,223,.05); border:1px solid var(--or3); border-radius:2px; padding:0 9px; font-family:var(--cap); font-size:.85rem; letter-spacing:.12em; display:flex; align-items:center; gap:6px; color:var(--brume)}
.chip b{font-family:var(--cap); font-weight:700; font-size:1.25rem; color:var(--papier); font-variant-numeric:tabular-nums}
#chipMult b{color:var(--sang2)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--sang); transform:scale(1.15)}100%{transform:none}}
/* barres propres aux bonus : duel, guerre des sectes, cultivation */
.bars{display:none; width:100%; flex-direction:column; gap:4px}
body.bonus .bars:not(:empty){display:flex}
.hp{display:flex; align-items:center; gap:6px; font-family:var(--cap); font-size:.85rem; letter-spacing:.1em}
.hp .who{width:74px; flex:none; color:var(--papier2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hp .bar{position:relative; flex:1; height:12px; background:#050407; box-shadow:0 0 0 1px var(--or3); overflow:hidden}
.hp .bar i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, #5A060C, #E8202F); transition:width .5s}
.hp.hero .bar i{background:linear-gradient(90deg, #8A6420, #F7D98A)}
.hp .n{width:34px; text-align:right; color:var(--papier)}
.war{position:relative; height:26px; background:#050407; box-shadow:0 0 0 1px var(--or3); display:flex}
.war i{position:absolute; top:0; bottom:0; transition:width .6s}
.war i.w{left:0; background:linear-gradient(90deg, #8C8A92, #F2ECDF)} .war i.r{right:0; background:linear-gradient(270deg, #5A060C, #E8202F)}
.war::after{content:"中"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:var(--brush); color:var(--or2); font-size:1rem; text-shadow:0 0 4px #000}
.war span{position:absolute; top:50%; transform:translateY(-50%); font-family:var(--cap); font-size:.8rem; letter-spacing:.1em; color:#000; z-index:1}
.war span.w{left:6px} .war span.r{right:6px; color:#fff}
.ranks{display:flex; gap:3px}
.ranks b{flex:1; font-family:var(--cap); font-weight:600; font-size:.66rem; letter-spacing:.06em; text-align:center; padding:2px 0; background:#050407; color:var(--gris); box-shadow:0 0 0 1px #2A2530; white-space:nowrap; overflow:hidden}
.ranks b.on{background:linear-gradient(#F7D98A, #8A6420); color:#000; box-shadow:0 0 0 1px #000}
.ranks b.cur{background:linear-gradient(#FF4A58, #8A0A16); color:#fff; box-shadow:0 0 10px rgba(232,32,47,.7)}
.qibar{position:relative; height:10px; background:#050407; box-shadow:0 0 0 1px var(--or3); overflow:hidden}
.qibar i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, #3A8AFF, #BFE6FF, #F7D98A); box-shadow:0 0 10px #8AC8FF; transition:width .5s}
/* la grille : six rouleaux en arc */
.gridwrap{position:relative; transform-style:preserve-3d; transform:scale(.95)}
.frames{position:absolute; inset:-2px -2px 30px; display:grid; grid-template-columns:repeat(6,1fr); gap:5px; pointer-events:none; transform-style:preserve-3d; perspective:760px; perspective-origin:50% 45%}
.frames i{position:relative; border-radius:3px; background:linear-gradient(180deg, rgba(247,217,138,.06), transparent 30%), radial-gradient(ellipse at 50% 20%, #1E1418, #07060A 80%); box-shadow:0 0 0 1px #000, 0 0 0 2px var(--or3), 0 0 0 3px #000, inset 0 0 20px rgba(0,0,0,.9)}
.frames i::before{content:""; position:absolute; left:-2px; right:-2px; top:-8px; height:8px; background:linear-gradient(#E8202F, #5A060C); box-shadow:0 0 0 1px #000; border-radius:2px 2px 0 0}
.grid{position:relative; display:grid; grid-template-columns:repeat(6,1fr); gap:5px; padding:10px 0 2px; transform-style:preserve-3d; perspective:760px; perspective-origin:50% 45%}
.cell,.frames i{--ry:0deg; --tz:0px; transform-origin:50% 50%}
.cell{transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 10px))} .frames i{transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 3px))}
.cell:nth-child(6n+1),.frames i:nth-child(1){--ry:18deg; --tz:28px} .cell:nth-child(6n+2),.frames i:nth-child(2){--ry:10deg; --tz:10px} .cell:nth-child(6n+3),.frames i:nth-child(3){--ry:3deg; --tz:1px}
.cell:nth-child(6n+4),.frames i:nth-child(4){--ry:-3deg; --tz:1px} .cell:nth-child(6n+5),.frames i:nth-child(5){--ry:-10deg; --tz:10px} .cell:nth-child(6n+6),.frames i:nth-child(6){--ry:-18deg; --tz:28px}
.cell{aspect-ratio:1; position:relative; display:grid; place-items:center; border-radius:4px; transition:opacity .3s, filter .3s;
  background:var(--grain), radial-gradient(circle at 50% 30%, #2A2228, #09080B 85%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 2px rgba(0,0,0,.45), inset 0 0 0 3px rgba(216,168,69,.12), inset 0 -10px 16px rgba(0,0,0,.5), 0 4px 0 #000, 0 8px 12px rgba(0,0,0,.6)}
.cell.t-papier{background:var(--grain), radial-gradient(circle at 50% 30%, #FFFBF0, #BFB39C 90%)} .cell.t-or{background:var(--grain), radial-gradient(circle at 50% 30%, #FFE7A8, #8A6420 90%)}
.cell.t-nuit{background:var(--grain), radial-gradient(circle at 50% 30%, #3A3450, #0A0812 90%)} .cell.t-sang{background:var(--grain), radial-gradient(circle at 50% 30%, #E8303E, #4A040A 90%)}
.cell.t-ciel{background:var(--grain), radial-gradient(circle at 50% 30%, #FFFFFF, #D8BC78 90%)}
.cell.t-wild{background:radial-gradient(circle at 50% 45%, #3A2A10, #0A0604 85%); box-shadow:inset 0 0 0 2px var(--or), inset 0 0 18px rgba(247,217,138,.5), 0 4px 0 #000, 0 0 16px rgba(247,217,138,.5)}
.cell.t-scat{background:radial-gradient(circle at 50% 45%, #5A060C, #0A0204 85%); box-shadow:inset 0 0 0 1px var(--sang2), inset 0 0 18px rgba(232,32,47,.6), 0 4px 0 #000, 0 0 16px rgba(232,32,47,.45)}
.cell.t-myst{background:radial-gradient(circle at 50% 40%, #2A2228, #050407); box-shadow:inset 0 0 0 1px var(--or2), 0 4px 0 #000}
.cell svg{width:90%; height:90%; display:block; overflow:visible}
.cell.pending>*{visibility:hidden}
.cell.drop>*{animation:drop .42s cubic-bezier(.3,1.4,.55,1) both}
.cell.popin>*{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.grid.dimmed .cell:not(.win):not(.scatwin){opacity:.3; filter:saturate(.3)}
.cell.win{z-index:1; transform:rotateY(var(--ry)) translateZ(calc(var(--tz) + 28px)); box-shadow:0 0 0 2px var(--or2), 0 0 0 4px rgba(232,32,47,.7), 0 0 24px rgba(232,32,47,.9), 0 14px 18px rgba(0,0,0,.6)}
.cell.boom>*{animation:boom .35s ease-in forwards}
@keyframes boom{40%{transform:scale(1.15); filter:brightness(2)}100%{transform:scale(.2) rotate(20deg); opacity:0}}
.cell.antic{animation:antic .45s ease-in-out infinite alternate}
@keyframes antic{from{box-shadow:0 0 0 1px var(--sang)}to{box-shadow:0 0 0 2px var(--sang2), 0 0 18px var(--sang)}}
.cell.scat::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--sang2); animation:ring .7s ease-out forwards; pointer-events:none}
@keyframes ring{from{transform:scale(.4); opacity:1}to{transform:scale(1.5); opacity:0}}
.cell.scatwin{z-index:2; box-shadow:0 0 0 2px var(--sang2), 0 0 26px 6px rgba(232,32,47,.8)}
.cell.scatwin>*{animation:scatpulse .5s ease-in-out infinite alternate}
@keyframes scatpulse{from{transform:scale(1)}to{transform:scale(1.14) rotate(-4deg)}}
.grid.opening .cell.t-scat>*{animation:bookopen 1s ease-in-out infinite alternate}
@keyframes bookopen{to{transform:scale(1.12); filter:drop-shadow(0 0 8px #E8202F) brightness(1.3)}}
.cell.strike-hit::before{content:""; position:absolute; inset:0; z-index:3; background:linear-gradient(115deg, transparent 45%, #000 46% 54%, transparent 55%); animation:cut .4s ease-out both}
@keyframes cut{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.cell.qi{box-shadow:0 0 0 2px var(--or2), 0 0 20px rgba(247,217,138,.9); z-index:2}
.cell.reveal>*{animation:reveal .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes reveal{0%{transform:rotateY(90deg)}100%{transform:none}}
@keyframes drop{from{transform:translateY(-80%); opacity:0}to{transform:none; opacity:1}}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.apron{height:36px; margin:-2px -10px -8px; position:relative; transform-origin:50% 0; transform:perspective(260px) rotateX(62deg);
  background:linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.85)), repeating-linear-gradient(90deg, #2A1A12 0 22px, #3A2418 22px 24px);
  -webkit-mask-image:linear-gradient(#000 20%, transparent); mask-image:linear-gradient(#000 20%, transparent); box-shadow:inset 0 2px 0 var(--or3)}
/* textes qui jaillissent */
.pow,.float,.hero,.slash{translate:0 0 90px} /* devant les cases courbées (3D partagée) */
.pow{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); z-index:7; pointer-events:none; white-space:nowrap; font-family:var(--cap); font-weight:700; font-size:clamp(1.9rem, 10vw, 3rem); letter-spacing:.06em; color:var(--papier);
  padding:2px 18px; background:linear-gradient(90deg, transparent, rgba(90,6,12,.95) 14%, rgba(179,20,31,.96) 50%, rgba(90,6,12,.95) 86%, transparent); text-shadow:0 2px 0 #000, 0 0 14px rgba(0,0,0,.8); animation:powin 1.3s ease-out forwards}
.pow.gold{background:linear-gradient(90deg, transparent, rgba(138,100,32,.95) 14%, rgba(216,168,69,.96) 50%, rgba(138,100,32,.95) 86%, transparent); color:#000; text-shadow:none}
.pow.brush{font-family:var(--brush); font-weight:400; font-size:clamp(2.4rem, 13vw, 3.8rem); letter-spacing:.02em}
@keyframes powin{0%{transform:translate(-50%,-50%) scale(1.8) skewX(-12deg); opacity:0; filter:blur(6px)}16%{transform:translate(-50%,-50%) scale(1); opacity:1; filter:none}78%{opacity:1}100%{transform:translate(-50%,-60%); opacity:0}}
.float{position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); font-family:var(--cap); font-weight:700; font-size:2.1rem; color:var(--or2); pointer-events:none; z-index:5; white-space:nowrap;
  text-shadow:0 2px 0 #000, 0 0 12px rgba(232,32,47,.9); animation:rise 1.2s ease-out forwards}
.float.m{color:var(--sang2); font-size:1.7rem; top:30%} .float.hit{color:#fff; font-size:2.4rem; top:24%; font-style:italic}
@keyframes rise{from{opacity:0; transform:translate(-50%,-20%) scale(.7)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)}to{opacity:0; transform:translate(-50%,-120%)}}
.hero{position:absolute; z-index:8; width:34%; left:33%; top:-14%; pointer-events:none; animation:jin .45s cubic-bezier(.3,1.5,.5,1) both}
.hero svg{width:100%; display:block; filter:drop-shadow(0 8px 14px rgba(0,0,0,.9))}
.hero.out{animation:jout .45s ease-in forwards}
@keyframes jin{from{transform:translateY(-30%) scale(.6); opacity:0}to{transform:none; opacity:1}}
@keyframes jout{to{transform:translateY(-20%) scale(.7); opacity:0}}

.studio{position:relative; display:grid; grid-template-columns:auto 1fr auto auto auto 1fr 1fr; align-items:center; gap:6px; margin:8px -22px 0; padding:8px 12px 10px; transform:translateZ(22px);

.sbet small{width:100%}
.sb{width:32px; height:32px; flex:none; border-radius:50%; border:1px solid var(--or3); background:radial-gradient(circle at 40% 30%, #3A3238, #0C0B0E 70%); color:var(--papier); cursor:pointer; padding:0; display:grid; place-items:center; font-size:1.05rem; line-height:1; box-shadow:0 0 0 1px #000}
.sb svg{width:15px; height:15px}
.sb:disabled{opacity:.4; cursor:default}
.sb.on{background:radial-gradient(circle at 40% 30%, #E8202F, #5A060C 70%); border-color:var(--or2)}
.studio .spin{width:68px; height:68px; margin-top:-28px; border-radius:50%; border:none; cursor:pointer; padding:0; display:grid; place-items:center;
  background:radial-gradient(circle at 38% 28%, #FF5A66, #B3141F 40%, #3A0408 80%); box-shadow:0 0 0 3px #000, 0 0 0 6px var(--or), 0 0 0 7px var(--or3), 0 0 0 8px #000, 0 10px 18px rgba(0,0,0,.8), 0 0 30px rgba(232,32,47,.55), inset 0 3px 4px rgba(255,255,255,.35)}

.badge{position:relative; flex:none; z-index:4; width:62px; height:62px; border-radius:50%; cursor:pointer; padding:0; display:grid; place-items:center; text-align:center; line-height:1; border:none;

/* ---------- fenêtres ---------- */

.card{position:relative; background:var(--grain), linear-gradient(180deg,#1C161C,#08070A); color:var(--papier); border:1px solid var(--or3); border-radius:4px; padding:22px 20px; max-width:420px; width:100%; text-align:center;

.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 14px}

.offer{display:flex; align-items:center; gap:12px; text-align:left; background:var(--grain), linear-gradient(#211A20,#0A080C); border:1px solid var(--or3); border-radius:3px; padding:10px 12px; cursor:pointer; box-shadow:0 0 0 2px #000; color:var(--papier)}

.offer span{display:flex; flex-direction:column; gap:1px; font-size:.95rem; line-height:1.25}
.offer strong{font-family:var(--cap); font-weight:700; letter-spacing:.06em; font-size:1.3rem; color:var(--papier)}
.offer .price{font-family:var(--cap); font-weight:600; font-size:1rem; color:var(--sang2); letter-spacing:.06em}
.rules{text-align:left}
.rules h2{text-align:center}
.rules h3{font-family:var(--cap); font-weight:700; letter-spacing:.06em; font-size:1.35rem; margin:14px 0 4px; color:var(--sang2)}
.rules table{width:100%; border-collapse:collapse; font-family:var(--cap); font-size:.95rem; margin:6px 0 8px; font-variant-numeric:tabular-nums}

.intro{position:fixed; inset:0; z-index:18; display:none; overflow:hidden; background:radial-gradient(circle, rgba(90,6,12,.94), rgba(5,2,4,.98))}

@keyframes tear{0%{clip-path:polygon(0 0,100% 0,100% 0,0 0)}40%{clip-path:polygon(0 0,100% 0,100% 55%,0 45%)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
.intro.dark{background:#000; animation:blackout 2.4s ease-out}

.layer{position:fixed; inset:0; z-index:20; display:none; place-items:center; pointer-events:none; padding:16px}

.medals{display:flex; justify-content:center; gap:4px; margin-bottom:10px; flex-wrap:wrap}

@keyframes walk{from{left:-12%}to{left:108%}}

.credit{position:absolute; left:0; right:0; bottom:6px; margin:0; text-align:center; font-size:.8rem; font-style:italic; color:var(--brume); opacity:.9}

<script>
// ---------- son : bruitages doux (SONS) et coups martiaux (sabre, paume, tambour de guerre, gong), musique coupée pour l'instant ----------
// @@MUSIQUE-DEBUT
// ---------- MUSIQUE : un petit compositeur (harmonie, voicings liés, mélodies à motifs) et des instruments doux ----------
// MUSIQUE(ctx, bus, partition) -> { start(bonus), stop(), setBonus(v), hush(v), setMood(m) }
// La partition décrit le morceau (tonalité, gamme, tempo, suite d'accords, instruments) ; tout le reste est composé ici,
// avec un aléatoire à graine : le morceau est toujours le même au début, puis ses mélodies varient à chaque tour.
// Voir references/musique.md.
const MUSIQUE = (() => {
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11], harmonic: [0, 2, 3, 5, 7, 8, 11], mixo: [0, 2, 4, 5, 7, 9, 10] };
  // notes d'un accord bâti en tierces sur un degré de la gamme ; ext : '', '7', '9', 'maj7' (= 7), 'maj9' (= 9), '6', 'sus', 'sus9', 'add9'
  function chord(P, deg, ext = '') {
    const sc = SCALES[P.scale], at = i => sc[((i % 7) + 7) % 7] + 12 * Math.floor(i / 7), d = deg - 1;
    const idx = [d, ext.startsWith('sus') ? d + 3 : d + 2, d + 4];
    if (/7|9/.test(ext) && ext !== 'add9') idx.push(d + 6);
    if (/9/.test(ext)) idx.push(d + 8);
    if (ext === '6') idx.push(d + 5);
    return { root: at(d), tones: idx.map(at) };
  }
  // voicing : chaque note prend l'octave la plus proche de la voix précédente (enchaînements doux, sans sauts)

async function bigWin(amount, mult) {
  const wt = winTier(mult); if (!wt) return;

    if (wt.t >= 3) shake();
    let fwTimer = null;

    const t0 = performance.now(); let done = false, lastTick = 0;
    const finish = () => {
      if (done) return; done = true; clearInterval(fwTimer); $('bwv').textContent = fmt(amount);
      FX.burst('spark', W / 2, H / 2, 20, 8);
      setTimeout(() => { el.classList.remove('show'); lay.className = 'layer click'; FX.stopRain(); $('demonqi').classList.remove('on'); res(); }, 1600);

      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);

    };
    requestAnimationFrame(step);
  });
}

    }

// joue les étapes d'un spin après la chute ; unit convertit le gain brut en lucioles
async function playSteps(cells, steps, unit, o = {}) {
  let paid = 0;
  for (const s of steps) {
    if (s.t === 'drop') continue;
    if (s.t === 'strike') { await strikeAnim(cells, s); continue; }
    if (s.t === 'meridian') { await meridianStep(cells, s); continue; }
    if (s.t === 'gates') { await gatesStep(cells, s); continue; }
    const win = s.amt * unit; paid += win;
    $('grid').classList.add('dimmed');
    for (const w of s.wins) for (const [c, r] of w.cells) cells[r][c].classList.add('win');
    const big = s.wins.reduce((m, w) => Math.max(m, w.size), 0);
    floatText('+' + fmt(win));
    if (o.hitLbl && s.lm > 1) floatText(o.hitLbl(s), 'hit'); else if (s.m > 1) floatText('×' + s.m, 'm');
    Snd.fx('win', win / bet() >= 5 ? 2 : 1);
    msg(`Grappe de ${big} : ${fmt(win)}${s.m > 1 ? ` (×${s.m})` : ''}`);
    if (o.onWin) await o.onWin(s);
    await sleep(720);
    Snd.fx('slash', .14);
    s.cells.forEach(([c, r], i) => { const d = cells[r][c]; d.classList.remove('win'); d.classList.add('boom'); if (i % Math.ceil(s.cells.length / 5) === 0) { const [x, y] = FX.center(d); FX.burst(i % 2 ? 'petal' : 'ink', x, y, 4, 4); } });
    if (s.cells.length >= 10) shake();
    await sleep(320);
    $('grid').classList.remove('dimmed');
    for (const row of cells) for (const d of row) d.classList.remove('win');
    for (const [c, r] of s.cells) setCell(cells[r][c], s.g[c][r]);
    if (s.attack) for (const [c, r] of s.attack) { const d = cells[r][c]; setCell(d, E.WILD, 'popin'); d.classList.add('qi'); }
    await sleep(420);
  }
  return paid;
}

async function spin() {

  if (S.balance < cost() - 1e-9) { noCredits(); stopAuto(); return false; }
  S.busy = true; lockUI(true); Snd.start(); Snd.fx('click');

  void win;

    const mult = total / bet();

  if (r.gatesOn && !r.gatesLeft) msg('Les Huit Portes se referment. Les méridiens repartent de zéro.');

// la boucle des free spins, commune aux trois bonus
async function runSpins(b, b0) {
  const T = E.TIER[b.tier]; let total = 0;
  const info = () => b.tier === 3 ? TECH[b.tech].name : b.tier === 4 ? (b.mode === 'duel' ? (b.scroll ? 'Duel · Technique Scroll' : 'Duel') : 'Sect War') : `${PATH[b.path].name} · ${E.RANKS[b.rank]}`;
  const multShown = () => b.tier === 3 && b.tech === 'blood' ? ['CASCADE', '×1→×10'] : b.tier === 4 && b.mode === 'duel' ? ['HIT', b.scroll ? '×2' : '×1'] : ['MULTI', '×' + b.mult];
  const bars = () => { if (b.tier === 4) b.mode === 'duel' ? barsDuel(b.hero, b.rival) : barsWar(b.army); else if (b.tier === 5) barsRank(b.rank, b.qi); else $('bars').innerHTML = ''; };
  const upd = () => { const [l, v] = multShown(); hud(b.tier, info(), b.spinsLeft, l, v, total); bars(); };
  const scene = () => setScene(b.tier === 3 ? 1 : b.tier === 4 ? (b.mode === 'duel' ? 2 : 3) : b.rank);
  showStatic(E.spinBase()); scene(); upd(); await sleep(600);
  while (!b.done) {
    // l'état avant le spin, pour animer les barres au fil des cascades
    const cur = { rival: b.rival, hero: b.hero, army: b.army ? b.army.slice() : null, rank: b.rank, qi: b.qi, spins: b.spinsLeft - 1 };
    const ev = E.bonusSpin(b); msg('');
    const unit = E.BONUS_K[b.tier] * b.k * b0;
    const defeated = ev.steps.some(s => s.defeat);
    $('spinsLeft').textContent = cur.spins;
    const cells = await revealDrop(ev.drop, false);
    for (const e of ev.events) {
      if (e.t === 'dragon') {
        pow('天龍', 'brush'); Snd.fx('dragon'); msg('Le joker s\'élève : un dragon de Qi remonte toute la colonne.');
        for (let r = ROWS - 1; r >= 0; r--) { const d = cells[r][e.col]; if (+d.dataset.x !== E.SCAT) { setCell(d, E.WILD, 'popin'); d.classList.add('qi'); const [x, y] = FX.center(d); FX.burst('spark', x, y, 6, 4); } await sleep(110); }
        await sleep(300);
      } else if (e.t === 'swords') {
        pow('萬劍歸宗', 'brush'); Snd.fx('swords'); msg(`${e.cells.length} épées de Qi tombent du ciel.`); await sleep(500);
        await qiWilds(cells, e.cells);
      } else if (e.t === 'greatwar') {
        pow('GREAT SECT WAR'); Snd.fx('domination'); msg('Les deux armées se heurtent au centre : une rangée entière devient joker.'); shake();
        for (const r of e.rows) for (let c = 0; c < COLS; c++) { const d = cells[r][c]; if (+d.dataset.x !== E.SCAT) { setCell(d, E.WILD, 'popin'); d.classList.add('qi'); } }
        await sleep(700);
      } else if (e.t === 'domination') {
        pow(e.f ? 'LE CULTE DÉMONIAQUE DOMINE' : 'LA SECTE ORTHODOXE DOMINE'); Snd.fx('domination'); msg(`Sect Domination : 7 disciples ${e.f ? 'démoniaques' : 'orthodoxes'} deviennent jokers.`);
        await sleep(600); await qiWilds(cells, e.cells);
      } else if (e.t === 'myst') {
        await mysteryReveal(cells, e);
      } else if (e.t === 'qiattack') {
        pow('QI ATTACK', 'gold'); Snd.fx('palm'); await qiWilds(cells, e.cells, 'Ton Qi transcendant frappe la grille : trois jokers.');
      }
    }
    sync(cells, ev.pre);
    const hitLbl = b.tier === 3 && b.tech === 'blood' ? s => `血 ×${s.lm}` : b.tier === 4 && b.mode === 'duel' ? s => `${s.k + 1} HIT ×${s.lm}` : null;
    await playSteps(cells, ev.steps, unit, { hitLbl, onWin: async s => {
      if (s.dmg) {
        cur.rival = Math.max(0, cur.rival - s.dmg); barsDuel(cur.hero, cur.rival); Snd.fx('hit', s.k);
        if (s.k === 0) floatText(`HIT −${s.dmg}`, 'hit');
        if (s.defeat) { pow('VAINCU !', 'gold'); Snd.fx('scroll'); msg('Le maître rival tombe à genoux et te tend son Technique Scroll : +2 spins, gains ×2.'); $('spinsLeft').textContent = +$('spinsLeft').textContent + 2; flashChip('chipSpins'); $('multN').textContent = '×2'; flashChip('chipMult'); SALLE.flag('parchemin'); await sleep(900); }
      }
      if (s.army) { barsWar(s.army); Snd.fx('palm'); }
      if (b.tier === 5) {
        cur.qi += s.wins.reduce((a, w) => a + w.size, 0);
        while (cur.rank < 5 && cur.qi >= T.qi[cur.rank]) { cur.qi -= T.qi[cur.rank]; cur.rank++; }
        barsRank(cur.rank, cur.qi);
        if (s.breakthrough) {
          setScene(s.breakthrough); Snd.fx('breakthrough'); pow(E.RANKS[s.breakthrough].toUpperCase(), s.breakthrough >= 5 ? 'brush' : 'gold'); shake();
          const [x, y] = FX.center($('gridwrap')); FX.burst('spark', x, y, 26, 8); FX.burst('petal', x, y, 16, 7);
          msg(s.breakthrough >= 5 ? 'HEAVENLY DEMON. Les petits symboles s\'effacent, et chaque cascade déclenche une attaque de Qi.' : `Percée ! Rang ${E.RANKS[s.breakthrough]}.${s.breakthrough === 1 ? ' Des cases mystère à chaque spin.' : s.breakthrough === 2 ? ' Plus de jokers.' : s.breakthrough === 3 ? ' Le multiplicateur grimpe à chaque spin gagnant.' : s.breakthrough === 4 ? ' Trois jokers de Qi à chaque spin.' : ''}`);
          $('tierInfo').textContent = `${PATH[b.path].name} · ${E.RANKS[s.breakthrough]}`;
          if (s.breakthrough >= 5) { SALLE.flag('heavenly-demon'); $('demonqi').classList.add('on'); }
          await sleep(900);
        }
      }
    } });
    if (ev.parry !== undefined) {
      barsDuel(ev.parry, cur.rival); Snd.fx('slash', .3); shake();
      pow(ev.parry > 0 ? 'RIPOSTE' : 'DÉFAITE'); msg(ev.parry > 0 ? `Aucun coup ne porte : le maître riposte. Il te reste ${ev.parry} PV.` : 'Tu tombes. Le duel est terminé.');
      await sleep(900);
    }
    if (ev.multUp) { $('multN').textContent = '×' + ev.multUp; flashChip('chipMult'); Snd.fx('qi'); toast(`Ton Qi monte : ×${ev.multUp}`); }
    if (ev.dom !== undefined) { toast(ev.dom === 'both' ? 'Les deux armées au centre : GREAT SECT WAR au prochain spin !' : ev.dom ? 'Le culte démoniaque atteint le centre !' : 'La secte orthodoxe atteint le centre !'); Snd.fx('domination'); }
    void defeated;
    total = Math.min(T.cap * b0, b.total * b0); upd(); if (ev.win > 0) flashChip('chipTotal');
    if (!ev.steps.length) { if (ev.parry === undefined) msg('Aucune grappe à ce spin'); await sleep(650); } else await sleep(480);
  }
  $('demonqi').classList.remove('on');
  return b.tier === 3 ? TECH[b.tech].name : b.tier === 4 ? (b.mode === 'duel' ? (b.scroll ? 'duel gagné, Technique Scroll obtenu' : b.hero <= 0 ? 'duel perdu' : 'le maître rival tient encore debout') : 'Sect War') : `${PATH[b.path].name}, rang atteint : ${E.RANKS[b.rank]}`;
}
async function runBonus(tier, bought, count) {
  const b0 = bet(); SALLE.bonus(tier, bought);
  await introBonus(tier, count, bought);
  document.body.classList.add('bonus'); Snd.setBonus(true); msg('');
  const b = E.newBonus(tier);
  $('bars').innerHTML = '';
  hud(tier, '', b.spinsLeft, 'MULTI', '×' + b.mult, 0);
  if (tier === 3) { setScene(1); await chooseTech(b); }
  if (tier === 4) { setScene(b.mode === 'duel' ? 2 : 3); await rivalArrives(b); }
  if (tier === 5) { setScene(0); await secretRealm(b); }
  const detail = await runSpins(b, b0);
  const win = b.total * b0, mult = b.total;
  await sleep(500);
  if (b.capped) toast('Gain maximum atteint !');
  if (winTier(mult)) await bigWin(win, mult);
  S.balance += win; setMoney(); $('lastWin').textContent = fmt(SALLE.gain(win, bet()));
  await overlay(`<h2>${fmt(win)}</h2><p>${TIER_NAME[tier]} terminé : ${detail}. ×${mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} la mise${bought ? ` (acheté ${E.BUY[tier].toLocaleString('fr-FR')}×)` : ''}.</p>`, 'Continuer');
  document.body.classList.remove('bonus', 'stg'); Snd.setBonus(false); $('bars').innerHTML = '';
  msg(`${TIER_NAME[tier]} : ${fmt(win)}`);

  showStatic(E.spinBase());
}

// ---------- achat du bonus ----------
function openBuy() {
  if (S.busy || S.auto) return;
  const off = t => {
    const price = E.BUY[t] * bet(), ok = !S.ante && S.balance >= price - 1e-9;
    const d = t === 3 ? '10 free spins : choisis ta technique interdite' : t === 4 ? '10 free spins : Duel contre un maître ou Sect War' : '12 free spins : Secret Realm et cultivation jusqu\'au Heavenly Demon';
    return `<button class="offer" data-t="${t}" ${ok ? '' : 'disabled'}>${ART.SCAT}<span><strong>${TIER_NAME[t]}</strong>${t} manuels interdits. ${d}<span class="price">${fmt(price)} lucioles (${E.BUY[t].toLocaleString('fr-FR')}× la mise)</span></span></button>`;
  };
  $('card').innerHTML = `<h2>Acheter un bonus</h2><p>${S.ante ? 'Désactive Chance bonus pour acheter.' : 'Le prix dépend de la mise en cours.'}</p><div class="offers">${off(3)}${off(4)}${off(5)}</div><button class="btn ghost" id="ovBtn">Annuler</button>`;
  $('overlay').classList.add('show');
  $('ovBtn').onclick = () => $('overlay').classList.remove('show');
  $('card').querySelectorAll('.offer').forEach(o => o.onclick = () => { $('overlay').classList.remove('show'); buy(+o.dataset.t); });
  $('ovBtn').focus();
}
async function buy(tier) {
  const price = E.BUY[tier] * bet();
  if (S.balance < price - 1e-9) return;
  S.busy = true; lockUI(true); Snd.start();
  S.balance -= price; setMoney(); msg(`${TIER_NAME[tier]} acheté`);
  const g = E.spinBase('normal');
  for (const col of g) for (let r = 0; r < ROWS; r++) if (col[r] === E.SCAT) col[r] = 0;
  const spots = []; for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) spots.push([c, r]);
  spots.sort(() => Math.random() - 0.5).slice(0, tier).forEach(([c, r]) => (g[c][r] = E.SCAT));
  const cells = await revealDrop(g);
  await presentScatters(cells, g);
  await runBonus(tier, true, tier);
  S.busy = false; lockUI(false);
}

(function depth() {
  if (reduce) return;
  const rig = $('rig'), sc = document.querySelector('.scene'); let tx = 0, ty = 0, cx = 0, cy = 0, lastIn = -1e9;
  addEventListener('pointermove', e => { tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; lastIn = performance.now(); }, { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma == null) return; tx = Math.max(-1, Math.min(1, e.gamma / 25)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); lastIn = performance.now(); });
  (function loop(now) {
    if (now - lastIn > 3000) { tx = Math.sin(now / 3200) * .45; ty = Math.sin(now / 4100) * .25; } // au repos, la machine respire
    cx += (tx - cx) * .05; cy += (ty - cy) * .05;
    rig.style.setProperty('--rx', (-cy * 4).toFixed(2) + 'deg'); rig.style.setProperty('--ry', (cx * 6).toFixed(2) + 'deg');
    sc.style.setProperty('--px', cx.toFixed(3)); sc.style.setProperty('--py', cy.toFixed(3));
    requestAnimationFrame(loop);
  })(performance.now());
})();
setMeridians(0); setScene(0);
setMoney(); showStatic(E.spinBase());
})();
