<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champi Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4A2F1D; --cream:#FFF1D6; --parch:#F1DDB6; --cell:#F9EBCF; --cellb:#E4CA9C;
  --wood1:#A86B3C; --wood2:#7A4722; --woodD:#3E2716; --amber:#E7A628; --rust:#C4562A; --moss:#7C8B3F; --hi:#FFD66B;
  --sky1:#FDE2B4; --sky2:#F5A868; --mtn:#E8B48A; --pine:#C98A5A; --far:#E0A066; --mid:#CE8446; --near:#A8672F; --ground:#7E4A24; --sun:#FFD27A; --water1:#9ED0D8; --water2:#6FA9B8; --floor1:#B9773A; --floor2:#8E5528;
  --display:"Chewy","Baloo 2","Comic Sans MS",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky1:#F4B98A; --sky2:#8C4A5E; --mtn:#A86A6A; --pine:#7A4A4A; --far:#9A5E5A; --mid:#7C4A3E; --near:#5E3A28; --ground:#48301E; --floor1:#8A5530; --floor2:#6A3E20; }}
:root[data-theme="dark"]{ --sky1:#F4B98A; --sky2:#8C4A5E; --mtn:#A86A6A; --pine:#7A4A4A; --far:#9A5E5A; --mid:#7C4A3E; --near:#5E3A28; --ground:#48301E; --floor1:#8A5530; --floor2:#6A3E20; }
body.bonus{ --sky1:#1E1A3E; --sky2:#4E3060; --mtn:#3A3358; --pine:#2E2848; --far:#342C4E; --mid:#2C2544; --near:#241E38; --ground:#1C1830; --sun:#F6EED0; --water1:#3B4E7A; --water2:#2A3558; --floor1:#3A2E48; --floor2:#2A2238; --cell:#3A3050; --cellb:#56487A; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; color:var(--ink); background:var(--sky2); font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif; font-weight:500; overflow-x:hidden}
button{font:inherit; color:inherit}
/* ---------- décor d'automne ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.scene svg.land{position:absolute; inset:0; width:100%; height:100%}
.scene path,.scene circle,.scene stop{transition:fill 1s, stop-color 1s}
.trees{transition:filter 1s}
body.bonus .trees{filter:brightness(.42) saturate(.7) hue-rotate(-10deg)}
.stars,.lamp{opacity:0; transition:opacity 1s}
body.bonus .stars,body.bonus .lamp{opacity:1}
.lamp{animation:flicker 2.4s ease-in-out infinite alternate}
@keyframes flicker{to{filter:brightness(1.25)}}
.sway{transform-box:fill-box; transform-origin:50% 100%; animation:sway 6s ease-in-out infinite alternate}
.sway.s2{animation-duration:7.5s}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.leaf{position:absolute; top:-40px; width:var(--s); height:var(--s); animation:fall var(--d) linear infinite; animation-delay:var(--del)}
.leaf svg{width:100%; height:100%; animation:spinleaf var(--r) ease-in-out infinite alternate}
@keyframes fall{0%{transform:translate(0,0)}25%{transform:translate(var(--x),25vh)}50%{transform:translate(0,50vh)}75%{transform:translate(var(--x),75vh)}100%{transform:translate(0,110vh)}}
@keyframes spinleaf{from{transform:rotate(-40deg) rotateY(0)}to{transform:rotate(220deg) rotateY(160deg)}}
.firefly{position:absolute; width:6px; height:6px; border-radius:50%; background:#FFE69A; box-shadow:0 0 12px 4px rgba(255,220,120,.8); opacity:0; animation:fly var(--d) ease-in-out infinite alternate; animation-delay:var(--del)}
body:not(.bonus) .firefly{display:none}
@keyframes fly{0%{transform:translate(0,0); opacity:.2}50%{opacity:1}100%{transform:translate(var(--x),var(--y)); opacity:.3}}
/* ---------- machine en bois ---------- */
main{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:12px 10px 20px}
main.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
.cabinet{position:relative; border-radius:32px; padding:12px 11px 14px; border:4px solid var(--woodD);
  background:repeating-linear-gradient(92deg, rgba(62,39,22,.10) 0 2px, transparent 2px 11px, rgba(255,230,190,.06) 11px 13px, transparent 13px 23px), linear-gradient(180deg,var(--wood1),var(--wood2));
  box-shadow:inset 0 0 0 4px #C98E55, inset 0 0 0 7px #5E3A1E, 0 10px 0 var(--woodD), 0 26px 50px rgba(50,25,10,.5)}
.bolt{position:absolute; width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FFE3A0,#B5791E 70%); border:2px solid var(--woodD)}
.marquee{position:relative; border-radius:22px; padding:10px 12px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:linear-gradient(180deg,#6B4121,#4E2E15); border:3px solid var(--woodD); box-shadow:inset 0 0 0 2px var(--amber), inset 0 3px 10px rgba(0,0,0,.4)}
.bulbs{position:absolute; inset:4px; pointer-events:none}
.bulb{position:absolute; width:8px; height:8px; border-radius:50%; background:#FFD98A; box-shadow:0 0 6px 2px rgba(255,190,90,.7); animation:blink 1.1s steps(2) infinite}
.bulb:nth-child(even){animation-delay:.55s}
@keyframes blink{50%{background:#8A5A2A; box-shadow:none}}
body.bonus .bulb{animation-duration:.45s}
.title{display:flex; align-items:center; gap:6px}
.title svg{width:34px; height:34px; flex:none}
h1{font-family:var(--display); font-weight:400; font-size:clamp(1.45rem, 7.4vw, 2.1rem); white-space:nowrap; line-height:1; margin:0; color:var(--cream); letter-spacing:.02em;
  text-shadow:0 2px 0 var(--woodD), 2px 0 0 var(--woodD), -2px 0 0 var(--woodD), 0 -2px 0 var(--woodD), 0 4px 0 #2A190C, 0 0 18px rgba(255,190,90,.55)}
.hbtns{display:flex; gap:6px}
.ico{width:36px; height:36px; border-radius:50%; border:2.5px solid var(--woodD); background:linear-gradient(#FCEBC8,#E8C991); display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 3px 0 var(--woodD)}
.ico svg{width:19px; height:19px}
.ico[aria-pressed="false"]{opacity:.45}
.ico:focus-visible,.btn:focus-visible,.spin:focus-visible,.pm:focus-visible{outline:3px dashed var(--hi); outline-offset:3px}
.screen{position:relative; margin-top:11px; border-radius:22px; padding:8px; border:4px solid var(--woodD);
  background:radial-gradient(ellipse at 50% 30%, #F8E7C4, var(--parch)); box-shadow:inset 0 0 0 2px var(--amber), inset 0 6px 16px rgba(90,55,20,.35); transition:background 1s}
body.bonus .screen{background:radial-gradient(ellipse at 50% 20%, #3A2E57, #1E1830)}
.hud{display:none; align-items:center; justify-content:space-between; gap:6px; padding:2px 2px 8px; flex-wrap:wrap; color:var(--cream)}
body.bonus .hud{display:flex}
.hud .tier{font-family:var(--display); font-size:1.25rem; width:100%; display:flex; justify-content:space-between; color:var(--hi); text-shadow:0 2px 0 #000}
.chip{background:rgba(255,241,214,.1); border:2px solid rgba(231,166,40,.6); border-radius:999px; padding:1px 10px; font-size:.82rem; display:flex; align-items:center; gap:5px}
.chip b{font-family:var(--display); font-weight:400; font-size:1.1rem; color:var(--cream)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--hi); transform:scale(1.2)}100%{transform:none}}
.dots{display:flex; gap:3px}
.dots i{width:12px; height:12px; border-radius:50%; border:1.5px solid var(--cream); opacity:.25}
.dots i.on{opacity:1; box-shadow:0 0 6px currentColor}
.gridwrap{max-height:56vh; overflow-y:auto; border-radius:14px; position:relative}
.grid{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; transition:filter .3s}
.grid.big{gap:2px}
.cell{aspect-ratio:1; background:radial-gradient(circle at 50% 40%, #FFF6E0, var(--cell)); border:2px solid var(--cellb); border-radius:13px; position:relative; display:grid; place-items:center; transition:opacity .3s, background .8s}
body.bonus .cell{background:radial-gradient(circle at 50% 40%, #463A62, var(--cell))}
.grid.big .cell{border-radius:6px; border-width:1px}
.cell svg{width:92%; height:92%; display:block; overflow:visible}
.cell.pending svg,.cell.pending .badge{visibility:hidden}
.cell.drop svg{animation:drop .46s cubic-bezier(.3,1.55,.55,1) both}
.grid.dimmed .cell:not(.win):not(.scatwin){opacity:.35}
.cell.win{border-color:var(--amber); box-shadow:0 0 0 2px var(--hi), 0 0 14px rgba(255,200,80,.9); z-index:1}
.cell.win svg{animation:squish .55s ease-in-out infinite alternate}
.cell.antic{animation:antic .5s ease-in-out infinite alternate}
@keyframes antic{from{box-shadow:0 0 0 2px var(--amber)}to{box-shadow:0 0 0 3px var(--hi), 0 0 18px var(--hi)}}
.cell.scat::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:3px solid var(--hi); animation:ring .7s ease-out forwards; pointer-events:none}
@keyframes ring{from{transform:scale(.4); opacity:1}to{transform:scale(1.5); opacity:0}}
.cell.scatwin{z-index:2; box-shadow:0 0 0 3px var(--hi), 0 0 24px 6px rgba(255,210,100,.9)}
.cell.scatwin svg{animation:scatpulse .6s ease-in-out infinite alternate}
@keyframes scatpulse{from{transform:scale(1)}to{transform:scale(1.2) rotate(-4deg)}}
.rays{transform-box:view-box; transform-origin:32px 32px; animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cell.fill{background:radial-gradient(circle, #FFE7A8, #F5C66A)}
body.bonus .cell.fill{background:radial-gradient(circle, #6B5A3A, #4C4030)}
.cell.powhit{box-shadow:0 0 0 3px var(--hi), 0 0 22px var(--hi); z-index:2}
.cell.powhit svg{animation:pulse .45s ease-in-out 3}
.cell.newrow{animation:grow .45s ease-out both; transform-origin:top}
.badge{position:absolute; right:-2px; bottom:-3px; background:var(--rust); color:var(--cream); border:1.5px solid var(--ink); font-weight:800; font-size:.66rem; border-radius:999px; padding:0 4px; line-height:1.35}
.grid.big .badge{font-size:.5rem; padding:0 2px; border-width:1px}
@keyframes drop{from{transform:translateY(-80%) scale(.9); opacity:0}to{transform:none; opacity:1}}
@keyframes squish{0%{transform:scale(1,1) translateY(0)}40%{transform:scale(1.08,.92) translateY(2px)}100%{transform:scale(.95,1.07) translateY(-4px)}}
@keyframes pulse{50%{transform:scale(1.22)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.float{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); font-family:var(--display); font-size:2rem; color:var(--hi); pointer-events:none; z-index:5; white-space:nowrap;
  text-shadow:0 3px 0 var(--woodD), 2px 0 0 var(--woodD), -2px 0 0 var(--woodD), 0 -2px 0 var(--woodD); animation:rise 1.2s ease-out forwards}
@keyframes rise{from{opacity:0; transform:translate(-50%,-20%) scale(.6)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.15)}to{opacity:0; transform:translate(-50%,-130%)}}
.msg{min-height:1.5em; text-align:center; font-weight:800; margin:9px 0 2px; color:var(--cream); text-shadow:0 2px 0 var(--woodD)}
/* ---------- tableau de commande ---------- */
.deck{margin-top:6px; display:flex; flex-direction:column; gap:9px}
.meters{display:grid; grid-template-columns:1fr auto 1fr; gap:6px}
.meter{border-radius:14px; padding:3px 10px; display:flex; flex-direction:column; justify-content:center; min-width:0;
  background:linear-gradient(#3F2614,#2E1B0D); border:2.5px solid var(--woodD); box-shadow:inset 0 0 0 1.5px rgba(231,166,40,.55)}
.meter small{font-size:.68rem; color:#D8B98A}
.meter b{font-family:var(--display); font-weight:400; font-size:clamp(.92rem, 4.3vw, 1.2rem); color:var(--hi); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.02em}
.meter.r{text-align:right}
.bet{display:flex; align-items:center; gap:4px; border-radius:14px; padding:3px; background:linear-gradient(#3F2614,#2E1B0D); border:2.5px solid var(--woodD); box-shadow:inset 0 0 0 1.5px rgba(231,166,40,.55)}
.bet .mid{display:flex; flex-direction:column; align-items:center; min-width:50px}
.bet small{font-size:.66rem; color:#D8B98A}
.bet b{font-family:var(--display); font-weight:400; font-size:1.15rem; color:var(--cream)}
.pm{width:30px; height:30px; border-radius:50%; border:2px solid var(--woodD); background:linear-gradient(#FCEBC8,#E2BF84); font-weight:800; cursor:pointer; padding:0; line-height:1; color:var(--ink)}
.row{display:flex; align-items:center; justify-content:space-between; gap:6px}
.btn{height:50px; min-width:52px; border-radius:15px; border:3px solid var(--woodD); background:linear-gradient(#FCEBC8,#E6C68E); color:var(--ink); font-weight:800; font-size:.68rem; cursor:pointer; padding:0 6px;
  box-shadow:0 4px 0 var(--woodD), inset 0 2px 0 rgba(255,255,255,.6); display:grid; place-items:center; line-height:1.05; text-align:center}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--woodD)}
.btn:disabled{opacity:.45; cursor:default}
.btn.on{background:linear-gradient(#FFE08A,#E7A628)}
.btn svg{width:22px; height:22px}
.btn.buy{background:linear-gradient(#E97A45,#B84A22); color:var(--cream); text-shadow:0 1px 0 var(--woodD)}
.spin{width:90px; height:90px; flex:none; border-radius:50%; border:4px solid var(--woodD); cursor:pointer; display:grid; place-items:center; padding:0; position:relative;
  background:radial-gradient(circle at 35% 28%, #FFD08A, #EE8A3A 45%, #B54A1E 90%); box-shadow:0 6px 0 var(--woodD), inset 0 -6px 12px rgba(80,20,0,.35), 0 0 0 5px rgba(231,166,40,.35)}
.spin svg{width:48px; height:48px; transition:transform .5s}
.spin.go svg{transform:rotate(360deg)}
.spin:active{transform:translateY(4px); box-shadow:0 2px 0 var(--woodD)}
.spin:disabled{opacity:.6; cursor:default}
.spin.stop{background:radial-gradient(circle at 35% 28%, #FFF2B0, #F2C03A 50%, #B98612 90%)}
body.bonus .deck .row button, body.bonus .bet .pm{visibility:hidden}
/* ---------- fenêtres ---------- */
.overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(30,15,5,.62); padding:18px; z-index:20}
.overlay.show{display:grid}
.card{background:radial-gradient(ellipse at 50% 0%, #FFF4DC, #F0D9AE); color:var(--ink); border:4px solid var(--woodD); border-radius:24px; padding:20px; max-width:390px; width:100%; text-align:center;
  box-shadow:inset 0 0 0 2px var(--amber), 0 8px 0 var(--woodD); max-height:88vh; overflow-y:auto}
.card h2{font-family:var(--display); font-weight:400; margin:0 0 6px; font-size:2rem; color:var(--rust); text-shadow:0 2px 0 rgba(74,47,29,.2)}
.card p{margin:6px 0 14px; line-height:1.5}
.card .btn{margin:4px auto 0; padding:0 22px}
.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 14px}
.offers{display:grid; gap:10px; margin:10px 0 14px}
.offer{display:flex; align-items:center; gap:12px; text-align:left; background:linear-gradient(#FFF8E8,#F6E2BA); border:3px solid var(--woodD); border-radius:18px; padding:10px 12px; cursor:pointer; box-shadow:0 4px 0 var(--woodD); color:var(--ink)}
.offer:disabled{opacity:.45; cursor:default}
.offer svg{width:54px; height:54px; flex:none; overflow:visible}
.offer span{display:flex; flex-direction:column; gap:1px; font-size:.84rem}
.offer strong{font-family:var(--display); font-weight:400; font-size:1.25rem; color:var(--rust)}
.offer .price{font-weight:800}
.rules{text-align:left}
.rules h2{text-align:center}
.rules h3{font-family:var(--display); font-weight:400; font-size:1.2rem; margin:14px 0 4px; color:var(--rust)}
.rules table{width:100%; border-collapse:collapse; font-size:.84rem; margin:6px 0 8px}
.rules td,.rules th{padding:3px 4px; text-align:center; border-bottom:1px solid #E2C799}
.rules td svg{width:34px; height:34px; vertical-align:middle}
.rules p,.rules li{font-size:.9rem; line-height:1.5}
.rules ul{padding-left:18px; margin:4px 0 8px}
/* entrée du bonus */
.intro{position:fixed; inset:0; z-index:18; display:none; overflow:hidden; background:radial-gradient(circle, rgba(64,28,8,.94), rgba(12,6,16,.98))}
.layer{position:fixed; inset:0; z-index:20; display:none; place-items:center; pointer-events:none; padding:16px}
.layer.show{display:grid}
.layer.click{pointer-events:auto; cursor:pointer}
.layer .btn{pointer-events:auto}
.intro.show{display:grid}
.bigrays{position:absolute; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,214,107,.22) 0deg 7deg, transparent 7deg 18deg); animation:spin 26s linear infinite;
  -webkit-mask:radial-gradient(circle, #000 0, transparent 55%); mask:radial-gradient(circle, #000 0, transparent 55%)}
.introbox{position:relative; text-align:center; padding:20px; max-width:420px}
.medals{display:flex; justify-content:center; gap:4px; margin-bottom:10px; flex-wrap:wrap}
.medals svg{width:74px; height:74px; overflow:visible; animation:medal .6s cubic-bezier(.3,1.6,.5,1) both}
.introbox.many .medals svg{width:58px; height:58px}
@keyframes medal{from{transform:translateY(-60vh) rotate(-200deg) scale(.4); opacity:0}to{transform:none; opacity:1}}
.ititle{font-family:var(--display); font-size:3.4rem; line-height:1; color:var(--hi); letter-spacing:.03em;
  text-shadow:0 4px 0 var(--rust), 0 8px 0 var(--woodD), 0 0 30px rgba(255,190,80,.8); animation:stamp .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stamp{from{transform:scale(2.6) rotate(-8deg); opacity:0}to{transform:rotate(-3deg); opacity:1}}
.isub{color:var(--cream); font-weight:700; margin:14px 0 18px; line-height:1.45; animation:fadein .5s both}
@keyframes fadein{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.introbox .btn{margin:0 auto; padding:0 26px; font-size:1rem; animation:fadein .5s both}
/* gros gains */
.bigwin{position:fixed; inset:0; z-index:16; display:none; overflow:hidden; background:radial-gradient(circle, rgba(110,55,10,.7), rgba(20,10,5,.92))}
.bigwin.show{display:grid}
.bigwin .bigrays{display:none}
.bigwin[data-tier="2"] .bigrays,.bigwin[data-tier="3"] .bigrays,.bigwin[data-tier="4"] .bigrays{display:block}
.bigwin[data-tier="4"] .bigrays{background:repeating-conic-gradient(from 0deg, rgba(255,120,90,.25) 0deg 6deg, rgba(255,214,107,.25) 6deg 12deg, rgba(140,200,90,.22) 12deg 18deg, rgba(160,110,220,.22) 18deg 24deg, transparent 24deg 34deg)}
.bw{position:relative; text-align:center; animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.bw .t{font-family:var(--display); font-size:3.2rem; line-height:1; color:var(--hi); text-shadow:0 4px 0 var(--rust), 0 8px 0 var(--woodD); animation:wobble 1s ease-in-out infinite alternate}
.bwLayer3 .bw .t{color:#FF9A5A; text-shadow:0 4px 0 #8A2A12, 0 8px 0 var(--woodD), 0 0 30px rgba(255,120,60,.8)}
.bwLayer4 .bw .t{background:linear-gradient(90deg,#FF7A59,#FFD66B,#9BD46A,#7FB6F0,#B98BF0); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 4px 0 var(--woodD))}
.bw .v{font-family:var(--display); font-size:2.8rem; color:var(--cream); margin-top:10px; text-shadow:0 3px 0 var(--woodD), 2px 0 0 var(--woodD), -2px 0 0 var(--woodD)}
.bw .x{color:#F3D9A8; margin-top:4px; font-weight:800}
.dance{display:flex; justify-content:center; gap:2px; margin-top:14px}
.dance svg{width:40px; height:40px; animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
@keyframes wobble{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.fly{position:fixed; z-index:17; pointer-events:none; transition:transform .65s cubic-bezier(.5,-0.3,.4,1.2), opacity .65s}
.fly svg{width:100%; height:100%}
#fx{position:fixed; inset:0; z-index:19; pointer-events:none}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 16px); transform:translateX(-50%); background:linear-gradient(#FFE08A,#E7A628); color:var(--ink); border:3px solid var(--woodD);
  border-radius:999px; padding:7px 18px; font-weight:800; z-index:21; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; box-shadow:0 4px 0 var(--woodD)}
.toast.show{opacity:1}
#moon{transition:fill 1.2s}
#moonGlow{transform-box:fill-box; transform-origin:center}
#moonGlow.pulse{animation:glowpulse 1.4s ease-in-out}
@keyframes glowpulse{50%{transform:scale(1.5)}}
.runner{position:fixed; left:-90px; z-index:17; width:70px; height:70px; pointer-events:none; animation:run 1.7s cubic-bezier(.4,.1,.6,.9) forwards}
.runner svg{width:100%; height:100%; animation:hopr .22s ease-in-out infinite alternate}
@keyframes run{to{transform:translateX(calc(100vw + 180px))}}
@keyframes hopr{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-12px) rotate(4deg)}}
.myc{position:absolute; left:0; top:0; pointer-events:none; z-index:4; overflow:visible}
.myc path{fill:none; stroke:#FFF6E0; stroke-linecap:round; filter:drop-shadow(0 0 3px rgba(255,240,200,.9)); stroke-dasharray:var(--l); stroke-dashoffset:var(--l); animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.myc.out{transition:opacity .5s; opacity:0}
.cell.popin svg{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.cell.popin .badge{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.cell.shimmer svg{animation:shim 1s ease-in-out}
@keyframes shim{50%{filter:brightness(1.6) drop-shadow(0 0 6px #fff)}}
/* ---------- le monde autour ---------- */
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:95s; animation-delay:-40s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
.day,.night{transition:opacity 1s}
.night{opacity:0}
body.bonus .night{opacity:1}
body.bonus .day{opacity:0}
.smoke circle{fill:#F3E6D6; opacity:0; transform-box:fill-box; transform-origin:center; animation:smoke 6s linear infinite}
.smoke circle:nth-child(2){animation-delay:-2s}.smoke circle:nth-child(3){animation-delay:-4s}
@keyframes smoke{0%{transform:translate(0,0) scale(.6); opacity:0}15%{opacity:.8}100%{transform:translate(40px,-150px) scale(2.4); opacity:0}}
.cabwin{transition:fill 1s} body.bonus .cabwin{fill:#FFD98A}
.duck{animation:duck 26s ease-in-out infinite}
.duckb{animation:duckflip 26s steps(1) infinite, bob 1.6s ease-in-out infinite alternate}
@keyframes duck{0%{transform:translateX(-110px)}45%{transform:translateX(110px)}50%{transform:translateX(110px)}95%{transform:translateX(-110px)}100%{transform:translateX(-110px)}}
@keyframes duckflip{0%{transform:scaleX(1)}48%{transform:scaleX(-1)}98%{transform:scaleX(1)}}
@keyframes bob{to{translate:0 3px}}
.deerhead{transform-box:fill-box; transform-origin:0% 100%; animation:graze 9s ease-in-out infinite}
@keyframes graze{0%,20%{transform:rotate(0)}30%,60%{transform:rotate(58deg)}70%,100%{transform:rotate(0)}}
.flock{position:fixed; top:14%; left:-20%; width:60px; height:40px; z-index:0; pointer-events:none; animation:flock 28s linear infinite}
.flock span{position:absolute; width:24px}
.flock span svg{width:100%; overflow:visible}
.flock .wing{transform-box:fill-box; transform-origin:center; animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.7)}}
@keyframes flock{0%{transform:translate(0,0)}45%{transform:translate(140vw,-8vh)}100%{transform:translate(140vw,-8vh)}}
.canopy{position:relative; height:74px; margin:0 -6px -16px; z-index:3; pointer-events:none}
.branch{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.critter{position:absolute; bottom:22px; width:54px}
.critter svg{width:100%; display:block; overflow:visible}
.sq{animation:sqMove 16s linear infinite}
.sq svg{animation:sqBody 16s linear infinite}
.sq .tail{transform-box:fill-box; transform-origin:90% 90%; animation:tailflick 1.2s ease-in-out infinite alternate}
@keyframes tailflick{to{transform:rotate(-8deg)}}
.robin{left:84%; bottom:26px; width:34px}
.robin svg{animation:peck 5s ease-in-out infinite; transform-origin:50% 100%}
@keyframes peck{0%,60%,100%{transform:rotate(0)}65%,72%{transform:rotate(12deg)}68%,76%{transform:rotate(0)}85%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.owl{left:76%; bottom:26px; width:46px}
.olids{transform-box:fill-box; transform-origin:center top; transform:scaleY(0); animation:blinkO 5s infinite}
@keyframes blinkO{0%,88%,100%{transform:scaleY(0)}92%,95%{transform:scaleY(1)}}
.owl svg{animation:tilt 7s ease-in-out infinite; transform-origin:50% 100%}
@keyframes tilt{0%,40%,100%{transform:rotate(0)}50%,60%{transform:rotate(-12deg)}70%,80%{transform:rotate(10deg)}}
.floor{position:relative; z-index:1; height:230px; margin-top:-40px; overflow:hidden}
.floor .ground{position:absolute; inset:0; width:100%; height:100%}
.floor .deco,.floor .animal{position:absolute}
.floor .deco svg,.floor .animal svg{width:100%; display:block; overflow:visible}
body.bonus .floor .deco, body.bonus .floor .animal{filter:brightness(.62) saturate(.8)}
body.bonus .floor #fLamp1, body.bonus .floor #fLamp2, body.bonus .floor #fHouse{filter:none}
.lglow{opacity:0; transition:opacity 1s} body.bonus .lglow{opacity:1}
.mushHouseWin{transition:fill 1s}
body.bonus #fHouse .win{fill:#FFD98A}
body:not(.bonus) #fHouse .win{fill:#F3E2C0}

.animal.hedge .body{animation:hhBody 34s linear infinite}
.animal .legs .l1{animation:leg .3s ease-in-out infinite alternate}
.animal .legs .l2{animation:leg .3s ease-in-out infinite alternate-reverse}
@keyframes leg{to{transform:translateX(2.5px)}}

.animal.rabbit .body{animation:rbBody 15s linear infinite}
.rabbit .ear1{transform-box:fill-box; transform-origin:50% 100%; animation:ear 4s ease-in-out infinite}
@keyframes ear{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-18deg)}90%{transform:rotate(6deg)}}

.fox .ftail{transform-box:fill-box; transform-origin:0% 90%; animation:wag 1.4s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.fox .fhead{transform-box:fill-box; transform-origin:50% 90%; animation:foxhead 8s ease-in-out infinite}
@keyframes foxhead{0%,50%,100%{transform:rotate(0)}58%,70%{transform:rotate(-10deg)}78%{transform:rotate(6deg)}}

.animal.snail .body{animation:snBody 70s linear infinite}
.credit{position:absolute; left:0; right:0; bottom:6px; margin:0; text-align:center; font-size:.72rem; color:#F3D9A8; opacity:.85}
/* ---------- nouvelle devanture : toit-champignon, enseigne en bois, tronc ---------- */
.cabinet{padding-top:0; border-radius:26px 26px 30px 30px;
  background:repeating-linear-gradient(90deg, rgba(40,22,10,.26) 0 3px, transparent 3px 14px, rgba(255,220,170,.08) 14px 16px, transparent 16px 27px, rgba(40,22,10,.18) 27px 29px, transparent 29px 41px), radial-gradient(ellipse at 30% 60%, rgba(255,210,150,.12), transparent 60%), linear-gradient(180deg,#9A6334,#7A4722 60%,#6A3C1C)}
.topper{position:relative; height:128px; margin:-44px clamp(-24px, -2.6vw, -8px) -2px; z-index:2}
.topper .cap{position:absolute; left:0; top:0; width:100%; height:150px; overflow:visible; filter:drop-shadow(0 6px 0 rgba(40,20,8,.35))}
.topper .fl{fill:#FFE7A0; animation:fl 1.2s steps(2) infinite}
@keyframes fl{50%{fill:#9A5A2A}}
body.bonus .topper .fl{animation-duration:.45s}
.hlamp .lglow{opacity:.35} body.bonus .hlamp .lglow{opacity:1}
.topper .hbtns{position:absolute; right:8%; top:38px; gap:5px}
.topper .ico{width:34px; height:34px; background:#FFF6E6; border:2.5px solid var(--woodD); border-radius:52% 48% 50% 46%; box-shadow:0 3px 0 rgba(62,39,22,.7)}
.topper .ico:nth-child(2){transform:translateY(-6px)}
.plank{position:absolute; left:50%; top:78px; transform:translateX(-50%) rotate(-1.5deg); padding:3px 18px 6px; border-radius:12px; border:3px solid var(--woodD);
  background:repeating-linear-gradient(0deg, rgba(90,50,20,.12) 0 2px, transparent 2px 9px), linear-gradient(#E3AE70,#C28549); box-shadow:0 5px 0 var(--woodD), inset 0 2px 0 rgba(255,240,210,.6)}
.plank::before,.plank::after{content:""; position:absolute; top:-18px; width:3px; height:18px; background:#6B4226}
.plank::before{left:18px}.plank::after{right:18px}
.logo{font-family:var(--display); font-weight:400; font-size:clamp(1.8rem, 8.6vw, 2.5rem); line-height:1.05; margin:0; white-space:nowrap; letter-spacing:.01em}
.logo span{display:inline-block; color:var(--c); transform:rotate(var(--r)) translateY(var(--y)); animation:wave 3.2s ease-in-out infinite; animation-delay:var(--d);
  text-shadow:0 3px 0 #3E2716, 2px 0 0 #3E2716, -2px 0 0 #3E2716, 0 -2px 0 #3E2716, 2px 2px 0 #3E2716, -2px 2px 0 #3E2716, 2px -2px 0 #3E2716, -2px -2px 0 #3E2716, 0 5px 0 rgba(40,20,8,.35)}
.logo .sp{width:.3em}
@keyframes wave{0%,100%{transform:rotate(var(--r)) translateY(var(--y))}50%{transform:rotate(var(--r)) translateY(calc(var(--y) - 4px))}}
.vine{position:absolute; left:-10px; top:120px; width:34px; height:60%; pointer-events:none; z-index:2}
.vine svg,.sprout svg{width:100%; height:100%; overflow:visible}
.sprout{position:absolute; bottom:-12px; width:64px; height:48px; pointer-events:none; z-index:2}
.sprout.l{left:-14px}.sprout.r{right:-12px; transform:scaleX(-1)}
.lvic{display:inline-grid; width:26px; height:26px; margin:-4px 0}
.lvic svg{width:100%; height:100%}
.canopy{margin-bottom:10px}
.runner2{position:fixed; left:0; z-index:17; width:64px; height:54px; pointer-events:none; transform:translateX(-90px)}
.runner2 svg{width:100%; height:100%; overflow:visible; animation:hopr .2s ease-in-out infinite alternate}
.runner2.still svg{animation:nod .5s ease-in-out 1}
@keyframes nod{50%{transform:translateY(2px) rotate(8deg)}}
.nutdrop{position:fixed; z-index:18; width:22px; height:22px; pointer-events:none}
.nutdrop svg{width:100%; height:100%}
.cell.soil{background:radial-gradient(circle at 50% 30%, #8A5A34, #5A3A20)!important; border-color:#A8703E; box-shadow:inset 0 3px 6px rgba(0,0,0,.35); transition:background 1s, box-shadow 1s}
.cell.soil::before{content:""; position:absolute; inset:18% 20%; background:radial-gradient(circle, rgba(255,240,200,.55) 0 2px, transparent 3px) 0 0/10px 10px; opacity:.7}
.cell.soil.settle{background:radial-gradient(circle at 50% 40%, #463A62, var(--cell))!important; box-shadow:none}
.cell.soil.settle::before{opacity:0; transition:opacity .8s}
.myc path{stroke:#FFF6E0}


body.bonus .floor #fSeat{filter:none}
.rock{transform-box:fill-box; transform-origin:50% 100%; animation:rockc 3.2s ease-in-out infinite alternate}
@keyframes rockc{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.steam path{fill:none; stroke:#FFF1D6; stroke-width:1.6; stroke-linecap:round; opacity:0; animation:steam 2s ease-out infinite}
@keyframes steam{0%{opacity:0; transform:translateY(4px)}40%{opacity:.8}100%{opacity:0; transform:translateY(-8px)}}
.zz{animation:zz 3s ease-in-out infinite}
@keyframes zz{0%{opacity:0; transform:translate(0,4px)}40%{opacity:1}100%{opacity:0; transform:translate(8px,-10px)}}

.animal.farmer .body{animation:fmBody 44s linear infinite}
.farmer .upper{transform-box:view-box; transform-origin:30px 60px; animation:fmUpper 44s linear infinite}
.farmer .bk1{animation:bk0 44s linear infinite}.farmer .bk2{animation:bk1 44s linear infinite}.farmer .bk3{animation:bk2 44s linear infinite}

.floor .pick svg{width:100%; display:block; transform-origin:50% 100%}
#pick0 svg{animation:pk0 44s linear infinite}#pick1 svg{animation:pk1 44s linear infinite}#pick2 svg{animation:pk2 44s linear infinite}
body.bonus .floor .pick{opacity:0}
/* disposition du sous-bois */
.animal.snail{animation:snMove 70s linear infinite}
.animal.hedge{bottom:18px; animation:hhMove 34s linear infinite}
.animal.rabbit{animation:rbMove 15s linear infinite}
.animal.farmer{width:var(--fw); animation:fmMove 44s linear infinite, fmFade 44s linear infinite}
body.bonus .animal.farmer{visibility:hidden}
.floor .pick{position:absolute; left:calc(var(--at) + var(--fw) * .95)}
.floor{--fw:56px; --hw:96px; --k:1}
#fHouse{left:calc(11% - var(--hw) / 2 + var(--fw) / 2); bottom:84px; width:var(--hw)}
#fSeat{left:calc(11% + var(--fw) / 2 + var(--hw) / 2 - 8px); bottom:80px; width:calc(72px * var(--k))}
#fBush1{left:27%; bottom:96px; width:calc(100px * var(--k))}
#fLamp1{left:24%; bottom:84px; width:calc(28px * var(--k))}
#fBush2{left:79%; bottom:84px; width:calc(110px * var(--k))}
#fLamp2{left:73%; bottom:76px; width:calc(28px * var(--k))}
#fLog{left:44%; bottom:38px; width:calc(150px * var(--k))}
#fPump1{left:34%; bottom:12px; width:calc(44px * var(--k))}
#fPump2{left:92%; bottom:16px; width:calc(40px * var(--k))}
.animal.fox{left:62%; bottom:6px; width:calc(76px * var(--k))}
.animal.snail{bottom:calc(38px + 38px * var(--k)); width:calc(36px * var(--k))}
.animal.hedge{width:calc(62px * var(--k))}
.animal.rabbit{width:calc(44px * var(--k)); bottom:calc(72px * var(--k))}
.animal.farmer{bottom:calc(74px * var(--k))}
.floor .pick{bottom:calc(72px * var(--k)); width:calc(20px * var(--k))}
@media (min-width:900px){ .floor{height:300px; --fw:80px; --hw:136px; --k:1.4} #fHouse{bottom:112px} #fBush1{bottom:130px} #fBush2{bottom:112px} #fLamp1{bottom:112px} #fLamp2{bottom:100px} #fSeat{bottom:108px} #fLog{bottom:52px} }
.fmb .fmbMove{animation:fmbMove 44s linear infinite, fmFade 44s linear infinite}
.fmb .fmbBody{transform-box:fill-box; transform-origin:50% 100%; animation:fmbBody 44s linear infinite}
.fmb .legs .l1{animation:leg .3s ease-in-out infinite alternate}
.fmb .legs .l2{animation:leg .3s ease-in-out infinite alternate-reverse}
.fmpicks svg{transform-box:fill-box; transform-origin:50% 100%}
#bgPick0{animation:pk0 44s linear infinite}#bgPick1{animation:pk1 44s linear infinite}#bgPick2{animation:pk2 44s linear infinite}
body.bonus .fmb, body.bonus .fmpicks{visibility:hidden}
#fBush1{left:3%!important} #fLamp1{left:21%!important}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} .leaf,.firefly,.runner,.flock{display:none} .myc path{stroke-dashoffset:0} .olids{transform:scaleY(0)} .sq{left:40%} .animal.farmer{left:40%; opacity:1} .animal.hedge{left:12%} .animal.rabbit{left:72%} .animal.snail{left:30%} }

const Snd = (() => {

    [32, 79, 4], [36, 78, 2], [38, 76, 2], [40, 74, 3], [43, 73, 1], [44, 74, 4], [48, 76, 2], [50, 79, 2], [52, 78, 2], [54, 76, 2], [56, 74, 4], [60, 71, 2], [62, 72, 2]];

  const bmelAt = new Map(BMEL.map(x => [x[0], x]));

    const f = 2200 + Math.random() * 900;

  }

    click() { const t = now(); woodblockSfx(t, .35, 1100); },
    reelStart() { if (ratchet) return; ratchet = setInterval(() => { const t = now(); noiseHit(sfxBus, t, .018, 'bandpass', 3200, 6, .22, .001); tone(sfxBus, 1500, t, .02, 'square', .025); }, 55); },

    tick(p) { const t = now(); noiseHit(sfxBus, t, .02, 'bandpass', 2600 + p * 1500, 8, .18, .001); if (Math.random() < .35) coin(t, .08, Math.random() - .5); },

    // pouvoirs
    grow() { const t = now(); const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = 70; f.type = 'bandpass'; f.Q.value = 6; f.frequency.setValueAtTime(260, t);
      for (let k = 0; k < 8; k++) f.frequency.linearRampToValueAtTime(260 + Math.random() * 700, t + .1 + k * .1); env(g, t, .05, .5, 1); o.connect(f).connect(g).connect(sfxBus); o.start(t); o.stop(t + 1.05);

    heal() { const t = now(); for (let k = 0; k < 7; k++) tone(sfxBus, 3200 + Math.random() * 700, t + k * .065, .05, 'sine', .22, 2300, .003, -.6 + k * .2); S.plop(3); setTimeout(() => ctx && woodblockSfx(now(), .35, 700), 700); },

// Champi Pop, moteur mathématique (partagé par le jeu et la simulation)
const ENGINE = (() => {
  const COLS = 6, ROWS = 6;
  const SYMS = [
    { id: 'l1', w: 158, pay: [0.01, 0.02, 0.04, 0.08] },
    { id: 'l2', w: 150, pay: [0.015, 0.03, 0.06, 0.12] },
    { id: 'l3', w: 142, pay: [0.02, 0.04, 0.09, 0.18] },
    { id: 'l4', w: 134, pay: [0.03, 0.06, 0.13, 0.26] },
    { id: 'h1', w: 118, pay: [0.05, 0.1, 0.25, 0.5] },
    { id: 'h2', w: 110, pay: [0.08, 0.16, 0.4, 0.8] },
    { id: 'h3', w: 98, pay: [0.12, 0.25, 0.6, 1.25] },
    { id: 'h4', w: 80.5, pay: [0.2, 0.5, 1.25, 3.0] },
  ];
  const SYM_W = SYMS.reduce((a, s) => a + s.w, 0);
  let SCAT_W = { normal: 8.062047564942155, ante: 9.532161678272292 }; // poids du scatter (calibrés : RTP 98,5 % dans les deux modes)
  let BASE_SCALE = { normal: 0.7662866778138974, ante: 0.7662866778138974 }; // même table de gains dans les deux modes
  let BONUS_K = { 3: 0.0007504177630579174, 4: 1.2142855810624573e-7, 5: 1.389681550077179e-9 }; // bonus moyens 98,5 / 394 / 1 970 x mise (98,5 % des prix d'achat)
  const TIER = {
    3: { size: 6,  spins: 8,  gifts: 0, dens: 0.45, powScale: 0.7,    stackScale: 0.25,   cap: 10000 },
    4: { size: 10, spins: 10, gifts: 1, dens: 0.40, powScale: 0.2, stackScale: 0.05, cap: 25000 },
    5: { size: 12, spins: 12, gifts: 3, dens: 0.38, powScale: 0.12, stackScale: 0.03, cap: 50000 },
  };
  const BUY = { 3: 100, 4: 400, 5: 2000 }; // RTP des achats : 98,5 %
  const ANTE = 1.25;
  const POW_P = { grow: 0.005, color: 0.008, heal: 0.0035, stack: 0.0012, ring: 0.002 };
  const GIFT_TYPES = ['grow', 'color', 'heal', 'ring'];
  const LV_VALUE = [1, 1.5, 2.25, 3.4, 5, 7.5, 11, 17]; // énoki, Paris, shimeji, girolle, pleurote, morille, bolet, amanite
  const LEN_F = [0, 0, 0, 1, 1.5, 2.5, 4, 6, 9, 14, 20, 30, 45];
  const rand = () => Math.random();

  // ---------- jeu de base ----------
  function spinBase(mode = 'normal') {
    const tot = SYM_W + SCAT_W[mode], g = [];
    for (let c = 0; c < COLS; c++) { g.push([]); for (let r = 0; r < ROWS; r++) {
      let x = rand() * tot, s = -1;
      for (let i = 0; i < SYMS.length; i++) { if ((x -= SYMS[i].w) < 0) { s = i; break; } }
      g[c].push(s);
    } }
    return g;
  }
  function evalBase(g, mode = 'normal') {
    const wins = []; let total = 0;
    for (let s = 0; s < SYMS.length; s++) {
      let ways = 1, len = 0;
      for (let c = 0; c < COLS; c++) { const n = g[c].filter(x => x === s).length; if (!n) break; ways *= n; len++; }
      if (len >= 3) { const amt = SYMS[s].pay[len - 3] * ways * BASE_SCALE[mode]; total += amt; wins.push({ s, len, ways, amt }); }
    }
    let scats = 0; for (const col of g) for (const x of col) if (x === -1) scats++;
    return { wins, total, scats };
  }
  function analyticBase(mode = 'normal', scale = 1) {
    const tot = SYM_W + SCAT_W[mode]; let e = 0;
    for (const s of SYMS) { const p = s.w / tot;
      for (let L = 3; L <= 6; L++) e += s.pay[L - 3] * Math.pow(6 * p, L) * (L < 6 ? Math.pow(1 - p, 6) : 1); }
    return e * scale;
  }
  function scatProbs(mode = 'normal', w) {
    const sw = w ?? SCAT_W[mode], p = sw / (SYM_W + sw), n = 36;
    const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
    const pk = []; for (let k = 0; k <= n; k++) pk.push(C(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k));
    let p5 = 0; for (let k = 5; k <= n; k++) p5 += pk[k];
    return { 3: pk[3], 4: pk[4], 5: p5 };
  }

  // rond de sorcière : cases à distance R (arrondie) de la case du pouvoir, rangées dans l'ordre du cercle
  function ringCells(r0, c0, R, W, rad) {
    const out = [];
    for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
      const d2 = dr * dr + dc * dc;
      if (d2 < (rad - .5) ** 2 || d2 > (rad + .5) ** 2) continue;
      const r = r0 + dr, c = c0 + dc;
      if (r >= 0 && r < R && c >= 0 && c < W) out.push([r, c, Math.atan2(dr, dc)]);
    }
    return out.sort((a, b) => a[2] - b[2]);
  }
  // ---------- bonus : tours gratuits, seul le champignon étoile peut tomber ----------
  function newBonus(tier) {
    const T = TIER[tier];

// mycélium : les racines descendent sous la grille et font pousser une nouvelle ligne de terre
async function animGrow(cell, cells) {
  const wrap = $('gridwrap'), grid = $('grid');
  const W = cells[0].length;
  const wr = wrap.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const gap = parseFloat(getComputedStyle(grid).rowGap) || 4;
  const rowH = cr.height + gap, GW = grid.scrollWidth, H = grid.scrollHeight;
  const x0 = cr.left - wr.left + cr.width / 2, y0 = cr.top - wr.top + wrap.scrollTop + cr.height / 2;
  const endY = H + rowH * .55;
  let paths = '', hairs = '';
  const n = Math.min(W, 7);
  for (let k = 0; k < n; k++) {
    let x = x0, y = y0, d = `M${x.toFixed(0)} ${y.toFixed(0)}`, len = 0;
    const tx = (k + .5) / n * GW;
    while (y < endY) {
      const nx = x + (tx - x) * .4 + (Math.random() - .5) * 14, ny = Math.min(endY, y + 18 + Math.random() * 14);
      len += Math.hypot(nx - x, ny - y);
      if (Math.random() < .5) hairs += `<path d="M${x.toFixed(0)} ${y.toFixed(0)} l${((Math.random() - .5) * 16).toFixed(0)} ${(6 + Math.random() * 8).toFixed(0)}" style="--l:24; animation-delay:${(k * 70 + len * 1.6).toFixed(0)}ms" stroke-width="1"/>`;
      x = nx; y = ny; d += ` L${x.toFixed(0)} ${y.toFixed(0)}`;
    }
    paths += `<path d="${d}" style="--l:${len.toFixed(0)}; animation-delay:${k * 70}ms" stroke-width="${(2.2 + Math.random() * 1.4).toFixed(1)}"/>`;
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'myc'); svg.setAttribute('width', GW); svg.setAttribute('height', endY + 10); svg.innerHTML = paths + hairs;
  wrap.appendChild(svg);
  wrap.scrollTo({ top: wrap.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
  await sleep(750);
  // la nouvelle ligne sort de terre là où les racines arrivent
  const row = [];
  for (let c = 0; c < W; c++) { const d = document.createElement('div'); d.className = 'cell newrow soil'; d.style.animationDelay = (c * 45) + 'ms'; grid.appendChild(d); row.push(d); }
  cells.push(row);
  Snd.fx('stop', 0);
  wrap.scrollTo({ top: wrap.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
  await sleep(320);
  for (const d of row) { const [x, y] = FX.center(d); FX.burst('spore', x, y, 3, 2.5); FX.burst('spark', x, y, 2, 3); }
  await sleep(900);
  svg.classList.add('out'); setTimeout(() => svg.remove(), 600);
  for (const d of row) d.classList.add('settle');
  await sleep(400);
}

async function buy(tier) {

  S.balance -= price; setMoney(); msg(`${TIER_NAME[tier]} acheté`);
  const g = E.spinBase('normal');
  for (const col of g) for (let r = 0; r < 6; r++) if (col[r] === -1) col[r] = 0;

  <li>Rond de sorcière : sur ce spin, un cercle de champignons pousse autour de la case (12 cases en 6×6, 16 en grande grille) ; une case déjà occupée gagne un exemplaire.</li>
  </ul>
  <p>Les pouvoirs offerts sont tirés parmi mycélium, lune rousse, écureuil et rond de sorcière. Le nuage de spores est plus rare en grande grille.</p>
  <h3>Options</h3>
  <p>Acheter le bonus coûte ${E.BUY[3]} fois la mise, le super bonus ${E.BUY[4]} fois et le méga bonus ${E.BUY[5].toLocaleString('fr-FR')} fois. Chance bonus ajoute 25 % à la mise et fait passer le bonus d'un spin sur ${every(pn[3] + pn[4] + pn[5])} à un sur ${every(pa[3] + pa[4] + pa[5])} ; l'achat est alors indisponible. Turbo accélère les animations. Espace lance un spin.</p>
  <p>RTP : 98,5 % en jeu normal, avec Chance bonus et pour chaque achat. Gain maximum : ${E.TIER[3].cap.toLocaleString('fr-FR')}, ${E.TIER[4].cap.toLocaleString('fr-FR')} et ${E.TIER[5].cap.toLocaleString('fr-FR')} fois la mise selon le bonus. Lucioles : monnaie fictive, aucun argent réel.</p></div>
  <button class="btn" id="ovBtn">Fermer</button>`;
  $('overlay').classList.add('show'); $('ovBtn').onclick = () => $('overlay').classList.remove('show'); $('ovBtn').focus();
}

// ---------- commandes ----------
$('spin').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else spin(); };
$('autoBtn').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else if (!S.busy) chooseAuto(); };
$('buyBtn').onclick = openBuy;
$('anteBtn').onclick = () => { if (S.busy || S.auto) return; S.ante = !S.ante; $('anteBtn').classList.toggle('on', S.ante); $('anteBtn').setAttribute('aria-pressed', S.ante); setMoney(); msg(S.ante ? `Chance bonus : mise de ${fmt(cost())}, bonus plus fréquent.` : 'Chance bonus désactivée.'); };
$('turboBtn').onclick = () => { S.turbo = !S.turbo; $('turboBtn').classList.toggle('on', S.turbo); $('turboBtn').setAttribute('aria-pressed', S.turbo); };
$('musicBtn').onclick = () => { Snd.start(); const on = Snd.toggleMusic(); $('musicBtn').setAttribute('aria-pressed', on); $('musicBtn').setAttribute('aria-label', on ? 'Couper la musique' : 'Mettre la musique'); };
$('sfxBtn').onclick = () => { const on = Snd.toggleSfx(); $('sfxBtn').setAttribute('aria-pressed', on); $('sfxBtn').setAttribute('aria-label', on ? 'Couper les effets sonores' : 'Mettre les effets sonores'); };
$('infoBtn').onclick = () => { if (!$('overlay').classList.contains('show')) showRules(); };
$('betDown').onclick = () => { if (!S.busy && !S.auto && S.betIdx > 0) { S.betIdx--; setMoney(); } };
$('betUp').onclick = () => { if (!S.busy && !S.auto && S.betIdx < BETS.length - 1) { S.betIdx++; setMoney(); } };
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || $('overlay').classList.contains('show') || $('bwLayer').classList.contains('show') || $('intro').classList.contains('show')) return;
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  e.preventDefault(); if (!S.auto) spin();
});
setMoney(); showStatic(E.spinBase());
})();
</script></body></html>
