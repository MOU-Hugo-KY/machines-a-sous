<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A0F14; --paper:#FFF1DC; --night:#140A12; --night2:#2A1220; --blood:#E0331E; --ember:#FF7A1F; --sun:#FFB23D; --hazard:#FFC21A;
  --toxic:#7CFF4F; --toxic2:#3FBF2A; --cop:#3AA0FF; --steel:#4A3F4E; --steel2:#2E2632; --rust:#9A4A22; --hi:#FFE27A;
  --cell:#2A2030; --cellb:#4E3C52;
  --display:"Bangers","Baloo 2","Impact",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body.bonus{ --cell:#1E2A1C; --cellb:#3E5A34; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0; min-height:100%; color:var(--paper); background:var(--night); font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif; font-weight:500; overflow-x:hidden}
button{font:inherit; color:inherit}
/* ---------- la ville en fond (version 2D) ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.scene svg{position:absolute; inset:0; width:100%; height:100%}
.beam{transform-box:fill-box; transform-origin:50% 100%; animation:beam 7s ease-in-out infinite alternate}
.beam.b2{animation-duration:9s; animation-delay:-3s}
@keyframes beam{from{transform:rotate(-28deg)}to{transform:rotate(26deg)}}
.smoke{animation:smk 14s linear infinite} .smoke.s2{animation-duration:19s; animation-delay:-7s}
@keyframes smk{from{transform:translate(-80px,0)}to{transform:translate(120px,-60px)}}
.winflick{animation:wf 3s steps(2) infinite} .winflick.w2{animation-duration:4.4s} .winflick.w3{animation-duration:2.2s}
@keyframes wf{50%{opacity:.25}}
.fire{animation:firef .25s steps(2) infinite alternate; transform-box:fill-box; transform-origin:50% 100%}
@keyframes firef{to{transform:scaleY(1.15) scaleX(.92)}}
/* ---------- la machine ---------- */
main{position:relative; z-index:1; max-width:480px; margin:0 auto; padding:6px 10px 20px}
main.shake{animation:shake .5s}
main.quake{animation:quake 1.1s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
@keyframes quake{10%,30%,50%,70%,90%{transform:translate(-7px,3px) rotate(-.4deg)}20%,40%,60%,80%{transform:translate(7px,-3px) rotate(.4deg)}}
.topper{position:relative; height:132px; margin:0 -2px -18px; z-index:2}
.topper svg.sign{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.lamp{animation:lamp .9s steps(2) infinite} .lamp.l2{animation-delay:.45s}
@keyframes lamp{50%{opacity:.15}}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1} 20%,63%{opacity:.35}}
.logo{position:absolute; left:0; right:0; top:26px; text-align:center; margin:0; pointer-events:none}
.logo b{display:block; font-family:var(--display); font-weight:400; font-size:clamp(2.6rem, 13vw, 3.6rem); line-height:.9; letter-spacing:.04em; color:#FFE9D6;
  text-shadow:0 0 6px #FF5A1F, 0 0 18px #FF3A1F, 3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); transform:rotate(-3deg)}
.logo b span{display:inline-block; animation:neon 5s infinite}
.logo b span:nth-child(3){animation-delay:-2.1s} .logo b span:nth-child(7){animation-delay:-3.7s}
.logo i{display:inline-block; margin-top:4px; font-family:var(--display); font-style:normal; font-size:clamp(1rem, 5vw, 1.3rem); letter-spacing:.2em; color:var(--ink);
  background:repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #1A0F14 12px 22px); padding:1px 12px; border:2px solid var(--ink); transform:rotate(2deg); position:relative; left:-48px}
.logo i em{font-style:normal; background:var(--hazard); padding:0 6px}
.hbtns{position:absolute; right:0; bottom:22px; display:flex; gap:5px; z-index:3}
.ico{width:31px; height:31px; border-radius:50%; border:2.5px solid var(--ink); background:radial-gradient(circle at 35% 30%, #FFF6E6, #D8C7B4); display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 3px 0 var(--ink)}
.ico svg{width:17px; height:17px}
.ico[aria-pressed="false"]{opacity:.45}
.ico:focus-visible,.btn:focus-visible,.spin:focus-visible,.pm:focus-visible,.door:focus-visible{outline:3px dashed var(--hi); outline-offset:3px}
.cabinet{position:relative; border-radius:22px; padding:12px 10px 14px; border:4px solid var(--ink);
  background:radial-gradient(circle at 12% 18%, rgba(154,74,34,.55) 0 18px, transparent 40px), radial-gradient(circle at 88% 72%, rgba(154,74,34,.45) 0 14px, transparent 34px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 7px), linear-gradient(180deg, var(--steel), var(--steel2));
  box-shadow:inset 0 0 0 3px #6A5A6E, inset 0 0 0 6px var(--ink), 0 10px 0 var(--ink), 0 26px 60px rgba(0,0,0,.7), 0 0 50px rgba(255,90,31,.25)}
.tape{position:absolute; left:-8px; right:-8px; height:16px; background:repeating-linear-gradient(-45deg, var(--hazard) 0 14px, var(--ink) 14px 26px); border:2px solid var(--ink); transform:rotate(-1.2deg); z-index:3}
.tape.t1{top:-10px} .tape.t2{bottom:-8px; transform:rotate(1deg)}
.bolt{position:absolute; width:11px; height:11px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #D8C7B4, #5A4A5E 70%); border:2px solid var(--ink)}
/* jauge d'invasion */
.gauge{display:flex; align-items:center; gap:8px; margin:4px 2px 8px}
.gauge svg{width:26px; height:26px; flex:none}
.gbar{position:relative; flex:1; height:20px; border-radius:10px; background:#1A1016; border:2.5px solid var(--ink); overflow:hidden; box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.gfill{position:absolute; inset:0 auto 0 0; width:0%; background:repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 8px, transparent 8px 16px), linear-gradient(90deg, #3FBF2A, #7CFF4F 60%, #D8FF4F); transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.gauge.hot .gfill{animation:hot .6s ease-in-out infinite alternate}
@keyframes hot{to{filter:brightness(1.5) drop-shadow(0 0 6px #7CFF4F)}}
.gtxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:.95rem; letter-spacing:.08em; color:#fff; text-shadow:0 1px 0 #000, 0 0 4px #000}
.gauge.inv .gbar{border-color:var(--blood)} .gauge.inv .gfill{background:repeating-linear-gradient(-45deg, rgba(0,0,0,.25) 0 8px, transparent 8px 16px), linear-gradient(90deg, #8A1010, #E0331E)}
.screen{position:relative; border-radius:16px; padding:7px; border:4px solid var(--ink); background:radial-gradient(ellipse at 50% 20%, #3A2A38, #1A1018); box-shadow:inset 0 0 0 2px var(--rust), inset 0 8px 20px rgba(0,0,0,.55)}
body.inv .screen{box-shadow:inset 0 0 0 2px var(--blood), inset 0 0 30px rgba(224,51,30,.6)}
.hud{display:none; align-items:center; justify-content:space-between; gap:6px; padding:2px 2px 7px; flex-wrap:wrap}
body.bonus .hud{display:flex}
.hud .tier{font-family:var(--display); font-size:1.22rem; letter-spacing:.05em; width:100%; display:flex; justify-content:space-between; gap:8px; white-space:nowrap; color:var(--toxic); text-shadow:2px 2px 0 #000}
.chip{background:rgba(255,241,220,.07); border:2px solid rgba(255,194,26,.6); border-radius:999px; padding:1px 10px; font-size:.82rem; display:flex; align-items:center; gap:5px}
.chip b{font-family:var(--display); font-weight:400; font-size:1.15rem; letter-spacing:.04em; color:var(--paper)}
.chip.flash{animation:flash .7s ease-out}
@keyframes flash{0%{background:var(--hazard); transform:scale(1.2)}100%{transform:none}}
.floors{display:none; width:100%; align-items:center; gap:4px}
body.ext .floors{display:flex}
.floors .fl{flex:1; height:14px; border-radius:4px; background:#2A2030; border:2px solid var(--ink)}
.floors .fl.on{background:linear-gradient(#FFD66B,#FF7A1F); box-shadow:0 0 8px #FFB23D}
.floors svg{width:34px; height:24px; flex:none}
.floors .heli.go{animation:heli .35s linear infinite}
@keyframes heli{50%{transform:translateY(-2px)}}
.gridwrap{border-radius:10px; position:relative}
.grid{display:grid; grid-template-columns:repeat(5,1fr); gap:5px}
.cell{aspect-ratio:1; background:radial-gradient(circle at 50% 40%, #3E3044, var(--cell)); border:2px solid var(--cellb); border-radius:11px; position:relative; display:grid; place-items:center; transition:opacity .3s}
.cell svg{width:92%; height:92%; display:block; overflow:visible}
.cell.pending svg{visibility:hidden}
.cell.drop svg{animation:drop .42s cubic-bezier(.3,1.55,.55,1) both}
.cell.popin svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.grid.dimmed .cell:not(.win):not(.scatwin){opacity:.35}
.cell.win{border-color:var(--toxic); box-shadow:0 0 0 2px var(--toxic), 0 0 14px rgba(124,255,79,.8); z-index:1}
.cell.win svg{animation:squish .5s ease-in-out infinite alternate}
.cell.boom svg{animation:boom .35s ease-in forwards}
@keyframes boom{40%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(0) rotate(-20deg); opacity:0}}
.cell.antic{animation:antic .4s ease-in-out infinite alternate}
@keyframes antic{from{box-shadow:0 0 0 2px var(--blood)}to{box-shadow:0 0 0 3px #FF6A4F, 0 0 18px var(--blood)}}
.cell.scat::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:3px solid var(--blood); animation:ring .7s ease-out forwards; pointer-events:none}
@keyframes ring{from{transform:scale(.4); opacity:1}to{transform:scale(1.5); opacity:0}}
.cell.scatwin{z-index:2; box-shadow:0 0 0 3px var(--blood), 0 0 24px 6px rgba(224,51,30,.9)}
.cell.scatwin svg{animation:scatpulse .5s ease-in-out infinite alternate}
@keyframes scatpulse{from{transform:scale(1)}to{transform:scale(1.18) rotate(-5deg)}}
.cell.sticky{border-color:var(--toxic2); background:radial-gradient(circle at 50% 40%, #2E5A24, #16301A)}
.cell.infected::before{content:""; position:absolute; inset:0; border-radius:9px; background:radial-gradient(circle at 30% 30%, rgba(124,255,79,.55), rgba(63,191,42,.25)); box-shadow:inset 0 0 0 2px var(--toxic); z-index:1; pointer-events:none; animation:inf .8s ease-in-out infinite alternate}
@keyframes inf{to{opacity:.5}}
.cell.zero{box-shadow:0 0 0 3px #B6FF3A, 0 0 26px 6px rgba(124,255,79,.9); z-index:2}
.cell.bite svg{animation:bite .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes bite{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:none}}
.cell.powhit{box-shadow:0 0 0 3px var(--hazard), 0 0 22px var(--hazard); z-index:2}
.cell.powhit svg{animation:pulse .45s ease-in-out 3}
@keyframes drop{from{transform:translateY(-90%) scale(.9); opacity:0}to{transform:none; opacity:1}}
@keyframes squish{0%{transform:scale(1,1)}40%{transform:scale(1.08,.92) translateY(2px)}100%{transform:scale(.95,1.07) translateY(-3px)}}
@keyframes pulse{50%{transform:scale(1.22)}}
@keyframes pop{from{transform:scale(.3)}to{transform:none}}
.pow{position:absolute; left:50%; top:45%; transform:translate(-50%,-50%) rotate(-8deg); z-index:6; pointer-events:none; font-family:var(--display); font-size:2.6rem; letter-spacing:.05em; color:var(--ink);
  background:var(--hazard); padding:4px 16px; clip-path:polygon(0 20%,10% 0,22% 18%,38% 2%,50% 16%,64% 0,76% 16%,90% 2%,100% 22%,92% 44%,100% 64%,90% 82%,100% 100%,74% 88%,58% 100%,44% 86%,28% 100%,16% 84%,0 96%,8% 62%,0 42%); animation:powin 1.1s ease-out forwards}
@keyframes powin{0%{transform:translate(-50%,-50%) scale(.2) rotate(-30deg)}15%{transform:translate(-50%,-50%) scale(1.2) rotate(-8deg)}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg); opacity:0}}
.float{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); font-family:var(--display); font-size:2.1rem; letter-spacing:.04em; color:var(--toxic); pointer-events:none; z-index:5; white-space:nowrap;
  text-shadow:3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); animation:rise 1.2s ease-out forwards}
@keyframes rise{from{opacity:0; transform:translate(-50%,-20%) scale(.6)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.15)}to{opacity:0; transform:translate(-50%,-130%)}}
.horde{position:absolute; inset:0; z-index:6; pointer-events:none; overflow:hidden}
.horde span{position:absolute; width:26%; animation:run 1.6s linear forwards}
.horde span svg{width:100%; display:block; animation:lurch .3s ease-in-out infinite alternate}
@keyframes run{from{transform:translateX(-140%)}to{transform:translateX(520%)}}
@keyframes lurch{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(6deg) translateY(-6px)}}
/* Last Stand */
.stand{display:none; flex-direction:column; align-items:center; gap:10px; padding:6px 2px 4px}
body.st .stand{display:flex} body.st .gridwrap{display:none}
.pot{font-family:var(--display); font-size:2.4rem; letter-spacing:.05em; color:var(--hazard); text-shadow:3px 3px 0 var(--ink); line-height:1}
.pot small{display:block; font-family:"Baloo 2"; font-size:.8rem; color:var(--paper); text-shadow:none; letter-spacing:0; text-align:center}
.doors{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%}
.door{position:relative; aspect-ratio:.62; border:3px solid var(--ink); border-radius:10px 10px 4px 4px; cursor:pointer; padding:0; overflow:hidden; background:#1A0F14; box-shadow:0 5px 0 var(--ink)}
.door .leaf{position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 3px, transparent 3px 16px), linear-gradient(90deg,#8A5A34,#6A4020); transform-origin:0 50%; transition:transform .55s cubic-bezier(.5,-0.2,.4,1.2); display:grid; place-items:center; z-index:2}
.door .leaf::after{content:""; position:absolute; right:12%; top:52%; width:12%; aspect-ratio:1; border-radius:50%; background:var(--hazard); border:2px solid var(--ink)}
.door .plank{position:absolute; left:-10%; right:-10%; height:12%; background:#B07A48; border:2px solid var(--ink); z-index:3; transition:opacity .3s}
.door .plank.p1{top:24%; transform:rotate(-12deg)} .door .plank.p2{top:62%; transform:rotate(9deg)}
.door .lbl{position:absolute; bottom:4%; left:0; right:0; text-align:center; font-family:var(--display); letter-spacing:.06em; font-size:1rem; z-index:4; color:var(--paper); text-shadow:2px 2px 0 var(--ink)}
.door .behind{position:absolute; inset:8%; display:grid; place-items:center; z-index:1}
.door .behind svg{width:100%}
.door.open .leaf{transform:perspective(400px) rotateY(-105deg)} .door.open .plank{opacity:0}
.door.dim{opacity:.55} .door:disabled{cursor:default}
.door.picked{box-shadow:0 0 0 3px var(--hazard), 0 5px 0 var(--ink)}
.standlog{min-height:1.4em; text-align:center; font-weight:800}
.btn.flee{background:linear-gradient(#FFE27A,#FFB23D); height:44px; padding:0 18px; font-size:.85rem}
/* ---------- tableau de commande ---------- */
.msg{min-height:1.5em; text-align:center; font-weight:800; margin:9px 0 2px; color:var(--paper); text-shadow:0 2px 0 var(--ink)}
.deck{margin-top:6px; display:flex; flex-direction:column; gap:9px}
.meters{display:grid; grid-template-columns:1fr auto 1fr; gap:6px}
.meter{border-radius:12px; padding:3px 10px; display:flex; flex-direction:column; justify-content:center; min-width:0; background:linear-gradient(#1A1016,#0E080C); border:2.5px solid var(--ink); box-shadow:inset 0 0 0 1.5px rgba(255,122,31,.5)}
.meter small{font-size:.68rem; color:#D8B8A8}
.meter b{font-family:var(--display); font-weight:400; font-size:clamp(.92rem, 4.1vw, 1.25rem); letter-spacing:.02em; color:var(--ember); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 8px rgba(255,122,31,.5); font-variant-numeric:tabular-nums}
.meter.r{text-align:right}
.bet{display:flex; align-items:center; gap:4px; border-radius:12px; padding:3px; background:linear-gradient(#1A1016,#0E080C); border:2.5px solid var(--ink); box-shadow:inset 0 0 0 1.5px rgba(255,122,31,.5)}
.bet .mid{display:flex; flex-direction:column; align-items:center; min-width:50px}
.bet small{font-size:.66rem; color:#D8B8A8}
.bet b{font-family:var(--display); font-weight:400; font-size:1.2rem; letter-spacing:.05em; color:var(--paper)}
.pm{width:30px; height:30px; border-radius:50%; border:2px solid var(--ink); background:linear-gradient(#FFE27A,#FFB23D); font-weight:800; cursor:pointer; padding:0; line-height:1; color:var(--ink)}
.row{display:flex; align-items:center; justify-content:space-between; gap:6px}
.btn{height:50px; min-width:52px; border-radius:12px; border:3px solid var(--ink); background:linear-gradient(#F4E6D6,#C8B4A2); color:var(--ink); font-weight:800; font-size:.68rem; cursor:pointer; padding:0 6px;
  box-shadow:0 4px 0 var(--ink), inset 0 2px 0 rgba(255,255,255,.6); display:grid; place-items:center; line-height:1.05; text-align:center}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45; cursor:default}
.btn.on{background:linear-gradient(#B6FF7A,#5FD83A)}
.btn svg{width:22px; height:22px}
.btn.buy{background:linear-gradient(#FF6A4F,#B3261E); color:var(--paper); text-shadow:0 1px 0 var(--ink)}
.spin{width:90px; height:90px; flex:none; border-radius:50%; border:4px solid var(--ink); cursor:pointer; display:grid; place-items:center; padding:0; position:relative;
  background:radial-gradient(circle at 35% 28%, #FF9A7A, #E0331E 50%, #7A1010 92%); box-shadow:0 6px 0 var(--ink), inset 0 -6px 12px rgba(0,0,0,.35), 0 0 0 5px rgba(255,194,26,.5), 0 0 26px rgba(224,51,30,.6)}
.spin svg{width:50px; height:50px; transition:transform .5s}
.spin.go svg{transform:rotate(360deg)}
.spin:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.spin:disabled{opacity:.6; cursor:default}
.spin.stop{background:radial-gradient(circle at 35% 28%, #FFF6C2, #FFC21A 50%, #B98612 90%)}
body.bonus .deck .row button, body.bonus .bet .pm{visibility:hidden}
/* ---------- fenêtres ---------- */
.overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(10,4,8,.72); padding:18px; z-index:20}
.overlay.show{display:grid}
.card{background:linear-gradient(180deg,#3A2A38,#1E141C); color:var(--paper); border:4px solid var(--ink); border-radius:18px; padding:20px; max-width:400px; width:100%; text-align:center;
  box-shadow:inset 0 0 0 2px var(--rust), 0 8px 0 var(--ink), 0 0 40px rgba(224,51,30,.35); max-height:88vh; overflow-y:auto}
.card h2{font-family:var(--display); font-weight:400; letter-spacing:.05em; margin:0 0 6px; font-size:2.2rem; color:var(--hazard); text-shadow:3px 3px 0 var(--ink)}
.card p{margin:6px 0 14px; line-height:1.5}
.card .btn{margin:4px auto 0; padding:0 22px}
.choices{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 14px}
.offers{display:grid; gap:10px; margin:10px 0 14px}
.offer{display:flex; align-items:center; gap:12px; text-align:left; background:linear-gradient(#3A2A38,#241A22); border:3px solid var(--ink); border-radius:14px; padding:10px 12px; cursor:pointer; box-shadow:0 4px 0 var(--ink), inset 0 0 0 1.5px var(--rust); color:var(--paper)}
.offer:disabled{opacity:.45; cursor:default}
.offer svg{width:54px; height:54px; flex:none; overflow:visible}
.offer span{display:flex; flex-direction:column; gap:1px; font-size:.84rem}
.offer strong{font-family:var(--display); font-weight:400; letter-spacing:.05em; font-size:1.35rem; color:var(--hazard)}
.offer .price{font-weight:800; color:var(--toxic)}
.rules{text-align:left}
.rules h2{text-align:center}
.rules h3{font-family:var(--display); font-weight:400; letter-spacing:.05em; font-size:1.3rem; margin:14px 0 4px; color:var(--toxic)}
.rules table{width:100%; border-collapse:collapse; font-size:.8rem; margin:6px 0 8px; font-variant-numeric:tabular-nums}
.rules td,.rules th{padding:3px 3px; text-align:center; border-bottom:1px solid rgba(216,184,168,.2)}
.rules td svg{width:34px; height:34px; vertical-align:middle}
.rules p,.rules li{font-size:.9rem; line-height:1.5}
.rules ul{padding-left:18px; margin:4px 0 8px}
.rules .tw{overflow-x:auto}
.intro{position:fixed; inset:0; z-index:18; display:none; overflow:hidden; background:radial-gradient(circle, rgba(90,14,10,.94), rgba(8,2,6,.98))}
.intro.show{display:grid}
.intro.fall{background:#000; animation:fall 1.2s ease-out}
@keyframes fall{0%{background:#fff}10%{background:#000}20%{background:#8A1010}35%{background:#000}}
.layer{position:fixed; inset:0; z-index:20; display:none; place-items:center; pointer-events:none; padding:16px}
.layer.show{display:grid}
.layer.click{pointer-events:auto; cursor:pointer}
.layer .btn{pointer-events:auto}
.bigrays{position:absolute; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,90,31,.2) 0deg 7deg, transparent 7deg 18deg); animation:spin 26s linear infinite;
  -webkit-mask:radial-gradient(circle, #000 0, transparent 55%); mask:radial-gradient(circle, #000 0, transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.introbox{position:relative; text-align:center; padding:20px; max-width:430px}
.medals{display:flex; justify-content:center; gap:4px; margin-bottom:10px; flex-wrap:wrap}
.medals svg{width:74px; height:74px; overflow:visible; animation:medal .6s cubic-bezier(.3,1.6,.5,1) both}
.introbox.many .medals svg{width:58px; height:58px}
@keyframes medal{from{transform:translateY(-60vh) rotate(-200deg) scale(.4); opacity:0}to{transform:none; opacity:1}}
.ititle{font-family:var(--display); font-size:3.4rem; line-height:1; letter-spacing:.05em; color:var(--hazard); text-shadow:4px 4px 0 var(--blood), 8px 8px 0 var(--ink), 0 0 30px rgba(255,90,31,.8); animation:stamp .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stamp{from{transform:scale(2.6) rotate(-8deg); opacity:0}to{transform:rotate(-3deg); opacity:1}}
.isub{color:var(--paper); font-weight:700; margin:14px 0 18px; line-height:1.45; animation:fadein .5s both}
@keyframes fadein{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.introbox .btn{margin:0 auto; padding:0 26px; font-size:1rem; animation:fadein .5s both}
.bigwin{position:fixed; inset:0; z-index:16; display:none; overflow:hidden; background:radial-gradient(circle, rgba(120,30,10,.72), rgba(10,4,8,.93))}
.bigwin.show{display:grid}
.bigwin .bigrays{display:none}
.bigwin[data-tier="2"] .bigrays,.bigwin[data-tier="3"] .bigrays,.bigwin[data-tier="4"] .bigrays{display:block}
.bigwin[data-tier="4"] .bigrays{background:repeating-conic-gradient(from 0deg, rgba(124,255,79,.22) 0deg 6deg, rgba(255,194,26,.25) 6deg 12deg, rgba(224,51,30,.25) 12deg 18deg, transparent 18deg 30deg)}
.bw{position:relative; text-align:center; animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.bw .t{font-family:var(--display); font-size:3.4rem; letter-spacing:.05em; line-height:1; color:var(--hazard); text-shadow:4px 4px 0 var(--blood), 8px 8px 0 var(--ink); animation:wobble 1s ease-in-out infinite alternate}
.bwLayer3 .bw .t{color:var(--ember)}
.bwLayer4 .bw .t{color:var(--toxic); text-shadow:4px 4px 0 #1E5A12, 8px 8px 0 var(--ink), 0 0 30px rgba(124,255,79,.7)}
.bw .v{font-family:var(--display); font-size:3rem; letter-spacing:.05em; color:var(--paper); margin-top:10px; text-shadow:3px 3px 0 var(--ink)}
.bw .x{color:#D8B8A8; margin-top:4px; font-weight:800}
.dance{display:flex; justify-content:center; gap:2px; margin-top:14px}
.dance svg{width:40px; height:40px; animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
@keyframes wobble{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.fly{position:fixed; z-index:17; pointer-events:none; transition:transform .65s cubic-bezier(.5,-0.3,.4,1.2), opacity .65s}
.fly svg{width:100%; height:100%}
#fx{position:fixed; inset:0; z-index:19; pointer-events:none}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 16px); transform:translateX(-50%); background:linear-gradient(#FFE27A,#FFB23D); color:var(--ink); border:3px solid var(--ink);
  border-radius:999px; padding:7px 18px; font-weight:800; z-index:21; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; box-shadow:0 4px 0 var(--ink); max-width:94vw; overflow:hidden; text-overflow:ellipsis}
.toast.show{opacity:1}
/* ---------- la rue ---------- */
.floor{position:relative; z-index:1; height:220px; margin-top:-30px; overflow:hidden; --k:1}
.floor .ground{position:absolute; inset:0; width:100%; height:100%}
.floor .deco,.floor .animal{position:absolute}
.floor .deco svg,.floor .animal svg{width:100%; display:block; overflow:visible}
#fCar{left:2%; bottom:40px; width:calc(150px * var(--k))}
#fBarrel{left:70%; bottom:52px; width:calc(40px * var(--k))}
#fSign{left:84%; bottom:60px; width:calc(46px * var(--k))}
.animal.z{bottom:18px; width:calc(54px * var(--k)); animation:zwalk var(--d) linear infinite; animation-delay:var(--del)}
.animal.z svg{animation:lurch .45s ease-in-out infinite alternate}
@keyframes zwalk{from{left:-15%}to{left:110%}}
.siren .cop1{animation:lamp .5s steps(2) infinite} .siren .cop2{animation:lamp .5s steps(2) infinite; animation-delay:.25s}
.credit{position:absolute; left:0; right:0; bottom:6px; margin:0; text-align:center; font-size:.72rem; color:#D8B8A8; opacity:.9}
@media (min-width:900px){ .floor{height:280px; --k:1.4} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} .horde{display:none} }

<script>
// ---------- son : ville en alerte, sirènes, grognements et course-poursuite, tout généré en direct ----------
// @@MUSIQUE-DEBUT
// ---------- MUSIQUE : un petit compositeur (harmonie, voicings liés, mélodies à motifs) et des instruments doux ----------
// MUSIQUE(ctx, bus, partition) -> { start(bonus), stop(), setBonus(v), hush(v), setMood(m) }
// La partition décrit le morceau (tonalité, gamme, tempo, suite d'accords, instruments) ; tout le reste est composé ici,
// avec un aléatoire à graine : le morceau est toujours le même au début, puis ses mélodies varient à chaque tour.
// Voir references/musique.md.
const MUSIQUE = (() => {
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], lydian: [0, 2, 4, 6, 7, 9, 11], harmonic: [0, 2, 3, 5, 7, 8, 11], mixo: [0, 2, 4, 5, 7, 9, 10] };
  // notes d'un accord bâti en tierces sur un degré de la gamme ; ext : '', '7', '9', 'maj7' (= 7), 'maj9' (= 9), '6', 'sus', 'sus9', 'add9'
  function chord(P, deg, ext = '') {
    const sc = SCALES[P.scale], at = i => sc[((i % 7) + 7) % 7] + 12 * Math.floor(i / 7), d = deg - 1;
    const idx = [d, ext.startsWith('sus') ? d + 3 : d + 2, d + 4];
    if (/7|9/.test(ext) && ext !== 'add9') idx.push(d + 6);
    if (/9/.test(ext)) idx.push(d + 8);
    if (ext === '6') idx.push(d + 5);
    return { root: at(d), tones: idx.map(at) };
  }
  // voicing : chaque note prend l'octave la plus proche de la voix précédente (enchaînements doux, sans sauts)
  function voice(prev, tones, key, lo, hi) {
    const center = prev ? prev.reduce((a, b) => a + b, 0) / prev.length : (lo + hi) / 2;
    return tones.map(t => { let m = key + t; while (m < center - 6) m += 12; while (m > center + 6) m -= 12; while (m < lo) m += 12; while (m > hi) m -= 12; return m; }).sort((a, b) => a - b);
  }
  const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  return function create(ctx, bus, P) {
    const R = rng(P.seed || 7);
    // ---------- mixage : sec + réverbération (réponse impulsionnelle générée) + écho, filtre chaud, compresseur ----------
    const out = ctx.createGain(); out.gain.value = 0; out.connect(bus);
    const warm = ctx.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = P.bright || 6000; warm.Q.value = 0.3;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.02; comp.release.value = 0.3;
    warm.connect(comp).connect(out);
    const dry = ctx.createGain(); dry.connect(warm);
    const verb = ctx.createConvolver(), verbIn = ctx.createGain(); verbIn.gain.value = 1;
    { const len = Math.floor(ctx.sampleRate * (P.reverb || 2.6)), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lp = 0; for (let i = 0; i < len; i++) { lp += ((Math.random() * 2 - 1) - lp) * 0.35; d[i] = lp * Math.pow(1 - i / len, 2.4); } }
      verb.buffer = ir; }
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.55; verbIn.connect(verb).connect(verbOut).connect(warm);
    const delay = ctx.createDelay(2), fb = ctx.createGain(), dlp = ctx.createBiquadFilter(), dOut = ctx.createGain();
    dlp.type = 'lowpass'; dlp.frequency.value = 2200; fb.gain.value = 0.32; dOut.gain.value = 0.22;
    delay.connect(dlp).connect(fb).connect(delay); dlp.connect(dOut).connect(warm);
    // groupes « ducking » : la nappe et la basse s'effacent un instant sous chaque grosse caisse (respiration)
    const padBus = ctx.createGain(); padBus.connect(dry); const padSend = ctx.createGain(); padSend.gain.value = 0.5; padBus.connect(padSend).connect(verbIn);
    const bassBus = ctx.createGain(); bassBus.connect(dry);
    const send = (node, rv = 0.3, dl = 0) => { node.connect(dry); if (rv) { const g = ctx.createGain(); g.gain.value = rv; node.connect(g).connect(verbIn); } if (dl) { const g = ctx.createGain(); g.gain.value = dl; node.connect(g).connect(delay); } };

    let mood = '';
    const det = () => (mood === 'mad' ? (Math.random() - 0.5) * 70 : 0); // la folie désaccorde tout
    function env(g, t, a, peak, d, r = 0.3) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.setTargetAtTime(0.0001, t + a + d, r); }
    const osc = (type, f, t, stop, dt = 0) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = dt; o.start(t); o.stop(stop); return o; };
    // ---------- instruments ----------
    const I = {

const SALLE = (() => {
  const JEU = 'dead-city', P = 'promenade.';

  const set = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} };

  return {
    solde: d => { const v = get('lucioles', null); return typeof v === 'number' && isFinite(v) && v >= 0 ? v : d; },
    garder: v => set('lucioles', Math.round(v * 100) / 100),
    spin: () => up(j => { j.spins++; }),
    gain: (v, mise) => { if (v > 0) up(j => { j.meilleur = Math.max(j.meilleur, v); j.meilleurX = Math.max(j.meilleurX, v / mise); }); return v; },
    bonus: (tier, achete) => up(j => { j.bonus[tier] = (j.bonus[tier] || 0) + 1; if (achete) j.achats[tier] = (j.achats[tier] || 0) + 1; }),
    flag: k => up(j => { j.flags[k] = true; }),
    compte: (k, n = 1) => up(j => { j.compte[k] = (j.compte[k] || 0) + n; }),
  };
})();

async function revealDrop(g, antic = true) {

}
function setCell(d, x, cls = 'drop') {

// joue les étapes d'un spin (après la chute) ; unit convertit le gain brut d'une cascade en crédits
async function playSteps(cells, steps, unit, o = {}) {
  let paid = 0;
  for (const s of steps) {
    if (s.t === 'drop') continue;
    if (s.t === 'horde') {
      pow('HORDE !'); quake(); Snd.fx('horde'); msg('Une horde traverse la rue !');
      const h = document.createElement('div'); h.className = 'horde';
      for (let i = 0; i < 4; i++) { const sp = document.createElement('span'); sp.innerHTML = ART.wild('wild'); sp.style.top = (8 + i * 22) + '%'; sp.style.animationDelay = (i * 160) + 'ms'; h.appendChild(sp); }
      $('gridwrap').appendChild(h); setTimeout(() => h.remove(), 2400);
      await sleep(500);
      for (const [c, r] of s.cells) { const d = cells[r][c]; d.classList.add('boom'); const [x, y] = FX.center(d); FX.burst('debris', x, y, 3, 4); Snd.fx('splat', 1); await sleep(70); }
      await sleep(350);
      for (const [c, r] of s.cells) setCell(cells[r][c], s.g[c][r]);
      await sleep(550); continue;
    }
    if (s.t === 'zero') {
      const [c, r] = s.cell, d = cells[r][c];
      pow('PATIENT ZÉRO'); Snd.fx('zero'); msg('Le patient zéro est là. L\'infection va se propager à chaque cascade.');
      d.innerHTML = ART.wild('zero'); d.classList.add('zero', 'bite', 'sticky'); const [x, y] = FX.center(d); FX.burst('goo', x, y, 10, 5);
      await sleep(800);
      for (const [a, b] of s.infected || []) cells[b][a].classList.add('infected');
      if ((s.infected || []).length) Snd.fx('infect');
      await sleep(600); continue;
    }
    // cascade gagnante
    const win = s.amt * unit; paid += win;
    $('grid').classList.add('dimmed');
    for (const w of s.wins) for (const [c, r] of w.cells) cells[r][c].classList.add('win');
    const big = s.wins.reduce((m, w) => Math.max(m, w.size), 0);
    floatText('+' + fmt(win)); Snd.fx('win', win / bet() >= 5 ? 2 : 1);
    msg(`Grappe de ${big} : ${fmt(win)}${o.multTxt ? o.multTxt() : ''}`);
    if (o.onWin) await o.onWin(s);
    await sleep(750);
    Snd.fx('splat');
    s.cells.forEach(([c, r], i) => { const d = cells[r][c]; d.classList.remove('win'); d.classList.add('boom'); if (i % Math.ceil(s.cells.length / 6) === 0) { const [x, y] = FX.center(d); FX.burst('goo', x, y, 3, 4); } }); // quelques éclaboussures seulement, même pour une énorme grappe
    if (s.cells.length >= 10) shake();
    await sleep(320);
    $('grid').classList.remove('dimmed');
    for (const r of cells) for (const d of r) d.classList.remove('win');
    for (const [c, r] of s.cells) setCell(cells[r][c], s.g[c][r]);
    if (s.zombified && s.zombified.length) {
      await sleep(250); Snd.fx('bite');
      for (const [c, r] of s.zombified) { const d = cells[r][c]; d.classList.remove('infected'); setCell(d, E.WILD, 'bite'); d.classList.add('sticky'); const [x, y] = FX.center(d); FX.burst('goo', x, y, 3, 4); }
    }
    if (s.infected && s.infected.length) { for (const [c, r] of s.infected) cells[r][c].classList.add('infected'); Snd.fx('infect'); }
    await sleep(450);
  }
  return paid;
}

      <button class="btn" id="introBtn" style="animation-delay:${tDelay + 600}ms">${tier === 4 ? 'Se barricader' : tier === 5 ? 'Foncer vers le toit' : 'Survivre'}</button>`;
    box.classList.toggle('many', count > 4);
    el.classList.add('show'); $('introLayer').classList.add('show'); Snd.fx('whoosh');
    for (let i = 0; i < count; i++) setTimeout(() => { Snd.fx('thunk'); const W = FX.W(), H = FX.H(); FX.burst('ember', W / 2 + (i - (count - 1) / 2) * 70, H * 0.36, 10, 5); }, i * 260 + 450);
    setTimeout(() => { Snd.fx('fanfare'); const W = FX.W(), H = FX.H(); FX.burst('goo', W / 2, H * 0.45, 30, 10); if (tier >= 4) FX.firework(W / 2, H * 0.3); }, tDelay + 200);
    const b = $('introBtn');
    setTimeout(() => b.focus(), tDelay + 700);
    b.onclick = () => { el.classList.remove('show'); $('introLayer').classList.remove('show'); res(); };
  });
}

// ---------- bonus ----------
function flashChip(id) { const c = $(id); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
function hud(tier, info, spinsLbl, spins, multLbl, multV, total) {
  $('tierName').textContent = TIER_NAME[tier]; $('tierInfo').textContent = info;
  $('chipSpins').firstChild.textContent = spinsLbl + ' '; $('spinsLeft').textContent = spins;
  $('multLbl').textContent = multLbl; $('multN').textContent = multV; $('bonusTotal').textContent = fmt(total);
}
async function runOutbreak(b, b0) {
  const unit = E.BONUS_K[3] * b0; let total = 0;
  const upd = () => hud(3, `${Math.round(b.sticky.size / 25 * 100)} % contaminé`, 'Spins', b.spinsLeft, 'Zombies', `${b.sticky.size}/${E.TIER[3].maxZ}`, total);
  showStatic(E.spinBase()); upd(); await sleep(700);
  while (!b.done) {
    const ev = E.bonusSpin(b); upd(); msg('');
    const cells = await revealDrop(ev.drop, false);
    markSticky(cells, new Set([...b.sticky].filter(k => !ev.born.some(([c, r]) => c * 5 + r === k))));
    for (const [c, r] of ev.born) { const d = cells[r][c]; setCell(d, E.WILD, 'bite'); d.classList.add('sticky'); const [x, y] = FX.center(d); FX.burst('goo', x, y, 6, 5); Snd.fx('bite'); flashChip('chipMult'); await sleep(380); }
    if (ev.born.length) { msg(ev.born.length > 1 ? 'Deux zombies surgissent !' : 'Un zombie surgit et reste sur la grille !'); await sleep(400); }
    await playSteps(cells, ev.steps, unit);
    markSticky(cells, b.sticky);
    total = Math.min(E.TIER[3].cap * b0, b.total * b0); upd(); if (ev.win > 0) flashChip('chipTotal');
    if (!ev.steps.length) { msg('Aucune grappe ce spin-ci'); await sleep(700); } else await sleep(500);
  }
  return `${b.sticky.size} zombies sur la grille à la fin`;
}
const OUT_ART = () => ({ zombies: ART.wild('wild'), armes: ART.guns, horde: ART.horde });
async function runStand(b, b0) {
  document.body.classList.add('st');
  const K = E.BONUS_K[4] * b0, cap = E.TIER[4].cap * b0, val = () => Math.min(cap, b.pot * K);
  const pot0 = b.pot, xm = () => '×' + (b.pot / pot0).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  const upd = () => { hud(4, `Manche ${Math.min(b.round + 1, E.TIER[4].rounds)}/${E.TIER[4].rounds}`, 'Manches', `${b.round}/${E.TIER[4].rounds}`, 'Butin', xm(), val());
    $('pot').innerHTML = `${fmt(val())}<small>butin à emporter</small>`; $('fleeBtn').textContent = `S'enfuir avec ${fmt(val())}`; };
  const doors = () => {
    $('doors').innerHTML = ['Gauche', 'Centre', 'Droite'].map((n, i) => `<button class="door" data-i="${i}" ${i === 0 ? 'data-auto' : ''} aria-label="Défendre la porte ${n.toLowerCase()}"><span class="behind"></span><span class="leaf"></span><span class="plank p1"></span><span class="plank p2"></span><span class="lbl">${n}</span></button>`).join('');
    $('standlog').textContent = 'Quelle porte défends-tu ?';
  };
  doors(); upd(); msg('Barricade-toi : choisis une porte, ou fuis avec le butin.');
  while (!b.done) {
    const choice = await new Promise(res => {
      $('doors').querySelectorAll('.door').forEach(d => d.onclick = () => res(+d.dataset.i));
      $('fleeBtn').disabled = false; $('fleeBtn').onclick = () => res('fuir');
    });
    $('fleeBtn').disabled = true; $('doors').querySelectorAll('.door').forEach(d => d.disabled = true);
    if (choice === 'fuir') { E.bonusSpin(b, 'fuir'); Snd.fx('whoosh'); $('standlog').textContent = `Tu t'enfuis par la ruelle avec ${fmt(val())} !`; await sleep(1200); break; }
    const ev = E.bonusSpin(b, 'porte'), A = OUT_ART(), picked = $('doors').children[choice];
    Snd.fx('door'); picked.classList.add('picked');
    picked.querySelector('.behind').innerHTML = A[ev.out]; picked.classList.add('open');
    await sleep(700);
    const [x, y] = FX.center(picked);
    if (ev.out === 'zombies') { Snd.fx('shots'); FX.burst('goo', x, y, 16, 6); $('standlog').textContent = 'Tu repousses quelques zombies : butin ×1,3 !'; }
    if (ev.out === 'armes') { Snd.fx('guns'); FX.burst('spark', x, y, 18, 7); FX.burst('cash', x, y, 10, 6); $('standlog').textContent = 'Une caisse d\'armes ! Butin ×1,6 !'; }
    if (ev.out === 'horde') { Snd.fx('horde'); quake(); FX.burst('debris', x, y, 20, 8); $('standlog').textContent = 'La horde enfonce la barricade ! Tu t\'échappes avec 15 % du butin.'; }
    upd(); flashChip('chipTotal');
    await sleep(500);
    [...$('doors').children].forEach((d, i) => { if (i !== choice) { d.querySelector('.behind').innerHTML = A[ev.others[i < choice ? i : i - 1]]; d.classList.add('open', 'dim'); } });
    if (ev.survived) { $('standlog').textContent = 'Les secours arrivent ! Tu gardes tout ton butin.'; Snd.fx('heli'); }
    await sleep(ev.out === 'horde' ? 1600 : 1300);
    if (!b.done) doors();
  }
  document.body.classList.remove('st');
  return b.history.length ? `${b.history.length} manche${b.history.length > 1 ? 's' : ''} tenue${b.history.length > 1 ? 's' : ''}` : 'fuite immédiate';
}
async function runExtraction(b, b0) {
  document.body.classList.add('ext');
  const T = E.TIER[5], unit = E.BONUS_K[5] * b0; let total = 0;
  $('floors').innerHTML = Array.from({ length: T.floors }, (_, i) => `<span class="fl" id="fl${i}"></span>`).join('') + `<span class="heli" id="heliIc">${ART.heli}</span>`;
  const upd = () => { hud(5, `Étage ${b.floor}/${T.floors}`, 'Tours', b.spinsLeft, 'Multi', '×' + b.mult, total); for (let i = 0; i < T.floors; i++) $('fl' + i).classList.toggle('on', i < b.floor); };
  showStatic(E.spinBase()); upd(); await sleep(700);
  while (!b.done) {
    const f0 = b.floor, ev = E.bonusSpin(b); msg('');
    hud(5, `Étage ${f0}/${T.floors}`, 'Tours', b.spinsLeft - ev.crates.filter(c => c === 'ammo').length, 'Multi', '×' + (b.mult - ev.crates.filter(c => c === 'mult').length), total);
    const cells = await revealDrop(ev.drop, false);
    for (const cr of ev.crates) {
      const d = cells[Math.floor(Math.random() * 5)][Math.floor(Math.random() * 5)]; Snd.fx('crate'); pow(cr === 'ammo' ? '+1 TOUR' : 'MULTI +1');
      flyTo(d, $(cr === 'ammo' ? 'chipSpins' : 'chipMult'), ART.crate(cr)); toast(cr === 'ammo' ? 'Caisse de munitions : +1 tour !' : 'Caisse de multiplicateur : +1 !');
      await sleep(900); flashChip(cr === 'ammo' ? 'chipSpins' : 'chipMult');
    }
    let fl = f0;
    await playSteps(cells, ev.steps, unit, {
      multTxt: () => (b.mult > 1 ? ` (×${b.mult})` : ''),
      onWin: async s => { if (s.floor > fl) { fl = s.floor; $('tierInfo').textContent = `Étage ${fl}/${T.floors}`; for (let i = 0; i < T.floors; i++) $('fl' + i).classList.toggle('on', i < fl); Snd.fx('climb', fl); toast(fl >= T.floors ? 'Le toit ! L\'hélico descend…' : `Étage ${fl} atteint !`); } },
    });
    total = Math.min(T.cap * b0, b.total * b0); upd();
    if (ev.roof) { SALLE.flag('extraction');
      $('heliIc').classList.add('go'); Snd.fx('heli'); pow('EXTRACTION !');
      const prize = 12 * b.mult * unit; floatText('+' + fmt(prize)); msg(`Extraction réussie : prime du toit ${fmt(prize)} !`);
      const [x, y] = FX.center($('gridwrap')); FX.burst('cash', x, y, 30, 10); FX.firework(x, y - 60);
      await sleep(1800);
    } else if (!ev.steps.length) { msg('Pas de grappe : tu restes coincé à cet étage'); await sleep(800); }
    else await sleep(500);
  }
  document.body.classList.remove('ext'); $('heliIc') && $('heliIc').classList.remove('go');
  return b.roof ? 'extraction réussie, tu es sur le toit !' : `bloqué à l'étage ${b.floor}, la horde envahit l'immeuble`;
}
async function runBonus(tier, bought, count) {
  const b0 = bet(); SALLE.bonus(tier, bought);
  await introBonus(tier, count, bought);
  document.body.classList.add('bonus'); Snd.setBonus(true); msg('');
  const b = E.newBonus(tier);
  const detail = tier === 3 ? await runOutbreak(b, b0) : tier === 4 ? await runStand(b, b0) : await runExtraction(b, b0);
  const win = b.total * b0, mult = b.total;
  await sleep(500);
  if (b.capped) toast('Gain maximum atteint !');
  if (winTier(mult)) await bigWin(win, mult);
  S.balance += win; setMoney(); $('lastWin').textContent = fmt(SALLE.gain(win, bet()));
  await overlay(`<h2>${fmt(win)}</h2><p>${TIER_NAME[tier]} terminé : ${detail}. ×${mult.toLocaleString('fr-FR', { maximumFractionDigits: 1 })} la mise${bought ? ` (acheté ${E.BUY[tier]}×)` : ''}.</p>`, 'Continuer');
  document.body.classList.remove('bonus'); Snd.setBonus(false);
  msg(`${TIER_NAME[tier]} : ${fmt(win)}`);
  showStatic(E.spinBase());
}

// ---------- achat du bonus ----------
function openBuy() {
  if (S.busy || S.auto) return;
  const off = t => {
    const price = E.BUY[t] * bet(), ok = !S.ante && S.balance >= price - 1e-9;
    const d = t === 3 ? '8 free spins, les zombies restent sur la grille' : t === 4 ? 'Barricade : 3 portes par manche, fuis quand tu veux' : '5 tours pour grimper jusqu\'à l\'hélico, grosse prime sur le toit';
    return `<button class="offer" data-t="${t}" ${ok ? '' : 'disabled'}>${ART.SCAT}<span><strong>${TIER_NAME[t]}</strong>${t} sirènes. ${d}<span class="price">${fmt(price)} lucioles (${E.BUY[t].toLocaleString('fr-FR')}× la mise)</span></span></button>`;
  };
  $('card').innerHTML = `<h2>Acheter un bonus</h2><p>${S.ante ? 'Désactive Chance bonus pour acheter.' : 'Le prix dépend de la mise en cours.'}</p><div class="offers">${off(3)}${off(4)}${off(5)}</div><button class="btn" id="ovBtn">Annuler</button>`;
  $('overlay').classList.add('show');
  $('ovBtn').onclick = () => $('overlay').classList.remove('show');
  $('card').querySelectorAll('.offer').forEach(o => o.onclick = () => { $('overlay').classList.remove('show'); buy(+o.dataset.t); });
  $('ovBtn').focus();
}
async function buy(tier) {
  const price = E.BUY[tier] * bet();
  if (S.balance < price - 1e-9) return;
  S.busy = true; lockUI(true); Snd.start();
  S.balance -= price; setMoney(); msg(`${TIER_NAME[tier]} acheté`);
  const g = E.spinBase('normal');
  for (const col of g) for (let r = 0; r < 5; r++) if (col[r] === E.SCAT) col[r] = 0;
  const spots = []; for (let c = 0; c < 5; c++) for (let r = 0; r < 5; r++) spots.push([c, r]);
  spots.sort(() => Math.random() - 0.5).slice(0, tier).forEach(([c, r]) => (g[c][r] = E.SCAT));
  const cells = await revealDrop(g);
  await presentScatters(cells, g);
  await runBonus(tier, true, tier);
  S.busy = false; lockUI(false);
}

// ---------- fenêtres ----------
function overlay(html, btn) {
  return new Promise(res => {
    $('card').innerHTML = html + (btn ? `<button class="btn" id="ovBtn">${btn}</button>` : '');
    $('overlay').classList.add('show');
    const b = $('ovBtn'); if (b) { b.focus(); b.onclick = () => { $('overlay').classList.remove('show'); res(); }; }
  });
}
function showRules() {
  const pn = E.scatProbs('normal'), pa = E.scatProbs('ante');
  const every = p => Math.round(1 / p).toLocaleString('fr-FR');
  const x = v => v.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
  const SIZES = [5, 6, 8, 10, 12, 15];
  const rows = E.SYMS.map((s, i) => `<tr><td>${ART.SYMS[i]}</td>${SIZES.map(n => `<td>${x(s.pay * E.SIZE_F[Math.min(n, E.SIZE_F.length - 1)] * E.BASE_SCALE.normal)}</td>`).join('')}</tr>`).join('');
  $('card').innerHTML = `<div class="rules"><h2>Règles</h2>
  <p>Grille de 5×5 en <b>grappes</b> : 5 symboles identiques ou plus qui se touchent (haut, bas, gauche, droite) paient. Le zombie <b>WILD</b> remplace tous les symboles sauf la sirène. Les symboles gagnants explosent et de nouveaux tombent à leur place : les <b>cascades</b> continuent tant qu'il y a des grappes. Gains par grappe, en multiples de la mise :</p>
  <div class="tw"><table><tr><th></th>${SIZES.map(n => `<th>${n}${n === 15 ? '+' : ''}</th>`).join('')}</tr>${rows}</table></div>
  <h3>La jauge d'invasion</h3>
  <p>Chaque cascade, chaque sirène, chaque horde et chaque patient zéro remplissent la jauge. À 100 %, la ville tombe : pendant ${E.GAUGE.invasion} spins, tous les survivants qui tombent sur la grille deviennent des zombies jokers (INVASION MODE). La jauge est conservée d'un spin à l'autre.</p>
  <h3>Pendant le jeu</h3>
  <ul><li><b>Horde</b> (environ 1 spin sur ${Math.round(1 / E.FEAT.horde)}) : la horde traverse la grille et détruit des petits symboles, remplacés aussitôt. De quoi relancer les cascades.</li>
  <li><b>Patient zéro</b> (environ 1 spin sur ${Math.round(1 / E.FEAT.zero)}) : un zombie apparaît au centre. À chaque cascade, l'infection gagne ses voisins : humain, puis infecté, puis zombie joker qui reste jusqu'à la fin du spin.</li></ul>
  <h3>Les bonus des sirènes</h3>
  <ul><li><b>3 sirènes, The Outbreak</b> (1 spin sur ${every(pn[3])}) : 8 free spins. À chaque spin, des zombies surgissent et restent sur la grille (${E.TIER[3].maxZ} au maximum).</li>
  <li><b>4 sirènes, Last Stand</b> (1 spin sur ${every(pn[4])}) : ${INTRO_TXT[4]} C'est un pari équitable : en moyenne, fuir ou continuer rapporte la même chose. À toi de choisir ton risque. Au bout de ${E.TIER[4].rounds} manches tenues, les secours arrivent.</li>
  <li><b>5 sirènes ou plus, Extraction</b> (1 spin sur ${every(pn[5])}) : ${INTRO_TXT[5]} Atteindre le toit rapporte une grosse prime.</li></ul>
  <h3>Options</h3>
  <p>Acheter The Outbreak coûte ${E.BUY[3]} fois la mise, Last Stand ${E.BUY[4]} fois et Extraction ${E.BUY[5].toLocaleString('fr-FR')} fois. Chance bonus ajoute 25 % à la mise et fait passer les bonus d'un spin sur ${every(pn[3] + pn[4] + pn[5])} à un sur ${every(pa[3] + pa[4] + pa[5])} ; l'achat est alors indisponible. Turbo accélère les animations. Espace lance un spin.</p>
  <p>RTP : 98,5 % en jeu normal, avec Chance bonus et pour chaque achat. Gain maximum : ${E.TIER[3].cap.toLocaleString('fr-FR')}, ${E.TIER[4].cap.toLocaleString('fr-FR')} et ${E.TIER[5].cap.toLocaleString('fr-FR')} fois la mise selon le bonus. Lucioles : monnaie fictive, aucun argent réel.</p></div>
  <button class="btn" id="ovBtn">Fermer</button>`;
  $('overlay').classList.add('show'); $('ovBtn').onclick = () => $('overlay').classList.remove('show'); $('ovBtn').focus();
}

// ---------- commandes ----------
$('spin').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else spin(); };
$('autoBtn').onclick = () => { if (S.auto) { stopAuto(); msg('Spins automatiques arrêtés.'); } else if (!S.busy) chooseAuto(); };
$('buyBtn').onclick = openBuy;
$('anteBtn').onclick = () => { if (S.busy || S.auto) return; S.ante = !S.ante; $('anteBtn').classList.toggle('on', S.ante); $('anteBtn').setAttribute('aria-pressed', S.ante); setMoney(); msg(S.ante ? `Chance bonus : mise de ${fmt(cost())}, bonus plus fréquents.` : 'Chance bonus désactivée.'); };
$('turboBtn').onclick = () => { S.turbo = !S.turbo; $('turboBtn').classList.toggle('on', S.turbo); $('turboBtn').setAttribute('aria-pressed', S.turbo); };
$('musicBtn').onclick = () => { Snd.start(); const on = Snd.toggleMusic(); $('musicBtn').setAttribute('aria-pressed', on); $('musicBtn').setAttribute('aria-label', on ? 'Couper la musique' : 'Mettre la musique'); };
$('sfxBtn').onclick = () => { const on = Snd.toggleSfx(); $('sfxBtn').setAttribute('aria-pressed', on); $('sfxBtn').setAttribute('aria-label', on ? 'Couper les effets sonores' : 'Mettre les effets sonores'); };
$('infoBtn').onclick = () => { if (!$('overlay').classList.contains('show')) showRules(); };
$('betDown').onclick = () => { if (!S.busy && !S.auto && S.betIdx > 0) { S.betIdx--; setMoney(); } };
$('betUp').onclick = () => { if (!S.busy && !S.auto && S.betIdx < BETS.length - 1) { S.betIdx++; setMoney(); } };
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || $('overlay').classList.contains('show') || $('bwLayer').classList.contains('show') || $('intro').classList.contains('show') || document.body.classList.contains('bonus')) return;
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  e.preventDefault(); if (!S.auto) spin();
});
setGauge(0);
setMoney(); showStatic(E.spinBase());
})();
</script></body></html>
